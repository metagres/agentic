metadata:
  id: DES-001
  title: 'Design: agents-working-sdlc-stages-are-too-verbose-in-chat-replies'
  stage: design
  status: accepted
  version: 0.1.0
  created: 2026-09-07
  updated: 2026-09-07
  delta_reviewed: false
context_summary: This change makes agent output terse at three layers, and the design keeps every enforcement
  mechanism the toolkit already has while adding exactly one new engine concept - a shared output-discipline
  fragment. The fragment is defined once as an exported constant in a dedicated engine module, composed
  into every agent's effective prompt at registry load (the effectiveModel precedent), rendered verbatim
  as the agent file body by both opencode renderer versions, verified by a deploy-smoke marker check that
  needs no per-agent registration, and protected by a startup check that rejects descriptors embedding
  fragment text. Review stages stop enumerating passed checks - the four review step files and the stage-reviewer
  prompt are retargeted to failures-only reporting with quoted evidence and exact locations, and a one-line
  verdict when zero findings exist. Implementation notes collapse to one sentence - what changed plus
  how verified - with the write-time guard and the required-note-for-status check unchanged. No artifact
  schemas, templates, or envelope shapes change - discipline lands only in prompts, step instructions,
  and guidance text.
components:
- id: CMP-001
  name: Output-Discipline Fragment Module
  responsibility: Owns the shared output-discipline fragment as the single source of truth (FR-002) -
    a new engine module (src/scripts/lib/agent-output-discipline.ts, patterned on agent-prompt-marker.ts)
    exporting the canonical fragment text as a constant, a pure compose function (role prompt + blank
    line + fragment), and a case-insensitive marker-phrase detector derived from the fragment's own lines.
    The fragment carries a header clause (plain English sentences, no token cap), five reply rules (no
    preamble, acknowledgments, or self-introduction; no restating the user's request or step instructions;
    no recapping CLI envelope output; a finished step reported as one line naming the artifact path; blocked
    states reporting what is blocked, why, and what unblocks), and one reasoning line with the three reasoning
    rules (no restating request or instructions in reasoning, no audience-addressed filler, fragment-style
    reasoning phrased as guidance). Rules only - no examples, no role content, no repetition of stage
    instructions - and at most twelve lines (NFR-001); no telegraphic rules of any kind (AC-008). A wording
    mistake propagates to all six agents at once, so the fragment is gated by startup validation, the
    deploy smoke, and unit tests, and rollback is a one-edit change to the constant. Pure and deterministic;
    unit-testable.
- id: CMP-002
  name: Agent Registry Effective-Prompt Composition
  responsibility: Extends AgentRecord (src/scripts/lib/agent-registry.ts) with effectivePrompt, composed
    once at load as the descriptor's system_prompt verbatim, then a blank line, then the fragment (AC-004
    - additive, role text unchanged). Mirrors the effectiveModel pattern (model_override wins at surface
    time while the source keeps the recommendation) - the source YAML system_prompt is never mutated,
    and every consumer needing the deploy-time prompt reads effectivePrompt. Registry discovery, validation,
    caching, and failure behavior are unchanged.
- id: CMP-003
  name: Deploy Platform Renderers (fragment emission)
  responsibility: renderOpenCodeAgent (src/scripts/lib/deploy/platforms/opencode.ts) writes agent.effectivePrompt
    as the rendered file body for both format versions (v1 tools frontmatter and v2 permission frontmatter);
    frontmatter fields and permission translation are unchanged. The renderers hold no fragment text of
    their own and no per-agent registration - every agent discovered by the registry scan gets the fragment
    through the composed record, keeping the renderer registry the only platform-specific layer (repo
    invariant).
- id: CMP-004
  name: Deploy Smoke Fragment Gate
  responsibility: Extends the per-agent smoke loop in bin/deploy-to-agent.ts - after the existing frontmatter
    checks, the rendered body must contain the stable fragment marker phrase exported by CMP-001 (the
    DELEGATION_RULE_MARKER precedent - rewording the fragment updates the marker deliberately); a missing
    fragment fails the deploy naming the agent file (AC-003). The loop iterates the registry-scan rendered
    list, so a newly added descriptor is covered with zero registration (AC-020). Unit coverage renders
    the full roster through both renderer versions and asserts fragment presence in each (NFR-002).
- id: CMP-005
  name: Startup Unauthorized-Copy Validation
  responsibility: Extends the agent-layer cross-checks in bin/validate-policies.ts beside the prompt-purity
    check - every descriptor's system_prompt is tested against the fragment marker phrases, and any match
    fails validation naming the descriptor file and the matched marker with a new AGENT_FRAGMENT_COPY
    error code added to src/policies/errors.yaml. This is engine-level config validation like the requires-graph
    and agent-permissions checks - not a capped-catalog stage check - so the structural check catalog
    is untouched (the agent-layer DEC-009 precedent).
- id: CMP-006
  name: Review Reporting Retarget
  responsibility: Retargets the review-step markdown of all four review stages (src/stages/requirements-review/steps.yaml,
    design-review, planning-review, implementation-review) and the stage-reviewer system_prompt (src/agents/stage-reviewer.yaml)
    to failures-only reporting per DM-003 - report only blocking and advisory findings, each with quoted
    evidence and its exact location; never list passed checks; with zero findings report one line stating
    no blocking findings plus the verdict. The canonical rule wording is fixed once in this design and
    carried verbatim in all four step files - no YAML include mechanism is introduced (out of scope) and
    no new structural check is added - wording alignment is verified at design-review. The review round
    file shape, verdict flags, and append-only history are unchanged.
- id: CMP-007
  name: Implementation Note Guidance Retarget
  responsibility: Retargets the note guidance in the tasks interpreter GUARDRAILS (src/scripts/lib/kinds/tasks.ts)
    and the implementation stage steps.yaml progress step to one sentence per DM-004 - state what changed
    and how it was verified (test, lint, or manual check; the command when applicable) - sized for AI
    consumers first (implementation-review and knowledge extraction read plan.yaml). Enforcement is untouched
    - the write-time guard still rejects a done transition without a non-empty note (TASK_DONE_REQUIRES_NOTE,
    AC-015) and the required-note-for-status structural check still runs at finalize.
data_models:
- id: DM-001
  name: Output-Discipline Fragment (canonical text)
  text: 'Output discipline for every reply and every reasoning step - plain English sentences, no token
    cap:

    - No preamble, acknowledgments, or self-introduction; start with the substance.

    - Never restate the user''s request or the step instructions you were given.

    - Never recap CLI envelope or tool output the user can already see.

    - A finished step is reported in one line: what is done and the artifact path.

    - When blocked, state what is blocked, why, and what unblocks it.

    When reasoning: do not restate the request or instructions; no audience-addressed filler; reason in
    fragments of facts, options, and decisions.'
  fields: Seven lines (within the twelve-line cap) - one header clause carrying the plain-English/no-token-cap
    rule, five reply-rule bullets, one reasoning line carrying all three reasoning rules. Constraints
    - rules only, no worked examples, no role content, no repetition of stage instructions (NFR-001);
    no token cap and no telegraphic rules - no article omission, no symbol-over-words substitution, no
    first-person ban (AC-008); reasoning rules phrased as guidance with no enforcement claim and no numeric
    cap (AC-010). The blocked rule binds content under compression pressure - a blocked report must still
    carry what is blocked, why, and what unblocks. Owner - CMP-001 exported constant. Consumers - CMP-002
    composition, CMP-004 smoke marker, CMP-005 copy detection.
- id: DM-002
  name: Effective Agent Prompt (AgentRecord.effectivePrompt)
  fields: Derived value, never persisted to source YAML - the descriptor system_prompt verbatim, a blank
    line, then the fragment. Composed once at registry load; consumed by both opencode renderer versions
    as the rendered agent file body; the source descriptor keeps the role prompt only, byte-identical
    (AC-004).
- id: DM-003
  name: Review Report Shape (failures-only)
  fields: Zero findings - one line stating no blocking findings plus the verdict, no checklist enumeration.
    Findings present - each finding names its exact location (artifact, section, clause, or missing link),
    states the concrete failure, and quotes the evidence rather than paraphrasing it; advisory findings
    are marked advisory; passed checks are never listed. This constrains reviewer prose and the --findings
    file content, not the round file schema - review rounds keep their existing shape and append-only
    lifecycle (no schema change).
- id: DM-004
  name: Implementation Note (one-sentence shape)
  fields: Exactly one sentence per task note - what changed plus how it was verified, naming the test,
    lint, or manual check applied and the command when applicable. Primary consumers are implementation-review
    and knowledge extraction (AI consumers first, humans secondary). Presence is enforced exactly as today
    - write-time guard for done transitions and required-note-for-status at finalize - so the shape is
    guidance, not a schema constraint.
apis:
- id: API-001
  path: OUTPUT_DISCIPLINE_FRAGMENT / composeEffectivePrompt(systemPrompt)
  method: internal
  description: The exported canonical fragment constant and the pure composition function from CMP-001;
    compose returns the role prompt, a blank line, and the fragment, and never mutates its input. Deterministic;
    the registry calls it once per descriptor at load.
- id: API-002
  path: findFragmentMarkers(prompt)
  method: internal
  description: Case-insensitive detection of the fragment marker phrases in a prompt - returns the matched
    markers in list order without duplicates, empty when clean (the findPromptMarkers pattern). Consumed
    by the validate-policies unauthorized-copy check and by unit tests; markers are exported beside the
    fragment text so they cannot drift from it.
- id: API-003
  path: AgentRecord.effectivePrompt
  method: internal
  description: The composed deploy-time prompt surfaced by the agent registry beside effectiveModel; consumed
    by both opencode renderer versions as the rendered file body. Absent from source YAML by construction.
flows:
- id: FLW-001
  name: Deploy-time fragment flow
  steps:
  - loadAgentRegistry parses each src/agents/*.yaml descriptor and composes effectivePrompt (role prompt
    + fragment) once at load; source YAML is never mutated.
  - The selected renderer (opencode v1 or v2) writes the composed prompt as the agent file body; frontmatter
    is unchanged.
  - The deploy smoke reads each rendered file, requires the fragment marker phrase, and fails the deploy
    naming the agent file when the fragment is missing.
  - A real deploy (npm run deploy -- --dest .opencode --clean) refreshes the production runtime before
    lifecycle work continues (invariant 12); deploy:smoke builds to .tmp/agent only - if the smoke fails
    after renderer changes, .opencode/ is not refreshed and lifecycle work halts until the renderer is
    fixed.
- id: FLW-002
  name: Startup validation flow (agent layer)
  steps:
  - validate-policies parses each agent descriptor against the agent meta-schema and runs the model-field
    cross-check (unchanged).
  - The prompt-purity marker check runs over every system_prompt (unchanged).
  - The new unauthorized-copy check tests every system_prompt against the fragment marker phrases - any
    match fails with AGENT_FRAGMENT_COPY naming the descriptor.
  - Stage reference resolution and permission compatibility run unchanged after the agent checks.
- id: FLW-003
  name: Failures-only review reporting flow
  steps:
  - The reviewer runs the review step and evaluates the artifact against schema, structural checks, and
    the semantic checklist as today.
  - The reviewer reports only blocking and advisory findings, each with quoted evidence and its exact
    location - passed checks are never enumerated.
  - With zero findings the reviewer reports one line stating no blocking findings plus the verdict.
  - Verdict flags, round append-only history, and the review gate are unchanged.
- id: FLW-004
  name: Implementation note flow
  steps:
  - The implementation engineer completes a task and passes --note with one sentence - what changed plus
    how verified.
  - The write-time guard rejects a done transition with an empty note (TASK_DONE_REQUIRES_NOTE), unchanged.
  - GUARDRAILS and the implementation steps carry the one-sentence guidance so the note is shaped correctly
    at write time.
  - At finalize, required-note-for-status re-checks terminal tasks for non-empty notes - implementation-review
    and knowledge extraction consume the note as the record of what was done and how it was proven.
decisions:
- id: DEC-001
  title: Fragment composition lives in the agent registry, not the renderers
  context: The fragment must reach every rendered agent across both renderer formats with no per-agent
    registration and no renderer duplication - the effectiveModel pattern already established registry-level
    composition of effective values (agent-layer DEC-004).
  decision: AgentRecord gains effectivePrompt composed once at registry load (role prompt, blank line,
    fragment); renderers emit it verbatim; source YAML is never mutated. Any future platform renderer
    inherits the fragment for free by reading the composed record.
  status: accepted
- id: DEC-002
  title: The fragment's single source is an exported engine constant, not a YAML asset
  context: FR-002 demands one source of truth rendered into every agent - a YAML include mechanism is
    out of scope, and the text must be importable by the registry, renderers, smoke test, and startup
    validation alike.
  decision: The fragment lives as an exported constant in a dedicated engine module (src/scripts/lib/agent-output-discipline.ts)
    beside its compose and detection helpers - the agent-prompt-marker.ts pattern. No new config surface,
    no schema change, no build step.
  status: accepted
- id: DEC-003
  title: Unauthorized-copy detection via distinctive marker phrases
  context: AC-006 requires rejecting agent descriptors whose system_prompt embeds the fragment - exact
    full-text matching is brittle (whitespace drift breaks it) and would miss near-copies; detection must
    be deterministic and unit-testable.
  decision: The fragment module exports distinctive marker phrases derived from its own text - validate-policies
    fails any descriptor prompt containing one, naming the file and marker (new AGENT_FRAGMENT_COPY code
    in src/policies/errors.yaml). Markers live beside the text so they cannot drift from it - rewording
    the fragment updates its markers deliberately.
  status: accepted
- id: DEC-004
  title: No agent meta-schema structural change - the fragment contract is engine-level validation
  context: The requirements' touch list names the agent meta-schema, but a schema-level ban would have
    to duplicate fragment text into a draft-07 regex (fragile, and it violates the single-source rule),
    while per-agent fragment fields are explicitly out of scope.
  decision: The meta-schema stays structurally unchanged - its system_prompt description documents the
    role-voice-only contract, and enforcement lives in the validate-policies agent-layer check beside
    prompt purity. The capped structural-check catalog is untouched - agent-descriptor validation is engine-level
    config validation, not a stage-artifact check.
  status: accepted
- id: DEC-005
  title: Failures-only review wording is a text retarget with no new catalog check
  context: AC-011 is inspection-based (the step markdown is inspected) - prose wording is not a structural
    concern, and adding a capped-catalog check for it would be a design-review event with no mechanical
    payoff - a YAML include mechanism is out of scope, so the four step files must repeat the rule.
  decision: The canonical failures-only rule is fixed once in this design (DM-003) and carried verbatim
    in the four review steps.yaml files and the stage-reviewer prompt - alignment is verified at design-review,
    not by a structural check.
  status: accepted
- id: DEC-006
  title: R3 changes guidance only - both enforcement mechanisms stay
  context: The note guard (TASK_DONE_REQUIRES_NOTE) and required-note-for-status already enforce note
    presence - verbosity came from guidance that invited narration, and the primary consumers of notes
    are AI agents.
  decision: Only the guidance text in GUARDRAILS and the implementation steps changes, to the one-sentence
    what-changed-plus-how-verified rule - the write-time guard and the structural check keep their exact
    behavior (AC-015).
  status: accepted
