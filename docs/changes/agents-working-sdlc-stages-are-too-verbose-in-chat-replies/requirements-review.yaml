    semantic:
      results:
        - check_id: Does every Then-clause in acceptance_criteria describe an observable external result (HTTP
            response, persisted file, log line), not an internal function call?
          status: pass
          evidence: AC-001/AC-003 assert rendered-file and smoke-test outcomes; AC-015 asserts CLI rejection
            with TASK_DONE_REQUIRES_NOTE (src/policies/errors.yaml:57,
            src/scripts/lib/kinds/tasks.ts:291)
        - check_id: Does each AC assert system behavior under test, not the existence of tests or a process
            step?
          status: pass
          evidence: AC-003 asserts smoke-test failure naming the agent file; AC-006 asserts validation failure
            naming the descriptor; no AC asserts test existence
        - check_id: Does at least one acceptance criterion cover a boundary or negative case?
          status: pass
          evidence: AC-002, AC-003, AC-006, AC-008, AC-010, AC-012, AC-015, AC-016, AC-018, AC-020 carry
            negative/boundary/edge categories
        - check_id: Does each FR whose behavior could fail or be misused have at least one AC covering a
            negative path?
          status: pass
          evidence: FR-001 to AC-003, FR-002 to AC-006, FR-005 to AC-012, FR-006 to AC-015; FR-003/FR-004
            content rules covered by boundary AC-008/AC-010
        - check_id: Is no critical assumption left unverified unless explicitly accepted as a residual risk?
          status: pass
          evidence: "Both unverified assumptions are severity low and explicitly accepted: DL-004 records
            reasoning rules as habit-shifting only, never enforced, accepted as such; failure_paths
            entry 1 records the accepted degradation"
        - check_id: Does each verified assumption source reference a plausible repo path or evidence location?
          status: pass
          evidence: "Verified directly: all 9 src/stages/*/stage.yaml files carry agent bindings to exactly
            six agents present in src/agents/; src/scripts/lib/deploy/platforms/opencode.ts:95
            renders agent.systemPrompt verbatim as the rendered file body for v1 and v2"
        - check_id: Does each risk have a corresponding failure_paths entry, and each unverified assumption a
            corresponding risk entry?
          status: pass
          evidence: Four risks_and_dependencies entries map one-to-one onto the four failure_paths entries;
            both unverified assumptions carry risk fields; assumption-2 prompt-length risk is
            bounded by NFR-001/AC-018
        - check_id: Do any functional requirements contradict the out_of_scope list, another FR, or an NFR?
          status: pass
          evidence: FR-003 no-token-cap aligns with out_of_scope token caps; FR-004 guidance-only aligns with
            out_of_scope hard enforcement; FR-002 single-source render aligns with out_of_scope YAML
            include; FR-005/FR-006 touch steps.yaml and GUARDRAILS, not artifact schemas or
            templates
        - check_id: Does the problem statement describe the problem, not a solution?
          status: pass
          evidence: Problem statement describes verbose chat, buried findings, bloated notes, and the current
            gap that stage prompts and step instructions say nothing about output shape; it proposes
            no solution
        - check_id: Could any requirement or acceptance criterion be read in more than one way by a machine
            consumer? If so, split it, add precision, or record a discovery question.
          status: pass
          evidence: All FRs and ACs carry ids, triggers, responses, and categories; no clause admits two
            machine readings
        - check_id: Is each requirement description phrased in EARS form (When <trigger>, the system shall
            <response>) or an equally unambiguous pattern?
          status: pass
          evidence: All six FRs and both NFRs follow the When-trigger the-system-shall-response pattern
        - check_id: Does each requirement describe exactly one verifiable behavior, with no conjunctions
            joining unrelated behaviors?
          status: pass
          evidence: FR-003 five reply rules are one fragment-content behavior verified by AC-007; rules are
            related facets of the same artifact content, not unrelated behaviors
        - check_id: Do the acceptance criteria nested under the functional and non-functional requirements
            cover happy, edge, negative, and boundary cases for the core behaviors, with each
            criterion verifying the requirement that carries it?
          status: pass
          evidence: Every FR carries happy plus at least one of edge/negative/boundary; each AC verifies its
            carrying requirement (AC-015 verifies FR-006 enforcement, AC-003 verifies FR-001
            rendering)
        - check_id: Do delta entries plausibly describe the living docs affected by the requirements?
          status: pass
          evidence: "docs/current/architecture.md and docs/current/conventions.md exist; delta reasons match:
            architecture for deploy-time shared fragment rendering, conventions for output
            discipline rules"
    warnings: []
