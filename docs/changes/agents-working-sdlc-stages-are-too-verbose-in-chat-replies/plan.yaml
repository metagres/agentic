  - id: TASK-009
    title: Refresh the production runtime with a real deploy
    description: "Refresh .opencode/ per invariant 12 (FLW-001). Only after TASK-008 passes: run npm run
      deploy -- --dest .opencode --clean, which writes the production runtime and smoke-tests the
      deployed CLI at the target. Verify every rendered agent file under .opencode/agents/ carries
      the fragment marker in its body (AC-001 at production, AC-005 single-source match) and that
      lifecycle commands execute through the refreshed runtime, e.g. node
      .opencode/skills/agentic-sdlc/scripts/sdlc.js planning --change
      agents-working-sdlc-stages-are-too-verbose-in-chat-replies. Lifecycle work continues only
      through the refreshed .opencode/ bundle - envelopes enforce the deployed bundle, so a stale
      runtime silently enforces stale contracts."
