risks:
  - id: RISK-001
    description: Prompt-level reasoning rules may not shift model reasoning habits; reasoning may stay
      verbose while substance remains correct.
    mitigation: Accepted as habit-shifting guidance per the design - no enforcement exists at the
      system-prompt layer and none is attempted; the failure path is accepted in the requirements.
  - id: RISK-002
    description: The fragment is one constant rendered into all six agents, so a wording mistake
      propagates to every agent at once.
    mitigation: Single-source constant gated by startup validation (AGENT_FRAGMENT_COPY), the deploy
      smoke marker gate, and unit tests asserting the content rules; rollback is a one-edit change
      to the constant.
  - id: RISK-003
    description: Compression pressure could push agents to omit unblock details when reporting blocked states.
    mitigation: The blocked rule binds content - what is blocked, why, and what unblocks - and no token
      cap is imposed; chat review catches violations.
  - id: RISK-004
    description: A renderer or smoke failure after the change blocks the .opencode refresh and halts
      lifecycle work under invariant 12.
    mitigation: TASK-008 runs deploy:smoke against .tmp/agent before the real deploy; deploy:smoke never
      touches .opencode, so a failure leaves the production runtime untouched while the renderer is
      fixed.
  - id: RISK-005
    description: The retargeted reviewer prompt text could trip the prompt-purity markers or the new
      fragment-copy detection.
    mitigation: The failures-only wording is carried verbatim from design DM-003, TASK-005 lands the
      copy-detection gate before TASK-006 authors the new text, and npm run validate fails fast
      naming the offending descriptor.
