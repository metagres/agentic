metadata:
  id: PLAN-001
  title: "Plan: agents-working-sdlc-stages-are-too-verbose-in-chat-replies"
  stage: planning
  status: accepted
  version: 0.1.0
  created: 2026-09-07
  updated: 2026-09-07
  implementation_status: accepted
  delta_reviewed: true
tasks:
  - id: TASK-001
    title: Create the output-discipline fragment module (single source of truth)
    description: "Create src/scripts/lib/agent-output-discipline.ts patterned on
      src/scripts/lib/agent-prompt-marker.ts (CMP-001, DM-001, API-001, API-002, DEC-002). Export
      OUTPUT_DISCIPLINE_FRAGMENT carrying the canonical seven-line fragment text verbatim from
      design DM-001: one header clause with the plain-English/no-token-cap rule, five reply-rule
      bullets (no preamble, acknowledgments, or self-introduction; never restate the user's request
      or step instructions; never recap CLI envelope or tool output; a finished step reported in one
      line naming the artifact path; blocked states reporting what is blocked, why, and what
      unblocks), and one reasoning line carrying the three reasoning rules phrased as guidance.
      Rules only - no worked examples, no role content, no repetition of stage instructions, at most
      twelve lines, no token cap, no telegraphic rules. Export composeEffectivePrompt(systemPrompt)
      returning the role prompt, one blank line, then the fragment, never mutating its input. Export
      findFragmentMarkers(prompt) with distinctive marker phrases derived from the fragment's own
      lines - case-insensitive, marker-list order, no duplicates, empty when clean - exported beside
      the text so they cannot drift from it. Create test/unit/agent-output-discipline.test.ts
      asserting: fragment fits the twelve-line cap; all five reply rules and all three reasoning
      rules appear; no token-count cap and no telegraphic wording; the reasoning rules carry no
      enforcement claim or numeric cap; compose output shape and input immutability; marker
      detection hits and a clean-prompt miss. Verify with npm run validate (typecheck plus unit
      tests)."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-002
      - FR-003
      - FR-004
      - NFR-001
    acceptance_ids:
      - AC-005
      - AC-007
      - AC-008
      - AC-009
      - AC-010
      - AC-017
      - AC-018
    design_refs:
      - DEC-002
      - DEC-003
    depends_on: []
    files:
      - path: src/scripts/lib/agent-output-discipline.ts
        operation: create
      - path: test/unit/agent-output-discipline.test.ts
        operation: create
    started_at: 2026-09-07
    files_changed:
      - path: src/scripts/lib/agent-output-discipline.ts
        operation: create
      - path: test/unit/agent-output-discipline.test.ts
        operation: create
    implementation_note: Created the output-discipline fragment module exporting the verbatim DM-001
      seven-line fragment, composeEffectivePrompt, findFragmentMarkers, and the marker constants
      with 12 unit tests; verified with npm run validate (308 tests pass).
    completed_at: 2026-09-07
  - id: TASK-002
    title: Compose effectivePrompt in the agent registry
    description: "Extend the agent registry with the composed deploy-time prompt (CMP-002, DM-002,
      API-003, DEC-001). Modify src/scripts/lib/agent-registry.ts: add effectivePrompt to
      AgentRecord, composed once at load in loadAgentFile via composeEffectivePrompt(systemPrompt)
      from the fragment module - the descriptor system_prompt verbatim, a blank line, then the
      fragment. The source YAML systemPrompt field is never mutated; registry discovery, meta-schema
      validation, caching, and failure behavior are unchanged; this mirrors the effectiveModel
      pattern (model_override wins at surface time while the source keeps the recommendation).
      Extend test/unit/agent-registry.test.ts: every loaded record exposes effectivePrompt equal to
      systemPrompt plus blank line plus fragment, and the source systemPrompt stays byte-identical
      (AC-004 - additive composition, role text unchanged). Verify with npm run validate."
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
    acceptance_ids:
      - AC-004
    design_refs:
      - DEC-001
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
    started_at: 2026-09-07
    files_changed:
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
    implementation_note: Added AgentRecord.effectivePrompt composed once at load via
      composeEffectivePrompt with the source systemPrompt untouched, plus registry tests asserting
      additive composition and byte-identical role text; verified with npm run validate (310 tests
      pass).
    completed_at: 2026-09-07
  - id: TASK-003
    title: Emit the composed prompt from both opencode renderer versions
    description: "Make the renderers write the composed prompt (CMP-003, DM-002, DEC-001). Modify
      src/scripts/lib/deploy/platforms/opencode.ts: renderOpenCodeAgent writes agent.effectivePrompt
      as the rendered file body for both format versions - v1 (tools frontmatter) and v2 (permission
      frontmatter). Frontmatter fields and permission translation are unchanged; the renderer holds
      no fragment text of its own and no per-agent registration - every agent discovered by the
      registry scan gets the fragment through the composed record. Extend
      test/unit/deploy-platforms.test.ts: render the full six-agent roster through both renderer
      versions and assert the fragment marker phrase appears in every rendered body while
      frontmatter fields are unchanged (AC-001, AC-002 across all modes, AC-005 single-source match,
      NFR-002). Verify with npm run validate."
    type: implementation
    status: done
    complexity: low
    covers:
