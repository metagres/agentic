  - id: TASK-004
    title: Gate the deploy smoke on fragment presence in every rendered agent
    description: "Extend the deploy smoke with the fragment gate (CMP-004, AC-003, AC-019, AC-020).
      Modify bin/deploy-to-agent.ts: in the smoke section, after the existing checks, require each
      rendered agent file body to contain the stable fragment marker phrase imported from
      src/scripts/lib/agent-output-discipline.ts - the DELEGATION_RULE_MARKER precedent (line 165):
      rewording the fragment updates the marker deliberately. A missing fragment fails the deploy
      naming the agent file. The loop iterates the registry-scan rendered list, so a newly added
      descriptor is covered with zero per-agent registration. Verify with npm run deploy:smoke
      (builds to .tmp/agent only, never touches .opencode) passing with the fragment check reported
      for every rendered agent, and confirm the fail path names the offending agent file."
    type: implementation
    status: done
