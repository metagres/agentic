  - id: TASK-006
    title: Retarget review reporting to failures-only across the four review stages
    description: "Retarget the review-step markdown and reviewer prompt to failures-only reporting
      (CMP-006, DM-003, DEC-005). Modify the review-step markdown in all four review stage step
      files - src/stages/requirements-review/steps.yaml, src/stages/design-review/steps.yaml,
      src/stages/planning-review/steps.yaml, src/stages/implementation-review/steps.yaml - and the
      system_prompt in src/agents/stage-reviewer.yaml: carry the canonical failures-only rule
      verbatim from design DM-003 - report only blocking and advisory findings, each naming its
      exact location (artifact, section, clause, or missing link) and quoting the evidence rather
      than paraphrasing it; never list passed checks; with zero findings report one line stating no
      blocking findings plus the verdict. No YAML include mechanism and no new structural check; the
      review round file shape, verdict flags, and append-only history are unchanged. Verify with npm
      run validate (prompt purity and the AGENT_FRAGMENT_COPY gate run over the retargeted prompt;
      stage folder validation covers the step files) and inspect each of the four review-step
      markdowns for the rule (AC-011, AC-012, AC-013)."
