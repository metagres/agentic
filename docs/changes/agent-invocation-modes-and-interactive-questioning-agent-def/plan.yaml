risks:
  - risk: "The deploy e2e suite pins mode: subagent on rendered agents; the renderer change flips the
      default to all."
    impact: E2e fails until its assertions are updated in the same task.
    mitigation: TASK-003 owns both the renderer change and the assertion updates.
    severity: low
  - risk: The legacy v1 tools.question mapping is unverifiable against a live v1 runtime.
    impact: The v1 variant may need adjustment if a real v1 target appears.
    mitigation: Isolated variant covered by unit tests against the documented shape.
    severity: low
