tasks:
  - id: TASK-001
    title: Add mode field and question key to agent schema and registry
    description: >
      Extend src/schemas/agent.schema.yaml: optional top-level mode (string enum subagent, primary,
      all; NOT required) and permissions gains a required seventh key question (enum allow, ask,
      deny) beside the existing six keys. Extend AgentRecord in src/scripts/lib/agent-registry.ts
      with mode: string, normalized to 'all' when the descriptor omits it. Update registry unit
      tests: omitted mode resolves to all, explicit subagent/primary/all parse through, unknown mode
      value fails schema validation naming the file, missing question key fails naming the file.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
      - FR-002
      - FR-004
    acceptance_ids:
      - AC-001
      - AC-003
      - AC-004
    design_refs:
      - DEC-001
    depends_on: []
    files:
      - path: src/schemas/agent.schema.yaml
        operation: modify
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: "Schema gains optional mode enum and required question key; registry normalizes
      omitted mode to all; 4 new registry tests. Verified: unit tests and typecheck exit 0."
    files_changed:
      - path: src/schemas/agent.schema.yaml
        operation: modify
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
  - id: TASK-002
    title: Grant question permissions across the roster
    description: >
      Add permissions.question to the six definitions under src/agents/: allow on
      requirements-analyst.yaml, deny on systems-architect.yaml, task-planner.yaml,
      implementation-engineer.yaml, stage-reviewer.yaml, and knowledge-curator.yaml. No mode lines
      (the all default applies). Verify npm run validate:policies passes including the permission
      compatibility check over the real roster and stage bindings.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-005
      - NFR-001
    acceptance_ids:
      - AC-002
      - AC-006
    design_refs:
