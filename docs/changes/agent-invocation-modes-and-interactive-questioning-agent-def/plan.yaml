        operation: modify
  - id: TASK-003
    title: Emit mode and translate question in the platform renderer
    description: >
      Extend src/scripts/lib/deploy/platforms/opencode.ts: both version variants emit the resolved
      mode verbatim into the frontmatter, and the neutral-to-target translation maps question to the
      target question key (v2 permission.question carries the neutral level; v1 tools.question maps
      allow to true, deny to false, ask omitted). Update test/unit/deploy-platforms.test.ts for mode
      emission (default all from an omitted-mode fixture, explicit subagent passthrough) and
      question translation (allow/deny/ask in v2, true/false/omitted in v1). Update
      test/e2e/deploy.test.ts where it pins mode: subagent — rendered agents now carry mode: all,
      and the requirements-analyst file must show permission.question allow while others deny.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-003
      - FR-005
    acceptance_ids:
      - AC-001
      - AC-002
      - AC-005
    design_refs:
      - DEC-003
    depends_on:
