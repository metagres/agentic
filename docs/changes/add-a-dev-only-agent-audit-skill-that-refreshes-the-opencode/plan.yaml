tasks:
  - id: TASK-001
    title: Extend agent meta-schema with optional model_override field
    description: >
      Add an optional model_override property to src/schemas/agent.schema.yaml: type string,
      minLength 1, not added to required, and not constrained by the model catalog enum, while
      additionalProperties stays false. The model field remains required and enum-checked, and the
      enum itself is left exactly as-is (the opencode-go/* values stay until the first audit run
      refreshes and migrates them). Schema validation must accept free-form values such as
      anthropic/claude-opus or gpt-5 and reject an empty string.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-009
      - FR-010
    acceptance_ids:
      - AC-012
      - AC-015
    design_refs:
      - DEC-003
    depends_on: []
    files:
      - path: src/schemas/agent.schema.yaml
        operation: modify
    implementation_note: Added optional model_override (string, minLength 1) to
      src/schemas/agent.schema.yaml; not in required, not enum-constrained; model enum untouched;
      validate:schemas green
    started_at: 2026-08-26
    files_changed:
      - path: src/schemas/agent.schema.yaml
        operation: modify
    completed_at: 2026-08-26
  - id: TASK-002
    title: Expose modelOverride and effectiveModel in the agent registry
    description: >
      Extend src/scripts/lib/agent-registry.ts. AgentRecord gains modelOverride (string | null) and
      effectiveModel (string, computed as modelOverride ?? model). loadAgentFile parses the optional
      model_override field (schema validation already runs via validateWithSchema) and populates the
      extended record; caching and resolveAgentsDir behavior are unchanged. Extend
      test/unit/agent-registry.test.ts with fixture cases: a descriptor with model_override exposes
      the triple (model, modelOverride, effectiveModel = override), and a descriptor without it
      exposes modelOverride null and effectiveModel equal to model.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-011
      - NFR-003
    acceptance_ids:
      - AC-016
    design_refs:
      - DEC-004
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
    implementation_note: AgentRecord gains modelOverride (string|null) and effectiveModel (=
      modelOverride ?? model); loadAgentFile parses model_override; unit tests extended with
      override/no-override/empty-override fixtures; test:unit 169 pass
    started_at: 2026-08-26
    files_changed:
      - path: src/scripts/lib/agent-registry.ts
        operation: modify
      - path: test/unit/agent-registry.test.ts
        operation: modify
    completed_at: 2026-08-26
  - id: TASK-003
    title: Reject empty model_override in policy validation with a dedicated error code
    description: >
      Extend the per-agent-file cross-check loop in bin/validate-policies.ts to reject an empty
      model_override value, naming the offending file and the empty value, and add a new error code
      entry (message + fix) to src/policies/errors.yaml for this case alongside the existing AGENT_*
      codes. The existing Ajv enum-membership failure for model already names the file and offending
      value and stays unchanged. The new check must be deterministic and unit-testable (extract a
      small pure helper if the top-level script cannot be exercised directly), with unit tests
      covering: empty model_override fails naming file and value, a model outside the enum fails
      naming file and value, and free-form non-empty overrides pass.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-010
      - NFR-002
    acceptance_ids:
      - AC-013
      - AC-014
      - AC-021
    design_refs:
      - DEC-003
      - DEC-006
    depends_on:
      - TASK-001
    files:
      - path: bin/validate-policies.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
      - path: test/unit/validate-policies-agents.test.ts
        operation: create
    implementation_note: Extracted pure checkAgentModelFields helper
      (src/scripts/lib/agent-model-fields.ts); wired into bin/validate-policies.ts per-agent loop
      reading the catalog enum from agent.schema.yaml; added AGENT_MODEL_OVERRIDE_EMPTY +
      AGENT_MODEL_OUTSIDE_CATALOG to errors.yaml; new test/unit/validate-policies-agents.test.ts
      covers empty override, outside-enum model, free-form pass; validate:policies + test:unit green
    started_at: 2026-08-26
    files_changed:
      - path: bin/validate-policies.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
      - path: test/unit/validate-policies-agents.test.ts
        operation: create
      - path: src/scripts/lib/agent-model-fields.ts
        operation: create
    completed_at: 2026-08-26
  - id: TASK-004
    title: Render effectiveModel in deployment output
    description: >
      Extend the OpenCode renderer (src/scripts/lib/deploy/platforms/opencode.ts) so
      renderOpenCodeAgent writes AgentRecord.effectiveModel into the frontmatter model field in both
      v1 and v2 variants, and update bin/deploy-to-agent.ts smoke verification to validate the
      rendered effective model rather than the source model. The source YAML model field is never
      mutated by deployment and remains the team recommendation. Extend test/e2e/deploy.test.ts with
      coverage for an agent carrying model_override (rendered frontmatter model equals the override)
      and an agent without it (rendered model equals the recommendation, source YAML unchanged), and
      refresh test/unit/deploy-platforms.test.ts fixtures for the extended AgentRecord shape.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-012
      - NFR-002
      - NFR-003
    acceptance_ids:
      - AC-017
      - AC-018
      - AC-021
    design_refs:
      - DEC-004
      - DEC-006
    depends_on:
      - TASK-002
    files:
      - path: src/scripts/lib/deploy/platforms/opencode.ts
        operation: modify
      - path: bin/deploy-to-agent.ts
        operation: modify
      - path: test/e2e/deploy.test.ts
        operation: modify
      - path: test/unit/deploy-platforms.test.ts
        operation: modify
    implementation_note: renderOpenCodeAgent writes agent.effectiveModel into frontmatter model for
      v1+v2; deploy smoke verification now asserts rendered model equals effectiveModel; e2e deploy
      test extended with source-vs-rendered effective-model loop check and a dedicated
      override/no-override fixture test; deploy-platforms unit fixtures refreshed with
      modelOverride/effectiveModel; deploy:smoke passed
    started_at: 2026-08-26
    files_changed:
      - path: src/scripts/lib/deploy/platforms/opencode.ts
        operation: modify
      - path: bin/deploy-to-agent.ts
        operation: modify
      - path: test/e2e/deploy.test.ts
        operation: modify
