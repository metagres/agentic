risks:
  - id: RISK-001
    description: >
      The opencode/<id> qualification is fixed by stakeholder instruction; if the opencode runtime
      resolves provider qualifications differently, rendered agents pass validation but fail at
      runtime.
    severity: medium
    mitigation: >
      npm run deploy:smoke and the first real run give early signal; the renderer prefix mapping in
      src/scripts/lib/deploy/platforms/opencode.ts is the fix point.
  - id: RISK-002
    description: >
      The live catalog can change between fetch and merge, so the committed enum may be stale on
      arrival and validation fails on removed ids.
    severity: medium
    mitigation: >
      Re-run the agent-audit skill to refresh; validation names the stale file and value, which is
      the designed failure path.
  - id: RISK-003
    description: >
      Web benchmark coverage varies per model, especially for newly listed models, so LLM-grounded
      assignments may be suboptimal.
    severity: low
    mitigation: >
      The skill records grounding sources in its output; the reviewable git diff, the review stages,
      and npm run validate are the acceptance controls.
  - id: RISK-004
    description: >
      Roster dedupe/add/remove rewrites stage.yaml bindings, touching pipeline topology
      configuration.
    severity: low
    mitigation: >
      Unresolved-reference and permission-compatibility failures surface immediately via npm run
      validate naming stage, agent, and key; the fix is another audit pass or a manual correction.
