  - id: TASK-006
    title: Author the dev-only agent-audit skill
    description: >
      Create src/skills/agent-audit/SKILL.md following the SKILL.md folder protocol (mirror
      src/skills/knowledge-init/; frontmatter name equals the folder name with a non-empty
      description, enforced by bin/validate-templates.ts). The skill instructs the executing LLM to:
      (1) fetch GET http://opencode.ai/zen/go/v1/models first and, on any non-2xx response, fail
      naming the URL and HTTP status without rewriting any file; (2) rewrite the model enum in
      src/schemas/agent.schema.yaml to exactly the sorted opencode/<id> qualifications built from
      the fetched entries, migrating every surviving opencode-go/<id> value in the schema enum and
      in src/agents/*.yaml model fields so no opencode-go/ prefix remains; (3) per agent, assign a
      best-fit model from the fetched list by consulting trusted web benchmarks against the bound
      stage's purpose, never modifying an existing model_override; (4) realign temperature,
      description, and system_prompt with the bound stage's instructions, rewriting only fields
      judged better aligned; (5) auto-fix agent permissions by comparing them against each bound
      stage's effective requirements using the same logic as computeEffectivePermissions and
      checkAgentCompatibility from src/scripts/lib/agent-permissions.ts, looping until every binding
      passes; (6) deduplicate identical agent definitions to one survivor, add agents where a stage
      purpose is unserved, remove agents no stage needs, and update every affected stage.yaml
      binding accordingly; (7) finish only when npm run validate passes with zero findings,
      recording which web sources grounded each assignment. The skill contains no hardcoded
      agent-specific paths and is excluded from the deployed bundle (bin/deploy-to-agent.ts deploys
      only agentic-sdlc and knowledge-init).
    type: implementation
    status: done
    complexity: high
    covers:
      - FR-001
      - FR-002
      - FR-003
      - FR-004
      - FR-005
      - FR-006
      - FR-007
      - FR-008
