      - AC-002
      - AC-003
      - AC-004
      - AC-005
      - AC-006
      - AC-007
      - AC-008
      - AC-009
      - AC-010
      - AC-011
      - AC-020
      - AC-021
    design_refs:
      - DEC-001
      - DEC-002
      - DEC-003
      - DEC-005
      - DEC-006
      - DEC-007
    depends_on:
      - TASK-001
      - TASK-002
      - TASK-003
      - TASK-004
      - TASK-005
    files:
      - path: src/skills/agent-audit/SKILL.md
        operation: create
    implementation_note: "Created src/skills/agent-audit/SKILL.md following the folder protocol:
      fetch-first with non-2xx abort naming URL+status, enum rewrite to sorted opencode/<id> with
      opencode-go/ migration, web-grounded model assignment with grounding report never touching
      model_override, temperature/description/system_prompt realignment, permission auto-fix per
      computeEffectivePermissions/checkAgentCompatibility semantics, roster dedupe/add/remove with
      stage.yaml rebinding, npm run validate gate, scope limits (dev-only, .opencode untouched).
      validate:templates green; deploy e2e re-run confirms bundle still ships exactly two skills"
    started_at: 2026-08-26
    files_changed:
      - path: src/skills/agent-audit/SKILL.md
        operation: create
    completed_at: 2026-08-26
