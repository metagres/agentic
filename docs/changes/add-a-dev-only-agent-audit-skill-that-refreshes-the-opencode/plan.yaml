        operation: modify
      - path: src/scripts/workflows/status.ts
        operation: modify
      - path: test/unit/list-workflows.test.ts
        operation: modify
    implementation_note: listWorkflows stage entries and status pipeline entries now spread
      getAgentModelFields (new registry helper returning {model, effectiveModel} for bound agents,
      {} otherwise); agent field unchanged as binding id; no new top-level envelope fields;
      list-workflows tests extended (bound pair surfacing, unbound/cross-cutting absence, fixture
      override resolution) plus status pipeline assertions; test:unit 178 pass; manual
      --list-workflows and status runs verified
    started_at: 2026-08-26
    files_changed:
      - path: src/scripts/workflows/index.ts
        operation: modify
      - path: src/scripts/workflows/status.ts
        operation: modify
