  - id: TASK-005
    title: Surface recommended and effective model in CLI data
    description: >
      Extend src/scripts/workflows/index.ts (listWorkflows) and src/scripts/workflows/status.ts
      (pipeline entries) so every surfaced agent entry in envelope data carries both the recommended
      model and the effectiveModel (modelOverride ?? model), making an override visible without
      reading source files. data.workflows[].agent stays the binding id, no new top-level envelope
      fields are introduced, and the change lives entirely inside the existing data object. Update
      test/unit/list-workflows.test.ts to assert both values appear for bound agents and that
      cross-cutting workflows keep agent null without model fields.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-013
    acceptance_ids:
      - AC-019
    design_refs:
      - DEC-004
    depends_on:
