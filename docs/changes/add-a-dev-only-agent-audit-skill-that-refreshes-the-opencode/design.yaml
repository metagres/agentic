      is refreshed from the live opencode catalog (opencode/<id> qualifications migrated from
      opencode-go/*) rather than hand-maintained.
    date: 2026-08-26
  - phase: Design
    target_doc: docs/current/capabilities.md
    target_anchor: Capabilities
    change: Modify
    reason: Add the agent-audit capability (live catalog refresh, LLM-driven best-fit model assignment
      with web grounding, parameter realignment, permission auto-fix, roster dedupe/add/remove with
      rebinding) and the model-override capability (recommendation preserved, override wins,
      override not enum-checked).
    date: 2026-08-26
  - phase: Design
    target_doc: docs/current/api-contract.md
    target_anchor: Endpoints (CLI Commands)
    change: Modify
    reason: Document the agent descriptor model_override field (optional non-empty free-form),
      AgentRecord effectiveModel computation (model_override ?? model), deployment rendering of
      effectiveModel into frontmatter, and CLI surfacing of both recommended and effective model
      values.
    date: 2026-08-26
  - phase: Design
    target_doc: docs/current/glossary.md
    change: Add
    reason: Add the Agent Audit entity (dev-only skill under src/skills/agent-audit/, inputs/outputs,
      failure modes) and the Model Override entity (model vs model_override vs effectiveModel) with
      their fields and relationships.
    date: 2026-08-26
  - phase: Design
    target_doc: docs/current/conventions.md
    target_anchor: File Organization
    change: Modify
    reason: Document the dev-only skill convention for the agent audit under src/skills/ and the
      model_override convention (recommendation preserved in model, override wins at deploy,
      override not enum-checked, audit never overwrites existing override).
    date: 2026-08-26
  - phase: Design
    target_doc: docs/current/operations.md
    target_anchor: Commands
    change: Modify
