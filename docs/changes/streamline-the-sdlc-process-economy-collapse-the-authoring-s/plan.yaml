  - id: TASK-009
    title: Add batch answer recording and word-boundary slugs
    description: >
      --record-answers <file> records a YAML array of lens, question, answer entries sequentially in
      one call (reuse single-answer validation per entry). Change slug generation breaks at word
      boundaries within the length budget, lowercases, strips punctuation, never leaves a trailing
      hyphen; applies at change creation. Unit tests for slug cases (long titles, punctuation,
      exact-budget words) and batch recording. Files: src/stages/requirements/hooks.ts or authoring
      flag handling,  src/scripts/lib/stage-helpers.ts (titleFromRequest/slug), resolve-root or
      change creation site, tests.
