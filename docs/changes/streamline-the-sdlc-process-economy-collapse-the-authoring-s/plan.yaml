        operation: modify
      - path: src/stages/requirements/steps.yaml
        operation: modify
      - path: src/stages/requirements/semantic-checks.yaml
        operation: modify
      - path: bin/validate-templates.ts
        operation: modify
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: Single acceptance_criteria list (id, statement GWT, category, parent_id);
      checks redeclared, scenario-only checks dropped with rationale comment;
      template/steps/semantics updated; legacy artifacts correctly fail new schema; 41 unit tests
      green.
    files_changed:
      - path: src/stages/requirements/schema.yaml
        operation: modify
      - path: src/stages/requirements/structural-checks.yaml
        operation: modify
      - path: src/stages/requirements/template.yaml
