    title: Collapse the authoring step tour with one-call finalize
    description: >
      Restructure steps.yaml for requirements, design, planning onto needs_input, init, authoring,
      ready, complete, recovery; detectStep maps states onto the reduced set; finalize evaluates
      mechanical and semantic gates in one call (already supports --confirm-semantic; ensure no
      intermediate gate blocks). record-answer and set-clarity remain functional; discovery policy
      still loads and reports its gate result without gating steps. Update lifecycle unit/e2e tests
      referencing removed step ids. Files: src/stages/*/steps.yaml,
      src/scripts/lib/kinds/authoring.ts, src/scripts/lib/authoring-base.ts, tests.
