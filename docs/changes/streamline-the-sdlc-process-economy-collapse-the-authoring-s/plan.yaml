tasks:
  - id: TASK-001
    title: Slim the envelope payload behind --help-step
    description: >
      Authoring envelope assembly stops including data.step_help unless the invocation carries
      --help-step; all seven top-level envelope fields stay. Update unit tests that read step_help
      to pass the flag or assert its absence. Files: src/scripts/lib/kinds/authoring.ts (or
      authoring-base.ts, wherever step_help is assembled), tests.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
      - NFR-001
    acceptance_ids:
      - AC-006
    design_refs:
      - DEC-003
    depends_on: []
    files:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
      - path: test/unit/authoring-envelope.test.ts
        operation: modify
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: step_help omitted from data unless --help-step; seven top-level fields intact;
      covered in write-time-enforcement tests.
    files_changed:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
  - id: TASK-002
    title: Enforce note at done and normalize deltas at update
    description: >
      Tasks interpreter rejects a done transition without a non-empty note (error naming the task)
      and owns started_at, completed_at, files_changed (set on transitions). Extract or add
      normalizeDeltaEntries and use it in applyUpdateArtifact so piped delta entries get phase/date
      defaults exactly like append-delta. Unit tests for both behaviors. Files:
      src/scripts/lib/kinds/tasks.ts, src/scripts/lib/kinds/authoring.ts,
      src/scripts/lib/stage-helpers.ts if shared, tests.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-002
      - FR-003
      - FR-008
    acceptance_ids:
      - AC-003
      - AC-004
    design_refs:
      - DEC-002
    depends_on: []
    files:
      - path: src/scripts/lib/kinds/tasks.ts
        operation: modify
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
      - path: test/unit/write-time-enforcement.test.ts
        operation: create
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: done requires note (TASK_DONE_REQUIRES_NOTE in errors.yaml); interpreter owns
      started_at/completed_at/files_changed with idempotent append; normalizeDeltaEntries shared by
      append-delta and update-artifact; 4 new tests green.
    files_changed:
      - path: src/scripts/lib/kinds/tasks.ts
        operation: modify
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
      - path: src/scripts/lib/stage-helpers.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
      - path: test/unit/write-time-enforcement.test.ts
        operation: create
  - id: TASK-003
    title: Fix the docs-index parser for bare filenames
    description: >
      parseDocsIndex accepts first cells that are bare filenames, normalizing to
      docs/current/<name>; keep prefixed rows working. loadDocsIndex on the real index returns ten
      documents. Unit test with both row styles plus a mixed table. Verify appendDelta target
      validation now executes against the real index (allowed set non-empty). Files:
      src/scripts/lib/docs-index.ts, test/unit/docs-index.test.ts.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-004
    acceptance_ids:
      - AC-005
    design_refs:
      - DEC-002
    depends_on: []
    files:
      - path: src/scripts/lib/docs-index.ts
        operation: modify
      - path: test/unit/docs-index.test.ts
        operation: create
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: Parser normalizes bare filenames to docs/current/*; real index yields non-empty
      allowed set so target and anchor validation now executes; 5 tests green. Junk pseudo-doc rows
      from header cells flagged for filter follow-up.
    files_changed:
      - path: src/scripts/lib/docs-index.ts
        operation: modify
      - path: test/unit/docs-index.test.ts
        operation: create
