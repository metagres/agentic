      given-when-then, unique-ids, parent ref-exists, referenced-by against the merged list and
      drops scenario-only checks with rationale in comments; template.yaml emits acceptance_criteria
      only; steps.yaml drafting guidance loses promotion/back-fill; semantic-checks wording updated.
      Update lint/unit fixtures using scenarios. Completed changes are not migrated. Files:
      src/stages/requirements/*, affected tests/fixtures.
