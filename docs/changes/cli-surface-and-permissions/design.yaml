metadata:
  id: DES-001
  title: 'Design: cli-surface-and-permissions'
  stage: design
  status: accepted
  version: 0.1.0
  created: 2026-09-09
  updated: 2026-09-09
  delta_reviewed: true
context_summary: 'The change completes the sdlc CLI artifact surface and tightens deployed write permissions
  along four axes. Input: every content-consuming authoring flag accepts <file|-> with stdin documented
  first, and mergeArtifact gains id-keyed list merging so single-entry appends stay cheap. Surface: the
  tasks kind gains sanctioned task add/remove, three read-only commands appear (sdlc changes, feedback
  --list, authoring --lint), four mechanical or dead flags disappear, and a closed flag vocabulary with
  UNKNOWN_FLAG plus a uniform help contract (data.usage plus data.flags) make the CLI self-describing
  and drift-proof. Data: delta entries become self-describing with stage replacing phase end to end, including
  a one-time sweep of settled artifacts. Engagement: change-less workflow invocations become usage errors,
  change identification moves to the skill (four invocation shapes), and the authoring tour shrinks to
  four steps. Permissions: the opencode renderer path-scopes file-write grants per kind and the engine
  contracts tighten to deny-ceilings. Reuse dominates: every change adapts an existing module (kinds,
  renderer scopeProtectedPaths, steps loader, error catalog) rather than adding layers.'
components:
- id: CMP-001
  name: Uniform Input Channel
  responsibility: Loads YAML payloads for authoring mutations from stdin or a caller file via the uniform
    <file|-> convention on --update-artifact and --append-delta, never deleting or writing the input,
    with help surfaces documenting stdin-first usage and the .tmp/sdlc scratch convention.
  satisfies:
  - FR-001
- id: CMP-002
  name: Merge Semantics
  responsibility: Extends mergeArtifact with id-keyed list merging for object arrays on both sides while
    preserving shallow replace behavior for mixed, scalar, and id-less lists; metadata preservation rules
    unchanged.
  satisfies:
  - FR-002
- id: CMP-003
  name: Task Management
  responsibility: Implements --task-add and --task-remove on the tasks kind with next-id allocation, depends_on
    validation, done-removal refusal, and progress plus implementation_status recomputation through the
    existing transition logic.
  satisfies:
  - FR-003
- id: CMP-004
  name: Changes Inventory Command
  responsibility: Adds the read-only cross-cutting sdlc changes command listing every change with tracked
    per-stage statuses, suggested workflow, and open-feedback flag.
  satisfies:
  - FR-004
  - FR-012
- id: CMP-005
  name: Feedback Listing
  responsibility: Adds --list to the feedback command returning the full entry history read-only, with
    usage conflicts against creation and resolve modes.
  satisfies:
  - FR-005
- id: CMP-006
  name: Authoring Lint
  responsibility: Adds the findings-only --lint flag on authoring stages and rewrites finalize-recovery
    pointers from the undeployed bin/lint-artifact.ts to the CLI-native lint invocation.
  satisfies:
  - FR-006
- id: CMP-007
  name: Permission Path Scoping
  responsibility: Extends the opencode renderer's protected-path machinery with per-kind write scoping
    (authoring deny plus .tmp/**, knowledge-curator docs/current/** plus .tmp/**, tasks unchanged, review
    unchanged), tightens the engine permission contracts to deny-ceilings, and updates bound agent YAMLs
    plus compatibility tests.
  satisfies:
  - FR-007
- id: CMP-008
  name: Flag Surface Reduction
  responsibility: Removes --bump-version, --keep-status, --next-ids, the legacy review --target routing,
    and the review note/findings tombstones while preserving the mechanical version rules and the strict
    draft-reset.
  satisfies:
  - FR-008
- id: CMP-009
  name: Closed Flag Vocabulary
  responsibility: Refuses unknown flags per command with UNKNOWN_FLAG before any workflow effect, allowlisting
    --cwd globally and deriving the vocabulary from the per-command flag tables.
  satisfies:
  - FR-009
- id: CMP-010
  name: Help Contract
  responsibility: Introduces the shared help builder producing data.usage and data.flags for every command,
    adds explicit --help branches for feedback and doctor, and enforces flag-to-documentation completeness
    with unit tests.
  satisfies:
  - FR-010
- id: CMP-011
  name: Delta Stage Identity
  responsibility: Renames phase to stage across normalizeDeltaEntries, the three authoring schemas, the
    stage schema, the aggregator, and dedupe ordering; drops delta_phase and deltaPhase plumbing; runs
    the one-time sweep over settled docs/changes artifacts.
  satisfies:
  - FR-011
- id: CMP-012
  name: Engagement Contract
  responsibility: Removes needs_input and init steps with their context_loaded machinery, hardens the
    change-less invocation backstop, adds the change-identification section to the SKILL template, and
    strips AGENTS.md-restating sentences from step texts.
  satisfies:
  - FR-012
- id: CMP-013
  name: Hygiene Set
  responsibility: Retires the five stale catalog-only error codes after a zero-reference grep, and records
    the same-change last-write-wins limitation in the conventions capability row via the delta flow.
  satisfies:
  - FR-013
- id: CMP-014
  name: Verification and Living Docs
  responsibility: Updates curated api-contract rows, regenerates docs-gen regions, extends the deploy
    smoke for permission patterns and skill markers, and keeps validate, check:all, and deploy green.
  satisfies:
  - NFR-001
  - NFR-002
data_models:
- id: DM-001
  name: 'Flag table entry (data.flags value: description, value shape, required)'
- id: DM-002
  name: Delta entry (stage replaces phase as the producer identity)
apis: []
flows:
- 'Unknown flag on any command: the vocabulary guard refuses before change resolution or artifact reads,
  returning UNKNOWN_FLAG with usage exit and a --help pointer (FR-009).'
- 'Task removal of a done task: refused with a dedicated code before any write; the plan file stays byte-identical
  (FR-003).'
- 'Change-less workflow invocation: the backstop returns MISSING_CHANGE_DIR with data.existing_changes
  and engagement instructions; no artifact is created (FR-012).'
- 'Rendered permission scope mismatch: deploy smoke fails the pattern assertions so a broken grant never
  reaches a deployed runtime (FR-007, AS-004).'
decisions:
- id: DEC-001
  title: Uniform <file|-> convention with stdin first; the CLI never deletes caller files
  context: Two input styles existed (stdin-only flags vs file-or-stdin flags); agents need a retry loop
    that survives failed submissions, and temp files need a writable location under the tightened permissions.
  decision: All content flags accept <file|-> where bare flag or '-' means stdin and a path means file;
    docs steer simple cases to stdin; payloads live under .tmp/sdlc with the prescribed unique-name pattern;
    deletion is the caller's job.
  status: accepted
- id: DEC-002
  title: No artifact read-back command
  context: Only writes are denied for docs/changes; reads through the Read tool are unaffected, so a show
    command would add envelope surface without removing an obstacle.
  decision: The Read tool remains the read surface; the CLI stays write-oriented.
  status: accepted
- id: DEC-003
  title: --update-artifact is the documented upsert; no --initialize verb
  context: ensureArtifact already instantiates (gated) before merging, so creation-with-content is one
    call; an explicit verb would add surface without capability.
  decision: Help and docs advertise upsert semantics on --update-artifact; lazy instantiation stays the
    fallback.
  status: accepted
- id: DEC-004
  title: Kind-specific verbs take precedence over uniform mutation
  context: Generic artifact edits on review, tasks, and aggregator kinds would bypass round governance
    and the planning review.
  decision: Uniform upsert semantics apply to the authoring family only; tasks gains the sanctioned narrow
    task flags; review keeps verdict verbs; the aggregator stays CLI-computed.
  status: accepted
- id: DEC-005
  title: Mechanical flag removals
  context: --bump-version overrode rules the lifecycle already determines and nothing consumes the override;
    --keep-status bypassed the review guarantee; --next-ids duplicated step-envelope data; the review
    --target command and tombstones are retired scaffolding.
  decision: Remove all four surfaces; versioning follows the mechanical rules (none, patch, minor), mutations
    always apply the strict draft-reset, next_ids ride the authoring-step envelope.
  status: accepted
- id: DEC-006
  title: Closed flag vocabulary with help tables as the single source
  context: Generic argument parsing silently ignored typo'd flags, and a typo'd mutation flag degrades
    into a bare invocation.
  decision: Each command declares its flag table once; the help contract renders it and the guard enforces
    it; completeness tests bind the two.
  status: accepted
- id: DEC-007
  title: phase retired in favor of a self-describing stage field
  context: Every phase value equaled the capitalized stage id and the aggregator already annotated source_stage,
    making the field derivable twice over.
  decision: Delta entries carry stage (lowercase id, per-stage enum); the aggregator stops annotating;
    dedupe sorts by stage; a one-time sweep renames baked keys.
  status: accepted
- id: DEC-008
  title: Engagement contract with skill-owned change identification
  context: A change-less stage invocation cannot know which change is meant, and the needs_input and init
    steps duplicated AGENTS.md always-in-force duties.
  decision: Change-less workflow invocations are usage errors; the generated SKILL.md owns the four-shape
    identification protocol; the authoring tour becomes authoring, ready, complete, recovery; context
    loading is an AGENTS.md duty, not a step.
  status: accepted
- id: DEC-009
  title: Renderer path-scoping for stage-agent write permissions
  context: Authoring and aggregator agents held allow-everywhere write floors while their only durable
    targets are docs/current and CLI-mediated artifacts.
  decision: Scope grants per kind through the existing protected-path pattern machinery with base deny
    first and scratch allows after, tighten the engine contracts to deny-ceilings, and gate the result
    with the deploy smoke.
  status: accepted
- id: DEC-010
  title: Reuse of mergeArtifact and scopeProtectedPaths instead of new layers
  context: Both behaviors extend mechanics that already exist and are covered by tests.
  decision: Extend mergeArtifact in place for id-keyed merging and extend scopeProtectedPaths for the
    new grants; no new merge or permission modules.
  status: accepted
delta:
- target_doc: docs/current/architecture.md
  change: Add
  target_anchor: '## Folder Responsibilities'
  reason: The design adds a shared help-contract module and a changes inventory workflow to the engine
    core, which the folder responsibility table must list.
  statement: src/scripts/workflows/changes.ts (read-only changes inventory command) and src/scripts/lib/help.ts
    (shared help builder producing usage and flags maps) join the engine; the opencode renderer's protected-path
    machinery gains per-kind write scoping.
  date: 2026-09-09
  stage: design
