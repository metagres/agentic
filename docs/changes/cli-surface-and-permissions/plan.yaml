risks:
  - id: R1
    description: Rendered permission patterns may be unrepresentable for absolute write-tool paths on
      some runtimes.
    mitigation: Relative .tmp/** forms ship first; the deploy smoke asserts the rendered output and the
      fallback (bash scratch) keeps authoring agents functional.
  - id: R2
    description: Step-machine and flag removals can leave stale references across tests, validators, and
      templates.
    mitigation: npm run validate plus the updated completeness tests fail loudly; every reference is
      updated inside this change.
  - id: R3
    description: The phase-to-stage sweep touches settled artifacts.
    mitigation: Entry schemas use additionalProperties true so mixed state stays valid; the sweep is
      mechanical and covered by validation after.
