      architecture.md. workflows.test.ts adds docs-init UNKNOWN_COMMAND and workflow-list omission
      coverage. registry.test.ts CROSS_CUTTING_IDS drops docs-init. helpers/artifacts.ts
      defaultDelta targets docs/current/architecture.md. New test/e2e/validate-templates.test.ts
      (hermetic bin+src sandbox with node_modules symlink) covers frontmatter name mismatch, empty
      description, and the passing case. Full e2e suite: 44/44 pass; unit suite: 61/61 pass."
    completed_at: 2026-08-24
    files_changed:
