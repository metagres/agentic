      or docs-current-index references remain in either file; remaining 'templates' mentions are the
      still-valid stage-template and validate:templates references."
    completed_at: 2026-08-25
    files_changed:
      - path: AGENTS.md
        operation: modify
      - path: codemap.md
        operation: modify
  - id: TASK-008
    title: Full validation and deployment verification
    description: Run npm run validate and npm run check:all on the finished change; run npm run
      deploy:smoke and confirm the deployed .opencode/skills contains exactly two skill folders,
      each with exactly one SKILL.md, and that skills/knowledge-init holds SKILL.md and
      manifest.json with no package.json, node_modules, or TypeScript sources. Confirm no envelope
      from the changed workflows gained top-level fields.
    type: verification
    status: done
    complexity: low
    covers:
      - NFR-001
      - NFR-002
      - NFR-003
    acceptance_ids:
      - AC-013
      - AC-014
      - AC-015
    design_refs:
      - DEC-008
    depends_on:
