      - TASK-005
    files:
      - path: test/e2e/docs-init.test.ts
        operation: delete
      - path: test/e2e/deploy.test.ts
        operation: modify
      - path: test/e2e/full-pipeline.test.ts
        operation: modify
      - path: test/e2e/doctor.test.ts
        operation: modify
      - path: test/e2e/knowledge-extraction.test.ts
        operation: modify
      - path: test/e2e/workflows.test.ts
        operation: modify
      - path: test/helpers/artifacts.ts
        operation: modify
    implementation_note: "Deleted test/e2e/docs-init.test.ts. deploy.test.ts now asserts the two-skill
      deploy (knowledge-init SKILL.md + manifest with name/version/deployedAt only, no cliPath),
      --clean removing stale content from both skill folders, the skills array in the smoke report
      with both skills passed, no templates dir in the deployed agentic-sdlc skill, and folder
      purity (exactly SKILL.md + manifest.json, no package.json/node_modules/.ts). full-pipeline,
      status, review-history, and reject-recover fixtures now list the nine knowledge-init documents
      in the four-column index. doctor.test.ts asserts the knowledge-init guidance in the
      DOCS_INDEX_MISSING fix and the absence of a templates check. knowledge-extraction.test.ts runs
      without docs/current and asserts the DOCS_INDEX_MISSING warning (naming knowledge-init) on
