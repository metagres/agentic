    title: Update AGENTS.md and codemap.md
    description: "Modify AGENTS.md: invariant 2.9 describes the deployed runtime as exactly two
      self-contained skills, agentic-sdlc and knowledge-init; the section 10 .opencode description
      and any docs-init or templates references follow. Modify codemap.md: remove the templates
      directory, add src/skills, and reflect the removed docs-init workflow."
    type: documentation
