metadata:
  id: PLAN-001
  title: "Plan: deploy-knowledge-init-as-a-second-skill-and-make-it-the-sole"
  stage: planning
  status: accepted
  version: 0.1.0
  created: 2026-08-24
  updated: 2026-08-25
  based_on_design: 0.1.0
  based_on_requirements: 0.1.0
  implementation_status: accepted
  delta_reviewed: true
tasks:
  - id: TASK-001
    title: Port knowledge-init SKILL.md into src/skills
    description: "Create src/skills/knowledge-init/SKILL.md by porting the orphaned
      .opencode/skills/knowledge-init/SKILL.md verbatim, then apply the contract edits: precondition
      states the skill runs when docs/current/index.md does not exist and that it is the only
      component creating docs/current; the index specification uses exactly the columns File,
      Purpose, When to Read, Notes with nine fixed document rows, dropping the row-number,
      token-size, and last-updated columns and the instruction to fill them; declared outputs are
      index.md plus the nine living documents with overview.md absent everywhere. Principles,
      per-document specifications, cross-check pass, exclusions, and the 3K token budget stay
      unchanged."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-001
      - FR-008
      - FR-009
    acceptance_ids:
      - AC-001
      - AC-008
      - AC-009
    design_refs:
      - DEC-001
      - DEC-003
      - DEC-004
    depends_on: []
    files:
      - path: src/skills/knowledge-init/SKILL.md
        operation: create
    implementation_note: "Ported .opencode/skills/knowledge-init/SKILL.md verbatim into
      src/skills/knowledge-init/SKILL.md, then applied the contract edits: precondition now states
      the skill runs when docs/current/index.md does not exist and that it is the only component
      creating docs/current; the index specification uses exactly the columns File, Purpose, When to
      Read, Notes with nine fixed rows (row-number, token-size, and last-updated columns and the
      fill instruction dropped); declared outputs were already index.md plus the nine living
      documents with overview.md absent, so no change was needed there. Diff against the .opencode
      original contains only the specified edits."
    completed_at: 2026-08-24
    files_changed:
      - path: src/skills/knowledge-init/SKILL.md
        operation: create
  - id: TASK-002
    title: Deploy both skills with shared smoke and clean
    description: "Modify bin/deploy-to-agent.ts: copy src/skills/knowledge-init/SKILL.md to
      skills/knowledge-init/SKILL.md and write its manifest.json with name, version, and deployedAt
      only; fail with an error naming the missing source file when
      src/skills/knowledge-init/SKILL.md is absent; extend --clean to remove skills/knowledge-init
      beside skills/agentic-sdlc and the legacy list; remove the src/templates copy step; drop
      docs-init from the renderSkill workflow list; extend the smoke test to check the
      knowledge-init SKILL.md frontmatter (name equals folder, description non-empty) beside the CLI
      --list-workflows run; add a skills array with per-skill smoke results to the JSON report while
      keeping existing fields."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-002
      - FR-003
      - FR-004
      - FR-006
      - NFR-002
    acceptance_ids:
      - AC-002
      - AC-003
      - AC-004
      - AC-014
    design_refs:
      - DEC-001
      - DEC-007
      - DEC-008
      - DEC-010
    depends_on:
      - TASK-001
    files:
      - path: bin/deploy-to-agent.ts
        operation: modify
    implementation_note: "bin/deploy-to-agent.ts now deploys both skills:
      src/skills/knowledge-init/SKILL.md is copied to skills/knowledge-init/SKILL.md with a
      manifest.json carrying name, version, and deployedAt only; deployment fails with exit 1 naming
      the missing source file when it is absent (verified); --clean removes skills/knowledge-init
      beside skills/agentic-sdlc and the legacy list; the src/templates copy step is removed;
      docs-init is dropped from the renderSkill workflow list; the smoke test runs the CLI
      --list-workflows and checks the knowledge-init frontmatter (name equals folder, description
      non-empty); the JSON report keeps all existing fields and adds a skills array with per-skill
      smoke results. .deploy-build.lock serialization and copyDir fail-fast behavior are unchanged.
      Verified with a live deploy to a temp dir: two skill folders, correct manifests, no templates
      dir, docs-init absent from the workflow list."
    completed_at: 2026-08-24
    files_changed:
      - path: bin/deploy-to-agent.ts
        operation: modify
  - id: TASK-003
    title: Remove the docs-init workflow
    description: Delete src/scripts/workflows/docs-init.ts and remove its CROSS_CUTTING registry entry
      and import from src/scripts/workflows/index.ts. The docs-init argument then resolves to
      UNKNOWN_COMMAND with the workflow list, which no longer contains it. No envelope top-level
      fields change anywhere.
    type: refactor
    status: done
    complexity: low
    covers:
      - FR-005
      - NFR-003
    acceptance_ids:
      - AC-005
      - AC-015
    design_refs:
      - DEC-002
    depends_on: []
    files:
      - path: src/scripts/workflows/docs-init.ts
        operation: delete
      - path: src/scripts/workflows/index.ts
        operation: modify
    implementation_note: "Deleted src/scripts/workflows/docs-init.ts and removed its CROSS_CUTTING
      registry entry and import from src/scripts/workflows/index.ts. The docs-init argument now
      resolves to UNKNOWN_COMMAND with the workflow list (verified: blocked state, errors carry
      UNKNOWN_COMMAND, list omits docs-init). Envelope top-level fields unchanged. Incidental: the
      doctor description in index.ts dropped the word 'templates' because TASK-005 removes the
      templates check it described."
    completed_at: 2026-08-24
    files_changed:
      - path: src/scripts/workflows/docs-init.ts
        operation: delete
      - path: src/scripts/workflows/index.ts
        operation: modify
  - id: TASK-004
    title: Repurpose validate-templates for skill folders
    description: "Modify bin/validate-templates.ts: delete the docs-current-index.md validation block
      and the templatesDir constant; delete src/templates/docs-current-index.md; scan every folder
      under src/skills, require SKILL.md, parse the frontmatter between the opening --- markers with
      the YAML parser, and require name equal to the folder name plus a non-empty description; emit
      results under a skills array beside the existing templates array and exit non-zero on any
      failure. The bin path and npm script entry point stay unchanged."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-006
      - FR-010
      - NFR-001
    acceptance_ids:
      - AC-006
      - AC-010
      - AC-013
    design_refs:
      - DEC-005
    depends_on:
      - TASK-001
    files:
      - path: bin/validate-templates.ts
        operation: modify
      - path: src/templates/docs-current-index.md
        operation: delete
    implementation_note: "bin/validate-templates.ts: deleted the docs-current-index.md validation block
      and the templatesDir constant; added a scan of every folder under src/skills that requires
      SKILL.md, parses the frontmatter between the opening --- markers with parseYamlString, and
      requires name equal to the folder name plus a non-empty description; results are emitted under
      a skills array beside the existing templates array with non-zero exit on any failure. Deleted
      src/templates/docs-current-index.md and the now-empty src/templates directory (DEC-005). Bin
      path and npm script entry point unchanged. Verified: passes on the real tree; fails with exit
      1 naming the folder on a frontmatter name mismatch and on an empty description (both tested by
      temporary mutation, then restored byte-identical). Check is synchronous and cheap (one YAML
      parse per skill folder)."
    completed_at: 2026-08-24
    files_changed:
      - path: bin/validate-templates.ts
        operation: modify
      - path: src/templates/docs-current-index.md
        operation: delete
  - id: TASK-005
    title: Aggregator warning, doctor check, error catalog
    description: Modify src/scripts/lib/kinds/aggregator.ts so both the delta-listing path and the
      --complete path push a DOCS_INDEX_MISSING warning naming the knowledge-init skill when
      cwd/docs/current/index.md does not exist, without ever creating docs/current. Modify
      src/scripts/workflows/doctor.ts to remove the templates_available check and its
      TEMPLATES_MISSING error while keeping docs_index_present. Modify src/policies/errors.yaml to
      delete the TEMPLATES_MISSING and DOCS_INDEX_EXISTS entries and update the DOCS_INDEX_MISSING
      fix text to name the knowledge-init skill. Envelope top-level fields stay unchanged.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-006
      - FR-007
      - FR-011
      - NFR-003
    acceptance_ids:
      - AC-007
      - AC-011
      - AC-015
    design_refs:
      - DEC-006
    depends_on: []
    files:
      - path: src/scripts/lib/kinds/aggregator.ts
        operation: modify
      - path: src/scripts/workflows/doctor.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
    implementation_note: "aggregator.ts: both the delta-listing path and the --complete path now push a
      DOCS_INDEX_MISSING warning (via makeError, so the fix text names the knowledge-init skill)
      when cwd/docs/current/index.md does not exist; the stage never creates docs/current (verified
      live: warning present on both paths, directory uncreated, envelope top-level fields
      unchanged). doctor.ts: removed the templates_available check and its TEMPLATES_MISSING error;
      docs_index_present kept (verified live: checks list has no templates entry, warning fix names
      knowledge-init). errors.yaml: deleted TEMPLATES_MISSING and DOCS_INDEX_EXISTS;
      DOCS_INDEX_MISSING fix now reads 'Run the knowledge-init skill to create
      docs/current/index.md.' validate:policies passes."
    completed_at: 2026-08-24
    files_changed:
      - path: src/scripts/lib/kinds/aggregator.ts
        operation: modify
      - path: src/scripts/workflows/doctor.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
  - id: TASK-006
    title: Retire and retarget the test suite
    description: Delete test/e2e/docs-init.test.ts. Update test/e2e/deploy.test.ts for the two-skill
      deploy, clean, smoke report, and folder purity. Update test/e2e/full-pipeline.test.ts so the
      docs/current/index.md fixture lists knowledge-init documents. Update test/e2e/doctor.test.ts
      to assert the knowledge-init guidance and the absence of a templates check. Update
      test/e2e/knowledge-extraction.test.ts to assert the DOCS_INDEX_MISSING warning without
      docs/current creation. Update test/e2e/workflows.test.ts so the workflow list omits docs-init
      and the command returns UNKNOWN_COMMAND. Update test/helpers/artifacts.ts so defaultDelta
      targets docs/current/architecture.md instead of overview.md. Add coverage for
      validate-templates failing on a frontmatter name mismatch or empty description.
    type: test
    status: done
    complexity: high
    covers:
