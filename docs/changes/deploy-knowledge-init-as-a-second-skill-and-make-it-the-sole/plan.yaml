      - TASK-007
    files: []
    implementation_note: "npm run validate passes (schemas + policies + templates + typecheck + 105/105
      tests). npm run check:all passes (all test layers + deploy smoke). npm run deploy:smoke passes
      with the skills array reporting both skills passed. Deployed .opencode/skills verified:
      exactly the two toolkit skill folders (agentic-sdlc, knowledge-init; user-installed
      codemap/context7 untouched), each with exactly one SKILL.md; skills/knowledge-init holds
      SKILL.md and manifest.json (name/version/deployedAt) with zero .ts files, package.json, or
      node_modules in either toolkit skill; agentic-sdlc no longer ships a templates dir. Envelope
      check: doctor, knowledge-extraction (listing and --complete), and the docs-init
      UNKNOWN_COMMAND envelope all carry exactly workflow, step, state, instructions, data, errors,
      warnings at top level; the cli-envelope e2e suite (additionalProperties: false) passes."
    completed_at: 2026-08-25
    files_changed: []
