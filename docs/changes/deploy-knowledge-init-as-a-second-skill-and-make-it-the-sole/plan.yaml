    implementation_note: "AGENTS.md: invariant 2.9 now describes the deployed runtime as exactly two
      self-contained skills (agentic-sdlc and knowledge-init); the section 8 validate-templates
      description now says it validates stage-folder templates plus skill frontmatter under
      src/skills/ (name equals folder, non-empty description) instead of docs-current-index.md; the
