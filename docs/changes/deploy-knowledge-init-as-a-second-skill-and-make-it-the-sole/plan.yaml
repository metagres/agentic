risks:
  - "Deleting src/templates before doctor and validate-templates drop their references leaves the
    repository in an intermediate failing state; mitigation: complete TASK-004 and TASK-005 before
    running full validation, with TASK-008 as the gate."
  - "E2E tests asserting the workflow list may reference docs-init in places beyond
    workflows.test.ts; mitigation: TASK-008 runs the full suite and any straggler assertion is fixed
    within TASK-006 scope."
  - "The SKILL.md port could drift from the .opencode original during editing; mitigation: TASK-001
    ports verbatim and applies only the four specified edits."
  - "The tsup bundle must keep building after the workflows/index.ts import removal; mitigation:
    typecheck and the deploy build in TASK-002 surface any breakage."
  - Concurrent deploy invocations race on dist/; the existing .deploy-build.lock serialization is
    kept unchanged by TASK-002.
