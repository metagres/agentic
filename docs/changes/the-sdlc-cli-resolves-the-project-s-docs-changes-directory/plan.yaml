      change first', --cwd override resolve, nonexistent override naming the override path as
      searched, no ancestor walk-up) plus direct pure-function coverage of changesDirFor and
      resolveCwd (default, absolute, relative, boolean-flag degradation). Verified: npm run
      test:unit green, 226 tests (7 new)."
    started_at: 2026-09-02
