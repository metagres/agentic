  - id: TASK-004
    title: Function-level resolution unit matrix (new cwd-resolution test)
    description: "Create test/unit/cwd-resolution.test.ts covering the five-scenario matrix: (1)
      resolves from a project root; (2) fails from a directory without docs/changes with the
      actionable message and the searched path; (3) resolves via the cwd option override; (4) fails
      naming a nonexistent override root; (5) never walks up ancestor directories. Exercise
      changesDirFor and resolveCwd directly as pure functions alongside resolveRootOrError."
    type: test
    status: done
    complexity: medium
    covers:
