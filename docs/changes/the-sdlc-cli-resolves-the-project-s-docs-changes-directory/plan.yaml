risks:
  - id: RISK-001
    description: The message-text change breaks the e2e-asserted prefix "docs/changes does not exist
      under <path>" if the new wording is implemented carelessly.
    mitigation: Implement exactly DEC-003's wording, which preserves the asserted prefix verbatim; the
      only sanctioned test edit is the single unit assertion at test/unit/resolve-root.test.ts:143;
      the e2e suite must pass unmodified (AC-010), verified at the TASK-007 boundary.
  - id: RISK-002
    description: Consolidation silently changes a workflow that already works — status, feedback, and
      doctor already honor --cwd today.
    mitigation: resolveCwd is character-identical to the pattern it replaces; the existing unit and e2e
      suites (six e2e files exercise --cwd) run unchanged as characterization at every task
      boundary; per the requirements failure path, any divergence is fixed in the shared function,
      never as a per-workflow special case.
  - id: RISK-003
    description: "The fix never reaches the deployed bundle: the deployed skill embeds the compiled CLI,
      so a source-only change leaves the deployed CLI with the old behavior."
    mitigation: DEC-005 deploy-last ordering — TASK-008 runs npm run deploy:smoke as the final shipping
      step and then behaviorally probes the deployed CLI from a non-root cwd; no task follows the
      deploy, and a source-only state is never treated as done.
  - id: RISK-004
    description: Implementation reveals an unplanned architectural change — for example a call site that
      cannot receive the resolved root without a kind-interpreter signature change.
    mitigation: Stop, mark the affected task blocked with a note via --update-artifact, report, and
      update this plan before proceeding (requirements failure_path 2). Design-time verification
      found review, tasks, and aggregator kinds already receive cwd via runStage, so the
      stop-condition is not expected to trigger.
  - id: RISK-005
    description: An external consumer matching the literal old message text ("Create a change first")
      would see changed text — residual, low per the requirements.
    mitigation: If such a consumer is found, keep the old message as a secondary detail line while the
      primary instruction names the resolved root and the two remedies, then re-run the affected
      review (requirements failure_path 1).
