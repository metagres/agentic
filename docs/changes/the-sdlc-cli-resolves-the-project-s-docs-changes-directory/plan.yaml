metadata:
  id: PLAN-001
  title: "Plan: the-sdlc-cli-resolves-the-project-s-docs-changes-directory"
  stage: planning
  status: accepted
  version: 0.1.0
  created: 2026-09-02
  updated: 2026-09-02
  based_on_design: 0.1.0
  based_on_requirements: 0.1.0
  implementation_status: accepted
  delta_reviewed: true
tasks:
  - id: TASK-001
    title: Add the two shared resolution helpers (changesDirFor, resolveCwd)
    description: "Add changesDirFor(cwd) to src/scripts/lib/resolve-root.ts as the single constructor of
      the project changes directory path (<root>/docs/changes); resolveRootOrError switches its
      internal path.join(cwd, 'docs', 'changes') (line 64) to call it, and resolve-root.ts keeps its
      fs/path-only purity (no import from cli.ts). Add resolveCwd(args) to src/scripts/lib/cli.ts
      implementing the one args-to-root derivation (args.cwd ? path.resolve(String(args.cwd)) :
      process.cwd()). Both are pure additions with no call-site changes yet, so behavior is
      byte-identical."
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
      - FR-002
      - FR-004
    acceptance_ids:
      - AC-007
    design_refs:
      - DEC-001
      - DEC-002
    depends_on: []
    files:
      - path: src/scripts/lib/resolve-root.ts
        operation: modify
      - path: src/scripts/lib/cli.ts
        operation: modify
    implementation_note: "Added changesDirFor(cwd) to resolve-root.ts (single <root>/docs/changes
      constructor, fs/path purity kept) and resolveCwd(args) to cli.ts (character-identical to the
      existing pattern); resolveRootOrError now calls changesDirFor internally. Pure additions, no
      call-site changes; registry lookups untouched per DEC-002. Verified: npm run validate green
      (219 tests), grep confirms both exports."
    started_at: 2026-09-02
    files_changed:
      - path: src/scripts/lib/resolve-root.ts
        operation: modify
      - path: src/scripts/lib/cli.ts
        operation: modify
    completed_at: 2026-09-02
  - id: TASK-002
    title: Consolidate all docs/changes construction and cwd derivation onto the helpers
    description: "Route the three duplicate construction sites through changesDirFor:
      requireChangeRoot's available_changes listing (change-root.ts:39), listExistingChanges
      (kinds/authoring.ts:38), and createChangeDir (kinds/authoring.ts:141). Adopt resolveCwd at the
      five cwd-derivation sites: runner.ts:14, the workflow dispatch closure in workflows/index.ts
      (lines 67-69, which also removes the double parseArgs call), status.ts:62, feedback.ts:70, and
      doctor.ts:30. Behavior-preserving refactor: resolveCwd is character-identical to the pattern
      it replaces."
    type: refactor
    status: done
    complexity: medium
    covers:
      - FR-002
      - FR-004
    acceptance_ids:
      - AC-002
      - AC-007
    design_refs:
      - DEC-002
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/change-root.ts
        operation: modify
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
      - path: src/scripts/workflows/index.ts
        operation: modify
      - path: src/scripts/lib/runner.ts
        operation: modify
      - path: src/scripts/workflows/status.ts
        operation: modify
      - path: src/scripts/workflows/feedback.ts
        operation: modify
      - path: src/scripts/workflows/doctor.ts
        operation: modify
    implementation_note: "Behavior-preserving consolidation: change-root.ts:39, kinds/authoring.ts:38
      and :141 now call changesDirFor; runner.ts, workflows/index.ts dispatch closure (double
      parseArgs removed), status.ts:62, feedback.ts:70, doctor.ts:30 now call resolveCwd. Registry
      lookups (workflows/index.ts getStageById/listWorkflows, cli.ts normalizeEnvelope) stay on
      process.cwd() per DEC-002; bin/lint-artifact.ts:45 excluded per design-review note (a).
      Incidental: removed now-unused path imports in change-root.ts, runner.ts, workflows/index.ts.
      Verified: greps hit only the two helpers; npm run validate green (219 tests, suites
      unmodified)."
    started_at: 2026-09-02
    files_changed:
      - path: src/scripts/lib/change-root.ts
        operation: modify
