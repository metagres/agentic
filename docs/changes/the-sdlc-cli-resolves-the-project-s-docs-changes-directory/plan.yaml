    description: "Replace the not-exists branch message in resolveRootOrError (resolve-root.ts:113-117)
      with the DEC-003 wording: \"docs/changes does not exist under <root> (searched:
      <root>/docs/changes). Run from the project root or pass the root explicitly with --cwd
