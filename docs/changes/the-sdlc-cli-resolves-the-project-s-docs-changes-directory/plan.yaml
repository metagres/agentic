      <path>\" and dropping \"Create a change first\" entirely. Add searched: changesDirFor(cwd) to
      requireChangeRoot's missing-change branch data (change-root.ts) and to the data payload of
      doctor's failed change_name check (doctor.ts). Update exactly one message-text assertion in
      test/unit/resolve-root.test.ts:143 (the \"Create a change first.\" expectation that AC-006
      explicitly supersedes); every resolution expectation in that file stays untouched."
