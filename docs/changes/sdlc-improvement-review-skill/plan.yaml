risks:
  - id: RISK-001
    description: >
      envelope_sizes mutation safety depends on the invocation-class matrix staying correct: if a
      future engine change makes another invocation class mutate state, running the helper would
      corrupt artifacts during measurement.
    severity: medium
    mitigation: >
      The helper hardcodes the four review-stage ids with mandatory --dry-run per API-002 and the
      design verified authoring/tasks/aggregator invocations are read-only; SKILL.md requires
      recording command and date beside every number, so the git-diff reviewability of the playbook
      catches stray writes; any engine mutation-path change surfaces as a deviation to record in the
      baselines comparability notes.
  - id: RISK-002
    description: >
      Helpers rely on node native TypeScript type-stripping (repo convention, engines node >=20); a
      maintainer runtime without it fails to execute the helpers at all.
    severity: low
    mitigation: >
      Identical dependency on the existing bin/*.ts convention (DEC-004); failure is immediate and
      loud at invocation, not silent.
  - id: RISK-003
    description: >
      Transcript availability varies by machine and runtime version, so post-hoc mining may be
      impossible for some cycles.
    severity: medium
    mitigation: >
      Designed degradation per DEC-005: absent transcripts reduce the review to instrumentation
      notes only with cycles marked reconstructed-or-missing; zero-extraction files report
      explicitly and exit non-zero instead of yielding empty numbers.
  - id: RISK-004
    description: >
      The skill couples to docs/ideas/sdlc-improvement-review-playbook.md location and section
      anchors; moving or restructuring the playbook breaks the reference.
    severity: low
    mitigation: >
      Designed failure path (FLOW-003): the precondition gate aborts loudly naming the missing file
      or anchor rather than reviewing without baselines.
  - id: RISK-005
    description: >
      Interpretation risk on TASK-001: DEC-001/DM-001 pin the goals-list storage location and record
      format but do not state whether the section header is created by this change or by the skill's
      first run; scaffolding now could be read as over-delivery.
    severity: low
    mitigation: >
      The scaffold carries structure and format documentation only - no G-NN entries, no dates, no
      baseline numbers - so first-run bootstrap semantics (FLOW-002, AC-019) are fully preserved; if
      review rejects the interpretation, reverting is a single-section deletion and the skill's
      first run creates the section instead.
