    implementation_note: "Created src/skills/improvement-review/SKILL.md (frontmatter name=folder,
      non-empty description, inputs/outputs blocks per agent-audit pattern). EACH itemized duty
      verified individually by grep against the file, all present: (1) precondition gate aborts
      naming 'docs/ideas/sdlc-improvement-review-playbook.md' and names file+anchor for missing
      anchors; thin-signal check warns on <2 substantive changes, proceeds only after explicit
      maintainer confirmation recorded in register entry (AC-002). (2) Goals gate loads stored list
      or composes proposed list grounded in AGENTS.md/docs.current/best-practice/dogfooding, stored
      dated before findings; amendments need dated justification; silent rewrites prohibited. (3)
      Step 1 five categories (invocation counts, zero-change round-trips, late findings, trimmed
      output, delegation with three sub-fields) each value-or-none-observed;
      reconstructed-or-missing marking with mining fallback. (4) Step 2 sequences three helper
      invocations verbatim (DEC-004 forms) + mining; command+date beside every number;
      initial-baseline bootstrap per DEC-002; prose baselines never regenerated; ~2s->2000ms
      duration_ms mapping note. (5) Event grammar documented (Invocation/Wasted-round/Delegation
      events) + designed degradation mode. (6) Gate classification
      mechanical+early/late/honor-system/dead with proof-of-execution-on-real-data before non-dead.
      (7) Unused-surface inventory: exact grep command+match count beside claims; consumers in src/,
      deployed skills, other repos exclude/refute. (8) Evidence-or-label: unverified hypothesis
      labeled with missing_evidence, never fact in proposals. (9) Register refresh: dated
      regression-checks, reopen+evidence+sibling-hunt, dated progress notes, Works token with
      mandatory confirmed-working history, What-worked >=1 dated entry (zero = incomplete),
      comparability notes, referential-integrity sweep flagging dangling proposal pointers
      (described generically - see deviation note). (10) Proposal writer: header table (origin
      date+finding ids, proposed, slug, depends on, kind, cost tier) + exactly nine H2 sections in
      DM-005 order + Governance-test-result between References and Kickoff; one tier of
      quick-win/structural/strategic; multi-tier states highest + why lower rejected; explicit-slug
      kickoff. (11) Governance test: judgment-in-engine rejected/reshaped to calling agent, result
      recorded; catalog touch = design-review event, envelope touch = decision event, both before
      kickoff. Hard constraints verified: zero 'p11' occurrences in skill folder (grep), zero
      agent-specific paths, p12-fast-track-lane.md is the sole exemplar named. npm run validate
      green (196 tests)."
