  - id: TASK-006
    title: Author SKILL.md method driver operationalizing the six-step playbook
    description: >
      Create src/skills/improvement-review/SKILL.md implementing CMP-001 packaging (frontmatter name
      equals folder name improvement-review, non-empty description, inputs/outputs blocks following
      the agent-audit pattern) and CMP-002 method driver duties, following the six-step order of
      docs/ideas/sdlc-improvement-review-playbook.md. Must contain: (1) precondition gate locating
      the playbook and aborting loudly naming the file when it or its anchors are missing, plus the
      thin-signal check warning when fewer than two substantive changes exist since the last
      register date and proceeding only after explicit confirmation recorded in the register entry;
      (2) goals-list lifecycle per CMP-007 - load the stored list from the playbook section
      scaffolded by TASK-001, or compose a proposed list grounded in AGENTS.md invariants,
      docs/current/ capabilities and conventions, agentic-SDLC best practice, and dogfooding
      experience, storing it dated before any finding is evaluated; amendments require dated
      justification, silent rewrites prohibited; (3) Step 1 instrumentation guidance with the five
      categories (invocation counts per stage, zero-change round-trips, late findings, trimmed
      output, delegation outcomes with their three sub-fields), each holding a recorded value or an
      explicit none-observed marker, and reconstructed-or-missing marking with fallback to
      transcript mining where files exist; (4) Step 2 measurement procedure sequencing the four
      helpers with their exact invocation forms (DEC-004) and the duty to record command and date
      beside every number, comparing against DM-003 rows where present and bootstrapping
      initial-baseline rows on first run per DEC-002 (qualitative prose baselines never
      regenerated); (5) the generic transcript event grammar for mine_transcript and the degradation
      mode when transcripts are absent; (6) Step 3 gate classification procedure (mechanical+early,
      mechanical+late, honor-system, dead) requiring proof of execution against real data before any
      non-dead classification; (7) Step 4 unused-surface inventory procedure recording exact grep
      commands and match counts beside removal claims and excluding or refuting candidates with live
      consumers in src/, deployed skills, or other repos; (8) enforcement of the evidence-or-label
      policy - drop unsupported claims or label them unverified hypothesis naming the missing
      evidence, never entering proposals as fact; (9) register-and-baselines refresh mechanics per
      CMP-008 - every Fixed row gets a dated regression-check result, a regressed row reopens with
      regression evidence plus a sibling-hunt note for newly added surface, every Open row gets a
      dated progress note, the What-worked fairness subsection per DEC-006 maintains at least one
      dated evidenced entry per completed review with Works as the canonical positive token carrying
      a mandatory confirmed-working history entry, quantitative baseline rows follow DEC-002 with
      comparability notes whenever a recipe changes shape, and a referential-integrity sweep flags
      dangling pointers to proposal files such as F5's reference to the nonexistent
      p11-agent-delegation-loop.md; (10) proposal writer per CMP-009 - the DM-005 skeleton grounded
      solely on the playbook Step 6 inline enumeration and p12-fast-track-lane.md (no P11 reference
      anywhere, DEC-007): header table (origin review date plus finding ids, status proposed,
      suggested change slug, depends on, kind, cost tier) followed by exactly nine H2 sections in
      order (Problem, Evidence, Goal, Non-goals, Design space & open questions, Requirement seeds,
      Implementation sketch, References, Kickoff (new session)) with a Governance-test-result block
      between References and Kickoff, exactly one cost tier (quick win, structural, strategic),
      multi-tier resolutions stating the highest required tier and why lower-tier partial
      resolutions were rejected, and a runnable kickoff command in explicit-slug form; (11)
      governance test per CMP-010 screening every proposal against AGENTS.md invariants and the
      determinism stance before its kickoff command - judgment-in-engine proposals rejected or
      reshaped to route judgment to the calling agent with the test result recorded in the document,
      capped-check-catalog touches flagging a design-review governance event and frozen-envelope
      touches flagging a decision governance event, both flags preceding kickoff. No hardcoded
      agent-specific paths anywhere.
