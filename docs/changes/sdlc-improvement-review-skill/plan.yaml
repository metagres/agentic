tasks:
  - id: TASK-001
    title: Scaffold the SDLC-goals-list section in the improvement-review playbook
    description: >
      Add a dedicated SDLC-goals-list section to docs/ideas/sdlc-improvement-review-playbook.md,
      placed adjacent to the Findings register and Current baselines sections it is consumed with
      (DEC-001). The section documents the DM-001 record format - ordered entries with id G-NN,
      testable goal statement, grounding sources (AGENTS.md section, docs/current file,
      best-practice principle, dogfooding observation), status active/amended/retired, created date,
      amendments list of date plus justification pairs - and carries an explicit empty-state note
      stating that no entries exist yet and the first review run proposes and stores the initial
      dated goals list before any finding is evaluated (CMP-007, FLOW-002, AC-019). Author NO G-NN
      entries, no dates, and no goal text: goals-list content is composed by the skill's first run,
      not by this change. Touch nothing else in the playbook: the Findings register and Current
      baselines sections stay byte-for-byte as-is, and no initial-baseline DM-003 rows are authored
      (DEC-002 records those on first run). Rationale for scaffolding now rather than at first run:
      the skill's precondition gate aborts on a missing or anchor-less playbook, so the anchor the
      goals lifecycle writes through must exist as part of this change; the empty-state marker keeps
      first-run bootstrap semantics intact.
    type: documentation
    status: done
    complexity: low
    covers:
      - FR-010
    acceptance_ids:
      - AC-019
      - AC-020
    design_refs:
      - DEC-001
      - DEC-002
    components:
      - CMP-007
    depends_on: []
