        operation: modify
    implementation_note: "Added '## SDLC goals list' section to
      docs/ideas/sdlc-improvement-review-playbook.md, placed between the Findings register and
      Current baselines sections (DEC-001 adjacency). Section documents the DM-001 record format
      verbatim: ordered G-NN entries with testable goal statement, grounding sources (AGENTS.md
      section / docs/current file / best-practice principle / dogfooding observation), status
      active/amended/retired, created date, amendments as date+justification pairs. Explicit
      empty-state marker states no entries exist yet and the first review run proposes and stores
      the initial dated goals list before any finding is evaluated (CMP-007, FLOW-002, AC-019). Zero
      G-NN entries authored, zero concrete dates, zero baseline numbers; Findings register and
      Current baselines sections untouched byte-for-byte."
    completed_at: 2026-08-27
  - id: TASK-002
    title: Implement measure_artifacts helper (artifact-volume measurement)
    description: >
      Create src/skills/improvement-review/scripts/measure_artifacts.ts implementing API-001 per
      CMP-003 and DM-004: plain ESM TypeScript using node builtins only (fs, path), invoked as `node
      src/skills/improvement-review/scripts/measure_artifacts.ts [--change <slug>] [--verbose]` with
      no build step and no new npm dependencies (DEC-003, DEC-004). Counts lines per file under
      docs/changes/ grouped per change plus totals, sorted, with fixed field order and stable units
      so deltas against later baselines need no transformation. Echoes script name and arguments in
      the output record. Default output aggregates per change and stays within 40 lines; --verbose
      prints per-file detail. An unreadable path exits non-zero naming the path - zeros are never
      printed as data; an empty docs/changes dataset exits zero reporting an explicit empty result
      instead of erroring. Byte-identical output for identical repository state (DEC-008 scopes this
      state-derived helper into the byte-identity contract).
    type: implementation
    status: done
    complexity: medium
