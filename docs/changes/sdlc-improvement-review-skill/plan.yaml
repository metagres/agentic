      from import.meta.url. Counts wc -l lines per file under docs/changes/ grouped per change plus
      total/changes/files rows, code-unit sorted, fixed field order label/value/unit/source.
      Verified: default run 17 lines (<=40, AC-029); double-run byte-identical via cmp (AC-025);
      --change filter + --verbose (14 lines) work; nonexistent slug filter exits 0 with explicit
      empty result; unreadable file probe (chmod 000) exits 1 naming path with EACCES cause
      (AC-026); probe cleaned up, git status clean."
