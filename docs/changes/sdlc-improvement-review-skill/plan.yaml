  - id: TASK-003
    title: Implement envelope_sizes helper with mandatory review-stage dry-run matrix
    description: >
      Create src/skills/improvement-review/scripts/envelope_sizes.ts implementing API-002 per
      CMP-004 and DM-004: plain ESM TypeScript using node builtins only (fs, path, child_process),
      invoked as `node src/skills/improvement-review/scripts/envelope_sizes.ts --change <slug>
      [--verbose]`; --change is required. Discovers stage ids by directory scan of src/stages/ and
      measures exactly one envelope per real stage id by invoking `node src/scripts/sdlc.ts
      <stage-id> --change <slug>` for the nine stage ids requirements, requirements-review, design,
      design-review, planning, planning-review, implementation, implementation-review,
      knowledge-extraction. Mutation safety is mandatory per invocation class: the four review-stage
      invocations MUST pass --dry-run because a bare review invocation appends a round to the review
      file (round recording is gated on not-dry-run in src/scripts/lib/kinds/review.ts), while bare
      authoring, tasks, and aggregator invocations are read-only. Measures JSON serialization bytes
      total plus bytes per frozen top-level field, recording the observed step beside each row.
      Default table of nine stages fits within 40 lines; --verbose adds per-field detail.
      Byte-identical output for identical repository state; fails non-zero naming a stage folder
      that cannot be scanned.
    type: implementation
    status: done
    complexity: high
    covers:
