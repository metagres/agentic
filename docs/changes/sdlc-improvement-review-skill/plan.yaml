  - id: TASK-004
    title: Implement mine_transcript helper with explicit zero-extraction failure
    description: >
      Create src/skills/improvement-review/scripts/mine_transcript.ts implementing API-003 per
      CMP-005 and DM-004: plain ESM TypeScript using node builtins only (fs, path, readline),
      invoked as `node src/skills/improvement-review/scripts/mine_transcript.ts <file>...
      [--verbose]`. Accepts only explicitly supplied file paths - never discovers transcript stores
      and contains no hardcoded runtime locations (invariant 7, DEC-005). Extracts over the generic
      line-oriented event grammar documented in SKILL.md: sdlc CLI invocation lines counted per
      stage, repeated identical consecutive command lines as wasted-round candidates, and delegation
      events capturing the three FR-002 sub-fields (delegation type used, model resolution
      success/failure, whether the delegated output needed rework). Prints the source filename
      beside every extracted number. A supplied file containing zero parseable session events
      produces an explicit zero-extraction report naming the file and exits non-zero rather than
      silently emitting empty numbers; an unreadable file exits non-zero naming the path.
      Byte-identical output for identical input files; default output within 40 lines, --verbose for
      detail.
    type: implementation
    status: done
    complexity: medium
    covers:
