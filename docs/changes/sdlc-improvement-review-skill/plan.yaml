  - id: TASK-005
    title: Implement validate_duration helper (fast-gate timing)
    description: >
      Create src/skills/improvement-review/scripts/validate_duration.ts implementing API-004 per
      CMP-006 and DM-004: plain ESM TypeScript using node builtins only (child_process, perf_hooks),
      invoked as `node src/skills/improvement-review/scripts/validate_duration.ts [--verbose]`. Runs
      `npm run validate` once and emits a fixed-shape record of command, exit_code, duration_ms with
      fixed field order and fixed units. Shape stability is the contract: duration_ms inherently
      varies with machine and load, which DEC-008 scopes out of the byte-identity contract -
      timing-kind baseline rows compare orders of magnitude and regressions, not bytes. A non-zero
      validate exit propagates non-zero with the named cause instead of being swallowed. Default
      output within 40 lines.
    type: implementation
