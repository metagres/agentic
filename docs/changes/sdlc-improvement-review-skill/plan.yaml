      token, repeated identical consecutive command lines as wasted-round candidates, delegation
      events with type=/model=/rework= sub-fields. Verified on synthetic transcript: 7 invocations,
      2 wasted-round candidates, 2 delegation events with all three sub-fields extracted, prose-only
