delta:
  - phase: Design
    target_doc: docs/current/architecture.md
    change: Add
    reason: New dev-only component - the improvement-review skill bundle with four bundled helper
      scripts under src/skills/improvement-review/scripts/, the first dev-only skill to bundle
      scripts; deployment surface unchanged (still exactly two skills).
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/glossary.md
    change: Add
    reason: New terms introduced by the design - SDLC goals list, fairness pass (What-worked
      subsection), evidence-or-label policy, measurement baseline kinds (count, bytes, timing), and
      the generic transcript event grammar.
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/decisions.md
    change: Add
    reason: Design decisions worth canonizing - goals-list storage in the playbook (DEC-001), two-tier
      baseline bootstrapping (DEC-002), helper placement verification (DEC-003), and the
      byte-identity scope exclusion for timing metrics (DEC-008).
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/conventions.md
    change: Add
    reason: Runtime convention for dev-only skill helpers - plain TypeScript ESM executed directly via
      node with node builtins only, typechecked by the existing fast-gate include set, no new npm
      dependencies.
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/operations.md
    change: Add
    reason: Concrete operator commands for the improvement review - the four helper script invocations
      with their flags, failure exits, and the first-run bootstrap sequence for goals and baselines.
    date: 2026-08-27
