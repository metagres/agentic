      src/skills/knowledge-init/SKILL.md: the precondition becomes 'run once when docs/current/ does
      not exist', index.md leaves the frontmatter outputs list, the index-generation section is
      deleted with subsequent sections renumbered, and the cross-check section defers to the
      mechanical enforcement by the docs tooling and emits nothing (DEC-007).
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-007
      - FR-010
    acceptance_ids:
