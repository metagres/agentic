        operation: modify
      - path: src/stages/knowledge-extraction/steps.yaml
        operation: modify
      - path: src/skills/knowledge-init/SKILL.md
        operation: modify
    implementation_note: "Retired index.md from the instruction surface per CMP-004: removed the 'Read
      docs/current/index.md' sentences from the requirements/design/planning/implementation
      steps.yaml init/progress steps (each now points at the living docs relevant to the change with
