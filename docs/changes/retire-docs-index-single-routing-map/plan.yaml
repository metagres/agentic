tasks:
  - id: TASK-001
    title: Characterize the docs-gen scan and table primitives the crosscheck gate reuses
    description: >
      Add behavior-preserving characterization tests to test/unit/docs-gen-engine.test.ts for the
      primitives the new gate module will reuse verbatim (DEC-007): scanDeadReferences (hit/miss and
      section attribution against a fixture errors.yaml tree) and the table parsers
      (tableRowsUnderHeading, renderTable). Tests run against fixture trees, never the live repo, so
      they survive the extraction and lock the pass/fail semantics before any check logic moves.
    type: test
    status: done
    complexity: low
    covers:
      - FR-002
      - FR-003
    acceptance_ids:
      - AC-006
    design_refs:
      - DEC-007
    depends_on: []
    files:
      - path: test/unit/docs-gen-engine.test.ts
        operation: modify
    implementation_note: Added characterization oracle tests to test/unit/docs-gen-engine.test.ts
      pinning current behavior of scanDeadReferences (hit shape {file,section,context,reference},
      section attribution, zero-hit path), tableRowsUnderHeading exact-heading matching, and the
      seven cross-checks via indexProvider.render against fixture trees (green path renders
      DOC_TABLE/Cross-Check/Notes tables, violations throw one error listing each message, STALE-REF
      hits render as Notes rows without throwing); verified with node --test
      test/unit/docs-gen-engine.test.ts (20 pass, 0 fail).
    completed_at: 2026-09-09
    files_changed: []
  - id: TASK-002
    title: Retire the index provider; extract the cross-check gate module with hard STALE-REF
    description: >
      Remove the index whole-file entry from docs-gen.yaml (and the ordering comment that promised
      index runs last) and delete docs/current/index.md from disk. Extract the seven mechanical
      cross-checks verbatim from the index provider into the new non-rendering module
      src/scripts/lib/docs-gen/crosscheck.ts, which also runs scanDeadReferences as a hard check;
      generateAll (src/scripts/lib/docs-gen/run.ts) invokes it after the manifest loop so
      docs:generate and docs:check throw on violations while nothing about check results is
      persisted anywhere. Delete src/scripts/lib/docs-gen/providers/index-crosscheck.ts and its
      registry entry in src/scripts/lib/docs-gen/providers/index.ts. Reword the known-issues
      provider to stop consuming scanDeadReferences so known-issues.md never carries STALE-REF rows.
      Reuse record: check logic moves verbatim per DEC-007, reusing
      scanDeadReferences/findImportSites and the existing table parsers — no engine rewrite, no
      duplicated check logic. Verify preservation against the TASK-001 characterization oracle.
    type: refactor
    status: done
    complexity: high
    covers:
      - FR-001
      - FR-002
      - FR-003
    acceptance_ids:
      - AC-001
      - AC-002
      - AC-003
      - AC-005
      - AC-006
      - AC-008
    design_refs:
      - DEC-001
      - DEC-002
      - DEC-007
    depends_on:
      - TASK-001
    files:
      - path: docs-gen.yaml
        operation: modify
      - path: src/scripts/lib/docs-gen/crosscheck.ts
        operation: create
      - path: src/scripts/lib/docs-gen/providers/index-crosscheck.ts
        operation: delete
      - path: src/scripts/lib/docs-gen/providers/index.ts
        operation: modify
      - path: src/scripts/lib/docs-gen/run.ts
        operation: modify
      - path: src/scripts/lib/docs-gen/providers/known-issues.ts
        operation: modify
      - path: docs/current/index.md
        operation: delete
    implementation_note: "Retired the index surface per CMP-001/DEC-001/DEC-002: removed the index entry
      and ordering promise from docs-gen.yaml, deleted docs/current/index.md and
      providers/index-crosscheck.ts, dropped the registry entry in providers/index.ts, extracted the
      seven cross-checks verbatim into the non-rendering gate src/scripts/lib/docs-gen/crosscheck.ts
      (runCrosschecks throws DocsGenError listing {check,message} findings, STALE-REF included as a
      hard check), wired runCrosschecks into generateAll after the manifest loop, and removed the
      scanDeadReferences consumption plus the stale-reference fallback wording from
      providers/known-issues.ts; re-pointed the TASK-001 oracle tests in
      test/unit/docs-gen-engine.test.ts to runCrosschecks (green path no-throw, violations throw
      naming glossary-entity-commands/tech-vocabulary, STALE-REF now hard naming file+missing path).
      Verified: node --test test/unit/docs-gen-engine.test.ts (20 pass), npm run typecheck clean,
      npm run test:unit 365/366 (sole failure = docs-index.test.ts real-repo test reading the
      deleted index.md, expected per R4, rewritten by TASK-008), npm run docs:check exits 1 with the
      hard gate listing 4 STALE-REF findings all in src/policies/errors.yaml (lifecycle.yaml, 2x
      docs/current/index.md, deploy-to-agent.mjs) and zero findings from the seven mechanical checks
      — expected per R6, fixed by TASK-003; known-issues.md region drift will regenerate via
      TASK-007."
    completed_at: 2026-09-09
    files_changed: []
  - id: TASK-003
    title: Fix the stale references and rename DOCS_INDEX_MISSING to DOCS_CURRENT_MISSING
    description: >
      In src/policies/errors.yaml: repoint the MANIFEST_INVALID fix to bin/deploy-to-agent.ts; drop
      the dead src/policies/lifecycle.yaml token from ILLEGAL_STATUS_TRANSITION and name the
      artifact status vocabulary inline (draft, ready-for-review, accepted, rejected, blocked) per
      DEC-003; rename DOCS_INDEX_MISSING to DOCS_CURRENT_MISSING with the message 'docs/current not
      found; delta target validation was skipped.' and a reworded fix. In
      src/scripts/workflows/doctor.ts: check the docs/current directory (check id
      docs_current_present) and emit DOCS_CURRENT_MISSING (warning; error under --strict). The
      api-contract error-catalog region regenerates via TASK-007, never by hand. Depends on TASK-002
      because the hard STALE-REF check activated there fails the gate until these fixes land.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-004
      - FR-005
    acceptance_ids:
      - AC-007
      - AC-010
      - AC-011
      - AC-012
      - AC-013
      - AC-015
    design_refs:
      - DEC-003
    depends_on:
      - TASK-002
    files:
      - path: src/policies/errors.yaml
        operation: modify
      - path: src/scripts/workflows/doctor.ts
        operation: modify
    implementation_note: "Fixed every stale reference the hard gate listed in src/policies/errors.yaml
      per DEC-003 (ILLEGAL_STATUS_TRANSITION fix now names the status vocabulary inline — draft,
      ready-for-review, accepted, rejected, blocked — with no path token; MANIFEST_INVALID repointed
      to bin/deploy-to-agent.ts, verified present on disk) and renamed DOCS_INDEX_MISSING to
      DOCS_CURRENT_MISSING with message 'docs/current not found; delta target validation was
      skipped.' and fix 'Run the knowledge-init skill to bootstrap docs/current/.'; rewrote the
      doctor living-docs check to docs_current_present keyed on docs/current directory absence
      emitting DOCS_CURRENT_MISSING (warning, error under --strict). Verified: npm run docs:check
      now passes the hard STALE-REF gate and all 7 cross-checks, exiting 1 only on generated-region
      drift (known-issues.md, architecture.md, api-contract.md — TASK-007 regeneration evidence);
      doctor run in a fixture cwd without docs/current emits the DOCS_CURRENT_MISSING warning with
      the reworded message and blocks under --strict, and passes clean on the repo; npm run
      typecheck clean; npm run test:unit 365/366 (sole failure remains the R4-coupled
      docs-index.test.ts real-repo test, fixed by TASK-004 next; e2e doctor/knowledge-extraction
      assertions of the old code are TASK-009 scope)."
    completed_at: 2026-09-09
    files_changed: []
  - id: TASK-004
    title: Rewrite the delta-target registry as a docs/current directory scan
    description: >
      Rewrite src/scripts/lib/docs-index.ts: loadDocsIndex returns the sorted readdir of
      docs/current/*.md as {file} entries with docs/current-prefixed paths; parseDocsIndex and the
      purpose/when/notes fields are removed with no remaining importers; headingExists and
      normalizeHeading stay for Modify/Remove anchor validation (DEC-004). Reword the consumers:
      src/scripts/lib/kinds/authoring.ts emits DOCS_CURRENT_MISSING with the reworded message when
      the directory is absent, rejects unknown targets with 'target_doc is not a docs/current
      document', and feeds data.delta_allowed_target_docs from the directory scan; the aggregator's
      index.md existence check (src/scripts/lib/kinds/aggregator.ts) switches to the directory check
      with the renamed code; the dead loadDocsIndex import in src/scripts/lib/context.ts is removed.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-005
      - FR-006
    acceptance_ids:
      - AC-014
      - AC-017
      - AC-018
      - AC-019
      - AC-020
    design_refs:
      - DEC-004
    depends_on:
      - TASK-003
    files:
      - path: src/scripts/lib/docs-index.ts
        operation: modify
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
      - path: src/scripts/lib/kinds/aggregator.ts
        operation: modify
      - path: src/scripts/lib/context.ts
        operation: modify
    implementation_note: "Rewrote src/scripts/lib/docs-index.ts as the directory registry per DEC-004
      (loadDocsIndex = sorted readdir of docs/current/*.md returning {file} entries; parseDocsIndex
      and the purpose/when/notes fields deleted with no remaining importers;
      headingExists/normalizeHeading retained for anchor validation); reworded the consumers —
      authoring.ts appendDelta now emits makeError('DOCS_CURRENT_MISSING') when the directory is
      absent, rejects unknown targets with 'target_doc is not a docs/current document', and
      delta_allowed_target_docs still maps doc.file; aggregator.ts checks the docs/current directory
      and warns DOCS_CURRENT_MISSING; the dead loadDocsIndex import in context.ts is removed;
      rewrote test/unit/docs-index.test.ts to the readdir semantics (sorted entries, non-.md
      excluded, absent dir empty, single-.md boundary, real-repo 9-document scan, headingExists
      cases). Verified: node --test test/unit/docs-index.test.ts (6 pass), npm run typecheck clean,
      npm run test:unit 367/367 green, fixture authoring flow via the CLI (valid target accepted;
      unknown target blocked with 'target_doc is not a docs/current document'; absent docs/current
      warns DOCS_CURRENT_MISSING with the reworded message and skips validation), and npm run
      test:e2e 50/52 with the only failures being the TASK-009-scoped doctor and
      knowledge-extraction e2e tests still asserting the old DOCS_INDEX_MISSING code; src/ now
      carries zero DOCS_INDEX_MISSING outside src/stages/knowledge-extraction/steps.yaml line 17
      which TASK-005 owns."
    completed_at: 2026-09-09
    files_changed: []
