        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: "Reworked hooks.ts: fail-loud policy loader (startup hook) with fs.existsSync
      missing-file detection and strict shape validation naming offending fields, module-level
      per-path policy cache, confirmed discovery gate (floor + discovery_reviewed, clarity_valid for
      non-anchor clarity), recordAnswer UNKNOWN_LENS rejection listing valid lenses, setClarity
      anchors from policy, fallback constants removed. Added STAGE_POLICY_MISSING,
      STAGE_POLICY_INVALID, UNKNOWN_LENS to errors.yaml."
    files_changed:
      - path: src/stages/requirements/hooks.ts
        operation: modify
      - path: src/policies/errors.yaml
        operation: modify
  - id: TASK-005
    title: Implement the scenarios step routing and step definitions
    description: Add the scenarios step between discovery and assumptions (CMP-004). In hooks.ts
      implement the routing rule in extraStep — the step is active while any scenario has status
      open, or while the scenarios array is empty and metadata.scenarios_reviewed is not true — and
      expose scenarios_state (total, open, resolved, reviewed, needs_attention) through
      getExtraData. In steps.yaml add the scenarios step definition (title, markdown describing
      example mapping across the four categories, the loop-back through --record-answer with
      question_id links, resolution outcomes, and the explicit empty-set confirmation; commands for
      --next-ids, --update-artifact, --record-answer, and --complete-step --step scenarios; exit
      criteria; no complete_when predicate since routing is owned by the hooks). Update the
      discovery step markdown to require gate passage plus explicit confirmation, and the drafting
      step markdown to add EARS phrasing guidance and the promotion rule for resolved ac-outcome
      scenarios with parent_id links and back-filled ac_id.
    type: implementation
    status: done
    complexity: medium
    covers:
