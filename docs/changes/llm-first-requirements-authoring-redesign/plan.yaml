risks:
  - risk: A missing or corrupt policy file blocks the whole requirements stage by design, so a bad edit
      to requirements-policy.yaml takes down every requirements command.
    severity: medium
    mitigation: Fail-loud errors carry fix hints naming the offending field, TASK-009 unit-tests each
      failure mode against fixture stage folders, and the policy pin test catches accidental content
      drift from the FR-004 vocabulary.
  - risk: The partial-clarity gate starts requiring the data lens once the policy lands, which can break
      the existing full-pipeline e2e test whose fixture lacks a data-lens answer and the
      confirmation flags.
    severity: medium
    mitigation: TASK-010 updates the shared validRequirements helper with a data-lens discovery answer
      and both flags; TASK-009 runs first so gate behavior is verified cheaply before the e2e suite.
  - risk: The startup hook invocation touches the authoring interpreter used by every authoring stage,
      so a defect would break design, planning, and knowledge-extraction too.
    severity: medium
    mitigation: The invocation is a no-op for stages whose hooks define no startup entry point, and the
      existing e2e suite for the other stages guards the interpreter behavior at every task
      boundary.
  - risk: The hooks module gains a node:fs import for the existsSync check; the deploy compile must keep
      inlining node builtins or the bundled hooks break at runtime.
    severity: low
    mitigation: compileStageHooks already bundles hooks with platform node and the existing hooks import
      node:path; TASK-011 asserts the compiled hooks.js and the policy file ship in the bundle and
      the deploy smoke test runs the bundled CLI.
  - risk: Advisory-only promotion and EARS guidance may be ignored by authoring agents, leaving
      ac-outcome scenarios unpromoted.
    severity: low
    mitigation: The scenario-coverage advisory appears at finalize and at requirements-review from one
      declaration, and ref-exists blocks dangling back-filled ac_id links; escalation to a
      structural catalog check is a future design-review event per DEC-006.
  - risk: In-flight artifacts created before the change carry no scenarios section or confirmation flags
      and must route through the new steps without migration.
    severity: low
    mitigation: All schema additions are optional, the step machine treats a missing scenarios array as
      empty, and TASK-010 includes an explicit in-flight routing e2e case (AC-018).
