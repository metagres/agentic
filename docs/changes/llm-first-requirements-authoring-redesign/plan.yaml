tasks:
  - id: TASK-001
    title: Reshape requirements-policy.yaml to the FR-004 vocabulary
    description: Update src/stages/requirements/requirements-policy.yaml (CMP-001) so discovery.lenses
      lists exactly stakeholder, scope, interface, behavior, data, constraint, failure, and outcome
      (data replaces design), and discovery.clarity defines the anchors clear, partial, and vague
      with required lens sets {failure, constraint}, {stakeholder, interface, data, failure,
      constraint}, and all eight lenses, and minimum resolved questions of 3, 5, and 8 respectively.
      Keep version 1. The file ships in the bundle unchanged because the deploy script copies stage
      folders wholesale.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-004
    acceptance_ids:
      - AC-004
    design_refs:
      - DEC-001
      - DEC-005
    depends_on: []
    files:
      - path: src/stages/requirements/requirements-policy.yaml
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: "Reshaped requirements-policy.yaml: lenses now stakeholder, scope, interface,
      behavior, data, constraint, failure, outcome (data replaces design); partial anchor adds data
      to required lenses; vague anchor requires all eight lenses; thresholds 3/5/8 unchanged."
    files_changed:
      - path: src/stages/requirements/requirements-policy.yaml
        operation: modify
  - id: TASK-002
    title: Extend the requirements schema, template, and stage descriptor with scenarios and
      confirmation flags
    description: Extend the requirements stage artifact contract (CMP-005). In schema.yaml add an
      optional top-level scenarios array whose entries require id (pattern SC-NNN), statement,
      category (enum happy, edge, negative, boundary), status (enum open, resolved), and outcome
      (enum ac, question, out_of_scope), with optional ac_id (AC-NNN) and question_id (DL-NNN) and
      additionalProperties true; add optional boolean metadata flags discovery_reviewed and
      scenarios_reviewed; add data to the discovery_log lens enum while keeping design valid for
      in-flight artifacts. In template.yaml initialize scenarios as an empty array and both
      confirmation flags false. In stage.yaml add the SC prefix mapping to the scenarios array in
      next_ids. All additions are optional so pre-change artifacts remain schema-valid (NFR-002,
      AC-018).
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-012
      - NFR-001
      - NFR-002
    acceptance_ids:
      - AC-015
      - AC-016
      - AC-017
      - AC-018
    design_refs:
      - DEC-005
      - DEC-007
    depends_on: []
    files:
      - path: src/stages/requirements/schema.yaml
        operation: modify
      - path: src/stages/requirements/template.yaml
        operation: modify
      - path: src/stages/requirements/stage.yaml
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: Schema gains optional scenarios array (SC-NNN id, statement,
      category/status/outcome enums, optional ac_id/question_id, additionalProperties true),
      optional discovery_reviewed/scenarios_reviewed metadata flags, and data added to the lens enum
      with design kept for in-flight artifacts. Template initializes scenarios as [] with both flags
      false. stage.yaml maps SC to scenarios in next_ids.
    files_changed:
      - path: src/stages/requirements/schema.yaml
        operation: modify
      - path: src/stages/requirements/template.yaml
        operation: modify
      - path: src/stages/requirements/stage.yaml
        operation: modify
  - id: TASK-003
    title: Extend the authoring interpreter with the startup hook, new completeStep steps, and scenarios
      next-ids
    description: "Make three generic extensions to src/scripts/lib/kinds/authoring.ts (CMP-008): invoke
      an optional hooks startup(env) entry point immediately after the stage environment is
      constructed and before flag handling, letting thrown coded errors surface as blocked envelopes
      through the existing catch that maps err.code through makeError; extend completeStep to
      recognize step discovery and step scenarios, setting metadata.discovery_reviewed and
      metadata.scenarios_reviewed alongside the existing assumptions, delta, and init steps; and
      serve data.next_ids for the scenarios step in addition to drafting, discovery, and
      assumptions. No stage-specific knowledge enters the interpreter."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-005
      - FR-006
      - FR-011
    acceptance_ids:
      - AC-005
      - AC-006
      - AC-014
    design_refs:
      - DEC-002
      - DEC-003
      - DEC-004
    depends_on: []
    files:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: "authoring.ts gains three generic extensions: optional hooks startup(env)
      invocation after env construction (coded errors surface via the existing err.code->makeError
      catch), completeStep recognizes discovery and scenarios setting
      discovery_reviewed/scenarios_reviewed, and data.next_ids is served for the scenarios step."
    files_changed:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
  - id: TASK-004
    title: Implement the fail-loud policy loader and confirmed discovery gate with error codes
    description: "Rework src/stages/requirements/hooks.ts (CMP-002, CMP-003) and add the three error
      codes to src/policies/errors.yaml (CMP-009). The hooks module gains a startup entry point that
      loads requirements-policy.yaml once per invocation: a missing file throws a coded
      STAGE_POLICY_MISSING error, an unparsable file or non-mapping throws STAGE_POLICY_INVALID
      naming the file, and shape violations (version not 1, empty or duplicate lenses, missing or
      extra clarity anchors, required_lenses not a subset of the vocabulary, non-positive-integer
      minimums) throw STAGE_POLICY_INVALID naming the offending field path. Delete the silent
      fallback constants. discoveryGate reads only the policy, adds confirmed
      (metadata.discovery_reviewed) and clarity_valid (false when the artifact clarity is not an
      anchor, failing the gate) to its result, and extraStep holds the discovery step until the gate
      passes and the flag is true. recordAnswer validates --lens against the policy vocabulary and
      throws UNKNOWN_LENS listing the valid lenses; setClarity validates against the policy anchors.
      Error catalog entries carry messages and fix hints."
    type: implementation
    status: done
    complexity: high
    covers:
      - FR-001
      - FR-002
      - FR-003
      - FR-004
      - FR-005
    acceptance_ids:
      - AC-001
      - AC-002
      - AC-003
      - AC-004
      - AC-005
      - AC-006
    design_refs:
      - DEC-001
      - DEC-002
      - DEC-003
      - DEC-009
      - DEC-010
    depends_on:
