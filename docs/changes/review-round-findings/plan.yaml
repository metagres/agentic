milestones:
  - id: MS-1
    title: Policy foundation
    tasks:
      - TASK-001
    done_when: >
      src/policies/errors.yaml carries UNKNOWN_FINDING_TARGET, FINDINGS_ENTRY_INVALID, and
      SEMANTIC_WALK_INVALID and npm run validate:policies passes.
  - id: MS-2
    title: Round lifecycle
    tasks:
      - TASK-002
    done_when: >
      Bare invocations open or refresh an open round, verdicts complete in place or append closed,
      legacy rounds stay byte-identical, the conditional implementation_status field is preserved,
      and dry-run writes nothing.
  - id: MS-3
    title: Reviewer input path
    tasks:
