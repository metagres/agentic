      nothing written, mechanical-failure rounds carry no semantic block); the accept_blocked path
      named explicitly per DEC-002 — no AC exercises it, so the test asserts the token, the
      unchanged artifact status, the CANNOT_ACCEPT error, and that --accept --note records the note
      as rationale on the blocked round (DEC-004 on the blocked path, follow-up note 2); the frozen
      envelope shape (AC-020); and dry-run bare/verdict writing nothing while reporting the decision
      that would be recorded (AC-002, follow-up note 3). Test note (follow-up note 5): the DM-004 id
      pattern ^[A-Z]{2,6}-[0-9]{2,4}$ excludes single-letter-prefixed ids such as F-001, so a target
      referencing F-001 is classified as free text and never warns — assert this documented behavior
      so the blind spot is pinned.
