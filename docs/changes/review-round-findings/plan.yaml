      Completed rounds carry decision, rationale (DEC-004 on all three verdict paths), semantic
      block, and findings without severity; accept_blocked leaves the artifact unchanged with
      CANNOT_ACCEPT; the envelope keeps its seven frozen top-level fields.
  - id: MS-5
    title: Contract verified
    tasks:
      - TASK-007
      - TASK-008
    done_when: |
      The new unit contract suite and the updated e2e suites pass under npm run check:all.
risks:
  - id: R-01
    description: >
      DM-004 id-pattern blind spot: ^[A-Z]{2,6}-[0-9]{2,4}$ excludes single-letter-prefixed ids such
      as F-001, so finding targets referencing them are treated as free text and never warn
      (design-review round-2 follow-up note 5, advisory).
    mitigation: >
      Documented behavior asserted in the TASK-007 test notes so the blind spot is pinned; widening
      the pattern changes DM-004 and is a design-review event, not an implementation decision.
  - id: R-02
    description: >
      Reviewer agents must actually supply findings; the CLI can only enforce the hard error on
      rationale-less semantic rejections, not force substantive notes (requirements
      risks_and_dependencies).
    mitigation: >
      FR-012 instructions on every bare invocation with passing mechanical checks name that
      acceptance requires the complete semantic walk and rejection requires --note or --findings;
      TASK-007 asserts the instruction text.
  - id: R-03
    description: >
      Legacy review files whose rounds lack a status field must remain readable without migration; a
      legacy inspection round could be misread as a completed verdict (requirements assumption 4,
      unverified until planning).
    mitigation: >
      The legacy-rounds-are-closed rule is implemented in TASK-002 and asserted byte-identical in
      TASK-007 (AC-007); no migration code exists anywhere in this plan — confirmed during planning
      that none is needed.
  - id: R-04
    description: >
      The round store, input gate, and verdict composer all restructure
      src/scripts/lib/kinds/review.ts; overlapping edits could conflict.
    mitigation: >
      Strict dependency chain TASK-002 → TASK-003 → TASK-006 with no parallel edits to review.ts;
      TASK-004 and TASK-005 isolate new logic in src/scripts/lib/review-findings.ts and touch
      review.ts only for call-site wiring after TASK-003 lands.
