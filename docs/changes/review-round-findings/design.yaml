delta:
  - phase: Design
    target_doc: docs/current/api-contract.md
    target_anchor: "## Endpoints (CLI Commands)"
    entity_id: null
    change: Modify
    reason: The review-kind CLI row gains the verdict-scoped, mutually exclusive --note and --findings
      flags; verdicts complete the latest open round in place instead of appending a second round,
      and the round payload carries status, rationale, semantic results, and reviewer findings
      without severity.
    date: 2026-09-02
  - phase: Design
    target_doc: docs/current/glossary.md
    target_anchor: null
    entity_id: null
    change: Add
    reason: "Add a Review Round entity documenting the extended round schema: status open/closed with
      the legacy-rounds-are-closed rule, decision tokens review/accepted/rejected/accept_blocked,
      rationale, the semantic block of per-check results with evidence, and reviewer findings that
      never carry a severity field."
    date: 2026-09-02
  - phase: Design
    target_doc: docs/current/capabilities.md
    target_anchor: "## Workflows"
    entity_id: null
    change: Modify
    reason: The Review gate workflow row changes from append round to open-or-refresh round then
      complete the latest open round on verdict, reflecting that bare invocations no longer append
      content-free inspection rounds and verdicts carry reviewer findings and semantic walks.
    date: 2026-09-02
