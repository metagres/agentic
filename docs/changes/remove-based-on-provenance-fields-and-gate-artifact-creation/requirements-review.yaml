    semantic:
      results:
        - check_id: Does every Then-clause in acceptance_criteria describe an observable external result (HTTP
            response, persisted file, log line), not an internal function call?
          status: pass
          evidence: "All 17 ACs assert external observables: blocked envelope returned, design.yaml
            created/not created, lint-artifact findings, grep results over src/ and bin/, file
            diffs."
        - check_id: Does each AC assert system behavior under test, not the existence of tests or a process
            step?
          status: pass
          evidence: ACs assert CLI/file-system behavior (e.g. AC-004 no design.yaml written; AC-012 every
            artifact lints clean). FR-006 covers the test suite itself as the deliverable under
            change.
        - check_id: Does at least one acceptance criterion cover a boundary or negative case?
          status: pass
          evidence: "Boundary: AC-003 source-tree grep, AC-007 empty requires list, AC-013 migrated-artifact
            diff. Negative: AC-002, AC-006, AC-009, AC-015."
        - check_id: Does each FR whose behavior could fail or be misused have at least one AC covering a
            negative path?
          status: pass
          evidence: FR-001 AC-002 (legacy key fails validation); FR-002 AC-006 (lazy instantiation blocked);
            FR-003 AC-009 (no hardcoded literals); FR-006 AC-015 (no stale assertions).
        - check_id: Is no critical assumption left unverified unless explicitly accepted as a residual risk?
          status: pass
          evidence: The single unverified assumption (no external consumers of based_on_ keys) is severity low
            with a matching risks_and_dependencies entry; no critical assumption is unverified.
        - check_id: Does each verified assumption source reference a plausible repo path or evidence location?
          status: pass
          evidence: Sources cite src/scripts/lib/validate.ts DEC-010 comment, test/unit/validate.test.ts,
            src/stages/design/schema.yaml, src/stages/planning/schema.yaml, and the change-folder
            model.
        - check_id: Does each risk have a corresponding failure_paths entry, and each unverified assumption a
            corresponding risk entry?
          status: pass
          evidence: Unverified assumption maps to the third risks_and_dependencies entry; failure_paths covers
            out-of-order start (STAGE_GATE_BLOCKED) and legacy keys (schema finding + FR-005 strip).
        - check_id: Do any functional requirements contradict the out_of_scope list, another FR, or an NFR?
          status: pass
          evidence: FRs remove fields and gate creation; out_of_scope excludes a based_on descriptor field and
            staleness warnings, which no FR introduces. NFR-001 generalizes FR-003 without
            contradiction.
        - check_id: Does the problem statement describe the problem, not a solution?
          status: pass
          evidence: Problem statement describes the unused provenance values, the ungated creation path, and
            the redundancy; solutions appear only in FRs.
        - check_id: Could any requirement or acceptance criterion be read in more than one way by a machine
            consumer? If so, split it, add precision, or record a discovery question.
          status: pass
          evidence: FR-002 enumerates both creation triggers (--change with --request and lazy instantiation)
            and names the exact error code STAGE_GATE_BLOCKED; AC-004 fixes the expected envelope
            fields.
        - check_id: Is each requirement description phrased in EARS form (When <trigger>, the system shall
            <response>) or an equally unambiguous pattern?
          status: pass
          evidence: All six FRs and NFR-001 open with When <trigger>, the system shall <response>.
        - check_id: Does each requirement describe exactly one verifiable behavior, with no conjunctions
            joining unrelated behaviors?
          status: pass
          evidence: "Each FR carries one behavior: field removal, creation gate, data-driven gate, init
            predicates, migration, test suite. NFR-001 binds the single property of
            descriptor-driven enforcement."
        - check_id: Do the acceptance criteria nested under the functional and non-functional requirements
            cover happy, edge, negative, and boundary cases for the core behaviors, with each
            criterion verifying the requirement that carries it?
          status: pass
          evidence: 17 ACs across 7 requirements span all four categories; each AC references its owning FR's
            behavior (e.g. AC-008 verifies FR-003 re-rooting, AC-012 verifies FR-005 migration).
        - check_id: Do delta entries plausibly describe the living docs affected by the requirements?
          status: pass
          evidence: Four entries target existing docs/current/ files (capabilities, architecture,
            api-contract, decisions) matching the behavioral, structural, envelope, and decision
            surfaces touched.
