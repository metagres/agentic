    semantic:
      results:
        - check_id: Is task granularity consistent? No task should be so broad it hides sub-decisions, and
            none so narrow it's pseudocode.
          status: pass
          evidence: "Six tasks: the high-complexity gate task is fully specified by DEC-002/003 (three sites,
            error type, envelope shape); the rest are mechanical single-concern units with concrete
            file lists."
        - check_id: Does task order reflect real-world constraints (e.g., schema creation before queries,
            characterization tests before refactoring)?
          status: pass
          evidence: TASK-001 removes stamping before TASK-002 forbids the keys in schemas (stated dependency
            rationale); TASK-005 migration follows the schema change so lint verification is
            meaningful; TASK-006 runs the DoD gates last.
        - check_id: Are each task's acceptance criteria actually verifiable with clear pass/fail conditions?
          status: pass
          evidence: "Every implementation_note states binary done-when conditions: exact envelope shape and
            error code, grep outcomes, lint zero-findings, git diff audit limited to deleted key
            lines, exit codes for validate and deploy:smoke."
        - check_id: Does completing 100% of the listed tasks actually satisfy 100% of the requirements?
          status: pass
          evidence: All 17 ACs appear in acceptance_ids across TASK-001..006; FR-001..FR-006 and NFR-001 each
            covered (FR-001 T2/T3, FR-002/003 T1, FR-004 T2, FR-005 T5, FR-006 T4, NFR-001 T1/T4).
        - check_id: Does any task assume a design decision that was never made explicit in the design phase?
          status: pass
          evidence: Every task cites design_refs DEC-001..DEC-004, all present and accepted in the accepted
            design.yaml; no task introduces an unrecorded mechanism.
        - check_id: Are complexity estimates plausible given the task description and files touched?
          status: pass
          evidence: high for the three-site gate with error envelope; medium for the eight-file contract strip
            and the four-path test file; low for helper deletion, line-level migration, and gate
            execution.
        - check_id: For refactor tasks, are there tasks ensuring behavior-preserving tests exist before the
            tasks that change the code?
          status: pass
          evidence: TASK-004 adds the creation-gate tests immediately after the gate lands; refactors in
            TASK-002/003 are verified by lint, typecheck, and grep with the full suite green in
            TASK-006; migration preserves bytes per the AC-013 diff audit.
        - check_id: Do any two tasks touch the same component or logical area in a way that could conflict?
          status: pass
          evidence: "File sets are disjoint: authoring.ts (T1), stage folders (T2), stage-helpers+validate
            (T3), tests (T4), docs/changes artifacts (T5); the T1/T3 caller-callee ordering is
            captured by depends_on."
        - check_id: Do delta entries plausibly describe the living docs affected by the plan?
          status: pass
          evidence: Four entries target existing docs/current/ files (capabilities, architecture,
            api-contract, decisions) consistent with the design-phase deltas and the surfaces the
            tasks change.
