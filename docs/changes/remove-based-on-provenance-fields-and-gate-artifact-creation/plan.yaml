metadata:
  id: PLAN-001
  title: "Plan: remove-based-on-provenance-fields-and-gate-artifact-creation"
  stage: planning
  status: accepted
  version: 0.1.0
  created: 2026-09-03
  updated: 2026-09-03
  implementation_status: accepted
tasks:
  - id: TASK-001
    title: Add data-driven creation gate to authoring kind first-creation paths
    description: >
      In src/scripts/lib/kinds/authoring.ts: add a creation-gate guard that no-ops when
      stage.requires is empty (root stage) or when the artifact file already exists (the gate guards
      first creation only); otherwise call evaluateGate from src/scripts/lib/requires-graph.ts
      unchanged and throw a CreationBlockedError carrying the GateResult. Insert the guard at the
      three first-creation sites: (1) inside createChangeDir after the root path is computed and
      before any mkdir/artifact write, covering both the plain --request path and the
      --change+--request explicit-slug path; (2) in the inline lazy-instantiation block of
      runAuthoringStage; (3) in ensureArtifact before instantiate/save (covering --update-artifact,
      --append-delta, --record-answer(s), --set-clarity, --complete-step, and --finalize on a
      missing artifact). Catch CreationBlockedError in runAuthoringStage and emit the blocked
      envelope mirroring the finalize-time gate shape at authoring.ts:829-856: step blocked, state
      blocked, STAGE_GATE_BLOCKED error, data.unsatisfied_requirements. Delete the based_on_
      stamping blocks from instantiateArtifact. No stage id or artifact filename literal may
      participate in the gate decision (FR-003).
    type: implementation
    status: done
    complexity: high
    covers:
      - FR-002
      - FR-003
      - NFR-001
    acceptance_ids:
      - AC-004
      - AC-005
      - AC-006
      - AC-007
      - AC-008
      - AC-009
      - AC-016
      - AC-017
    design_refs:
      - DEC-002
      - DEC-003
    depends_on: []
    files:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
    implementation_note: "Added CreationBlockedError (carries GateResult) and data-driven
      assertCreationAllowed guard (no-ops on empty requires or existing artifact file; otherwise
      evaluateGate unchanged). Guard inserted at all three first-creation sites: createChangeDir
      (after root computed, before mkdir/write), inline lazy-init in runAuthoringStage,
      ensureArtifact before instantiate/save (covers
      --update-artifact/--append-delta/--record-answer(s)/--set-clarity/--complete-step/--finalize).
      runAuthoringStage catch emits blocked STAGE_GATE_BLOCKED envelope with
      data.unsatisfied_requirements mirroring the finalize-time gate shape. Deleted based_on_
      stamping from instantiateArtifact and the baseVersion import. Verified: unsatisfied gate via
      --request/--next-ids/--update-artifact returns STAGE_GATE_BLOCKED naming
      stage/artifact/status/required with zero files written; satisfied gate and root stage (empty
      requires) create normally; no stage-id or artifact-filename literal in the gate/creation path;
      typecheck green."
    started_at: 2026-09-03
    files_changed:
      - path: src/scripts/lib/kinds/authoring.ts
        operation: modify
    completed_at: 2026-09-03
  - id: TASK-002
    title: Remove based_on_ fields from design and planning stage contracts
    description: >
      Remove based_on_requirements from src/stages/design/schema.yaml (required list and properties)
      and based_on_design plus based_on_requirements from src/stages/planning/schema.yaml (required
      lists and properties); drop the keys from both stages' template.yaml metadata; drop them from
      hooks.ts getExtraData in both stages; drop the init complete_when predicates over
      metadata.based_on_ from both steps.yaml files and reword the init markdown so no specific
      predecessor artifact filename is named. The implementation stage declares schema_from:
      planning in src/stages/implementation/stage.yaml and inherits the updated plan.yaml contract
      automatically — verify that file needs no change.
    type: refactor
    status: done
    complexity: medium
    covers:
      - FR-001
      - FR-004
    acceptance_ids:
      - AC-001
      - AC-002
      - AC-003
      - AC-010
      - AC-011
    design_refs:
      - DEC-001
    depends_on:
      - TASK-001
    files:
      - path: src/stages/design/schema.yaml
        operation: modify
      - path: src/stages/design/template.yaml
        operation: modify
      - path: src/stages/design/hooks.ts
        operation: modify
      - path: src/stages/design/steps.yaml
        operation: modify
      - path: src/stages/planning/schema.yaml
        operation: modify
      - path: src/stages/planning/template.yaml
        operation: modify
      - path: src/stages/planning/hooks.ts
        operation: modify
      - path: src/stages/planning/steps.yaml
        operation: modify
    implementation_note: "Removed based_on_requirements from design schema (required+properties) and
      based_on_design/based_on_requirements from planning schema (required+properties); dropped the
      keys from both templates' metadata; removed the now-empty getExtraData key exposures from both
      hooks (behavior-identical no-op, per DEC-001 hook-envelope removal); deleted the init
      complete_when predicates over metadata.based_on_ from both steps.yaml and reworded init
      markdown to name no predecessor artifact filename. Verified: lint of an artifact carrying the
      key yields the schema additionalProperties finding; lint of a stripped artifact returns zero
      findings and zero based_on mentions; validate:policies and validate:templates exit 0;
      src/stages/implementation/stage.yaml untouched with schema_from: planning intact (line 7).
      Incidental note: getExtraData removed entirely rather than returning {} — identical envelope
      behavior."
    started_at: 2026-09-03
    files_changed:
      - path: src/stages/design/schema.yaml
        operation: modify
      - path: src/stages/design/template.yaml
        operation: modify
      - path: src/stages/design/hooks.ts
        operation: modify
      - path: src/stages/design/steps.yaml
        operation: modify
      - path: src/stages/planning/schema.yaml
        operation: modify
      - path: src/stages/planning/template.yaml
        operation: modify
      - path: src/stages/planning/hooks.ts
        operation: modify
      - path: src/stages/planning/steps.yaml
        operation: modify
    completed_at: 2026-09-03
  - id: TASK-003
    title: Delete baseVersion helper and update DEC-010 comment
    description: >
      Delete baseVersion from src/scripts/lib/stage-helpers.ts — its only callers were the stamping
      blocks removed in TASK-001. Update the DEC-010 provenance comment in
      src/scripts/lib/validate.ts to state that the based_on_ fields no longer exist, superseded by
      DEC-001.
    type: refactor
    status: done
    complexity: low
    covers:
      - FR-001
    acceptance_ids:
      - AC-003
    design_refs:
      - DEC-001
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/stage-helpers.ts
        operation: modify
      - path: src/scripts/lib/validate.ts
        operation: modify
    implementation_note: "Deleted baseVersion from stage-helpers.ts along with its now-orphaned path and
      safeReadYaml imports. Updated the validate.ts provenance comment: based_on_* fields no longer
      exist anywhere, superseding the DEC-010 rationale per DEC-001. Verified: typecheck exits 0;
      grep over src/ and bin/ finds no baseVersion and no live based_on_ code reference (remaining
      hits are generated codemap.md files — hand-editing them is forbidden by repo invariant,
      regeneration belongs to the codemap skill — and the superseding comment itself)."
    started_at: 2026-09-03
    files_changed:
      - path: src/scripts/lib/stage-helpers.ts
        operation: modify
      - path: src/scripts/lib/validate.ts
        operation: modify
    completed_at: 2026-09-03
  - id: TASK-004
    title: Realign test suite with creation gate and field removal
    description: >
      test/helpers/artifacts.ts stops setting based_on_requirements and based_on_design. Remove the
      DEC-010 cross-check unit test (no cross-artifact version equality findings) from
      test/unit/validate.test.ts and the based_on_design envelope assertion from
      test/e2e/authoring.test.ts. Create test/unit/creation-gate.test.ts covering four paths: (1)
      blocked creation — unsatisfied gate returns STAGE_GATE_BLOCKED and writes no artifact file;
      (2) allowed creation — accepted predecessor yields an instantiated artifact and a non-blocked
      envelope; (3) root-stage skip — empty requires creates without gate evaluation; (4) re-rooting
      criterion — through a synthetic stages directory, a stage with an empty requires list is
      allowed purely from descriptor data with zero engine change.
    type: test
    status: done
    complexity: medium
    covers:
      - FR-006
      - NFR-001
    acceptance_ids:
      - AC-014
      - AC-015
      - AC-016
    design_refs:
      - DEC-002
      - DEC-003
    depends_on:
      - TASK-001
      - TASK-002
      - TASK-003
    files:
      - path: test/helpers/artifacts.ts
        operation: modify
      - path: test/unit/validate.test.ts
        operation: modify
      - path: test/e2e/authoring.test.ts
        operation: modify
      - path: test/unit/creation-gate.test.ts
        operation: create
    implementation_note: "Helpers stop setting based_on_ keys (dead reqVersion/designVersion params
      removed; full-pipeline call sites passing them stay untouched and harmless). Removed the
      DEC-010 cross-check test from validate.test.ts. Realigned the e2e 'planning enters init when
      design is missing' test to the gated contract: it now asserts the blocked STAGE_GATE_BLOCKED
      envelope with no plan.yaml written (the based_on_design assertion is gone; the old premise —
      ungated creation into init — is precisely the behavior the gate forbids). Created
      test/unit/creation-gate.test.ts covering all four paths: blocked creation via CLI
      (STAGE_GATE_BLOCKED, unsatisfied requirement named with status/required, no change dir),
      allowed creation via CLI with accepted predecessor, root-stage skip via CLI, and the
      re-rooting criterion through a synthetic stages directory (gated descriptor blocked; identical
      descriptor minus requires allowed, zero engine change). Engine note: assertCreationAllowed
      passes path.dirname(stage.folder) as evaluateGate's stagesDir so the gate resolves the same
      registry the stage record came from — identical to default resolution in production,
      self-consistent for injected stage dirs (required for the planned synthetic-dir test).
      Verified: creation-gate 4/4 pass, test:unit 296/296, test:e2e 51/51, zero based_on_ assertions
      in the suite."
    started_at: 2026-09-03
    files_changed:
      - path: test/helpers/artifacts.ts
        operation: modify
      - path: test/unit/validate.test.ts
        operation: modify
      - path: test/e2e/authoring.test.ts
        operation: modify
      - path: test/unit/creation-gate.test.ts
        operation: create
    completed_at: 2026-09-03
  - id: TASK-005
    title: Migrate existing change artifacts by line-level key strip
    description: >
      One-time migration: strip the metadata lines for based_on_requirements and based_on_design
      from every docs/changes/*/design.yaml and docs/changes/*/plan.yaml using a line-level filter
      that removes exactly the lines matching the two keys and preserves every other byte; no
      version bump; status, created, and all review files untouched. Verify AC-012 by running
      bin/lint-artifact.ts over every migrated design.yaml and plan.yaml against the updated schemas
      (zero blocking findings) and AC-013 by a git diff audit showing the only differences are the
      deleted key lines.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-005
    acceptance_ids:
      - AC-012
      - AC-013
    design_refs:
      - DEC-004
    depends_on:
      - TASK-002
    files:
      - path: docs/changes/*/design.yaml
        operation: modify
      - path: docs/changes/*/plan.yaml
        operation: modify
    implementation_note: "Line-level sed filter deleted exactly the metadata lines matching
      ^\\s*based_on_(requirements|design): from all 34 docs/changes design.yaml and plan.yaml (32
      tracked + this change's 2 untracked); every other byte preserved. AC-013 diff audit: 0 added
      lines, all 48 deleted lines match the two keys, no review/requirements file touched, no
      version/status/created change. AC-012 verification: all 17 design.yaml lint with ZERO blocking
      findings (the removed key was each file's only finding). Plan.yaml blocking counts dropped by
      exactly 2 per file (the two forbidden-additional-property findings); zero findings reference
      based_on_. DEVIATION FLAGGED FOR REVIEW: 16 historical plan.yaml files retain pre-existing
      blocking findings (ref-exists against old flat acceptance_criteria formats; milestones missing
      done_when/tasks under the evolved schema) — proven pre-existing by linting the HEAD versions
      via git stash (identical findings minus the 2 based_on_ schema violations). Eliminating them
      would require editing accepted historical artifacts, violating FR-005/AC-013's only-difference
      mandate; AC-012's zero-findings reading is satisfied for all migration-attributable findings
      and for every design artifact."
    started_at: 2026-09-03
    files_changed:
      - path: docs/changes/*/design.yaml
        operation: modify
      - path: docs/changes/*/plan.yaml
        operation: modify
    completed_at: 2026-09-03
  - id: TASK-006
    title: Run Definition of Done gates (validate + deploy smoke)
    description: >
      Run npm run validate (schemas + policies + templates + typecheck + unit tests — the repo
      Definition of Done fast gate) and npm run deploy:smoke, because stage folders and templates
      feed the deployed skill and deployment regeneration is required. Fix any blocking finding and
      re-run until both pass.
    type: verification
    status: done
    complexity: low
    covers:
      - FR-001
      - FR-002
      - FR-003
      - FR-004
      - FR-005
      - FR-006
      - NFR-001
    acceptance_ids:
      - AC-014
      - AC-016
    design_refs:
      - DEC-001
      - DEC-002
      - DEC-003
      - DEC-004
    depends_on:
      - TASK-001
      - TASK-002
      - TASK-003
      - TASK-004
      - TASK-005
    implementation_note: "npm run validate exit 0 (schemas + policies + templates + typecheck + 296/296
      unit tests). npm run deploy:smoke exit 0 with all six agents smoke-passed. Regenerated bundle
      verified: zero based_on_ occurrences in deployed design/planning schemas and templates; the
      bundle carries the creation gate (assertCreationAllowed/CreationBlockedError present in
      sdlc.js); deployed-CLI smoke confirms an unsatisfied gate returns state blocked with
      STAGE_GATE_BLOCKED and writes no artifact."
    started_at: 2026-09-03
    files_changed: []
    completed_at: 2026-09-03
milestones:
  - id: MS-001
    title: Creation gate enforced in the authoring kind
    tasks:
      - TASK-001
    done_when: All three first-creation sites evaluate the acceptance gate via evaluateGate; an
      unsatisfied gate emits the blocked STAGE_GATE_BLOCKED envelope with no artifact written; root
      stages skip the gate; based_on_ stamping is deleted.
  - id: MS-002
    title: Stage contracts and helpers cleaned of based_on_
    tasks:
      - TASK-002
      - TASK-003
    done_when: Design and planning schemas, templates, hooks, and steps carry no based_on_ reference;
      baseVersion is deleted; the DEC-010 comment states the fields no longer exist.
  - id: MS-003
    title: Test suite realigned
    tasks:
      - TASK-004
    done_when: creation-gate.test.ts covers blocked, allowed, root-skip, and re-rooting paths; no
      based_on_ assertion remains anywhere in the suite; npm run validate is green.
  - id: MS-004
    title: Existing artifacts migrated
    tasks:
      - TASK-005
    done_when: Every docs/changes design.yaml and plan.yaml is stripped of the two keys; lint over all
      migrated artifacts returns zero blocking findings; the git diff audit shows only the key lines
      removed.
  - id: MS-005
    title: Definition of Done
    tasks:
      - TASK-006
    done_when: npm run validate and npm run deploy:smoke both pass.
risks:
  - id: RISK-001
    description: A first-creation path is missed (for example an ensureArtifact caller or the
      explicit-slug --change+--request path), leaving an ungated creation route.
    mitigation: Enumerate all instantiate/save call sites in authoring.ts before editing;
      creation-gate.test.ts exercises the --request, lazy-init, and ensureArtifact paths.
  - id: RISK-002
    description: The migration filter alters bytes beyond the two key lines or touches review files,
      violating AC-013.
    mitigation: Line-level filter matching only the two metadata keys; per-file git diff audit before
      completing the migration task.
  - id: RISK-003
    description: Unknown external tooling parses based_on_ keys from artifacts or CLI envelopes
      (unverified assumption, low severity).
    mitigation: Delta entries record the envelope and contract change; the deployed skill is regenerated
      and covered by deploy smoke.
