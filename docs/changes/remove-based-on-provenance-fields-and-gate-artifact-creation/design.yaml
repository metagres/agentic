metadata:
  id: DES-001
  title: 'Design: remove-based-on-provenance-fields-and-gate-artifact-creation'
  stage: design
  status: accepted
  version: 0.1.0
  created: 2026-09-03
  updated: 2026-09-03
  delta_reviewed: false
context_summary: 'The based_on_requirements and based_on_design provenance fields are removed from every
  layer that carries them: the design and planning schemas and templates, the hook envelope exposure,
  the instantiateArtifact stamping, and the baseVersion helper. Artifact creation becomes gated: every
  engine path that would first-create a non-root authoring artifact evaluates the existing acceptance
  gate via evaluateGate and refuses with a STAGE_GATE_BLOCKED envelope when unsatisfied, while stages
  with an empty requires list skip the gate entirely. The gate derives everything from the stage descriptor
  requires list, so pipeline position stays a pure stage.yaml concern and re-rooting design requires zero
  code change. The init steps of design and planning lose their based_on_ completion predicates and their
  predecessor-naming guidance. Existing artifacts are migrated by a one-time line-level strip of the two
  keys, verified by lint and a git diff audit. Tests cover the blocked and allowed creation paths and
  the re-rooting criterion, and all based_on_ assertions are removed.'
components:
- id: CMP-001
  name: Design stage artifact contract
  responsibility: Remove based_on_requirements from src/stages/design/schema.yaml (required list and properties)
    and from template.yaml metadata; drop the based_on_requirements key from hooks.ts getExtraData; drop
    the init complete_when predicate from steps.yaml and reword the init markdown so no predecessor artifact
    filename is named. Covers FR-001, FR-004.
  files:
  - path: src/stages/design/schema.yaml
    operation: modify
  - path: src/stages/design/template.yaml
    operation: modify
  - path: src/stages/design/hooks.ts
    operation: modify
  - path: src/stages/design/steps.yaml
    operation: modify
- id: CMP-002
  name: Planning stage artifact contract
  responsibility: 'Remove based_on_design and based_on_requirements from src/stages/planning/schema.yaml
    (required lists and properties) and from template.yaml metadata; drop both keys from hooks.ts getExtraData;
    drop the init complete_when predicate from steps.yaml and reword the init markdown so no predecessor
    artifact filename is named. The implementation stage (src/stages/implementation) declares schema_from:
    planning in its stage.yaml, so it inherits the updated plan.yaml contract — its artifact loses the
    fields automatically and needs no file change of its own. Covers FR-001, FR-004.'
  files:
  - path: src/stages/planning/schema.yaml
    operation: modify
  - path: src/stages/planning/template.yaml
    operation: modify
  - path: src/stages/planning/hooks.ts
    operation: modify
  - path: src/stages/planning/steps.yaml
    operation: modify
  - path: src/stages/implementation/stage.yaml
    operation: none
- id: CMP-003
  name: Authoring kind creation gate and instantiation
  responsibility: 'In src/scripts/lib/kinds/authoring.ts: delete the based_on_ stamping blocks from instantiateArtifact;
    add a creation-gate guard that no-ops when stage.requires is empty (root stage) or when the artifact
    file already exists (the gate guards first creation only), otherwise calls evaluateGate from src/scripts/lib/requires-graph.ts
    unchanged and throws a CreationBlockedError carrying the GateResult; insert the guard at the three
    first-creation sites — inside createChangeDir after the root path is computed and before any mkdir/artifact
    write (covering both the plain --request path and the --change+--request explicit-slug path), in the
    inline lazy-instantiation block of runAuthoringStage, and in ensureArtifact before instantiate/save
    (covering --update-artifact, --append-delta, --record-answer(s), --set-clarity, --complete-step, and
    --finalize on a missing artifact); catch CreationBlockedError in runAuthoringStage and emit the blocked
    envelope mirroring the finalize-time gate shape at authoring.ts:829-856 (step blocked, state blocked,
    STAGE_GATE_BLOCKED error, data.unsatisfied_requirements). No stage id or artifact filename literal
    participates in the gate decision. Covers FR-002, FR-003, NFR-001.'
  files:
  - path: src/scripts/lib/kinds/authoring.ts
    operation: modify
- id: CMP-004
  name: Shared helper and validation-comment cleanup
  responsibility: Delete baseVersion from src/scripts/lib/stage-helpers.ts (its only callers were the
    removed stamping blocks in instantiateArtifact) and update the DEC-010 provenance comment in src/scripts/lib/validate.ts
    to state that the based_on_ fields no longer exist, superseded by DEC-001. Covers FR-001.
  files:
  - path: src/scripts/lib/stage-helpers.ts
    operation: modify
  - path: src/scripts/lib/validate.ts
    operation: modify
- id: CMP-005
  name: Test suite realignment
  responsibility: test/helpers/artifacts.ts stops setting based_on_requirements and based_on_design; remove
    the DEC-010 cross-check unit test (no cross-artifact version equality findings) from test/unit/validate.test.ts
    and the based_on_design envelope assertion from test/e2e/authoring.test.ts; add unit tests covering
    the blocked creation path (unsatisfied gate returns STAGE_GATE_BLOCKED and writes no artifact file),
    the allowed creation path (accepted predecessor yields an instantiated artifact and a non-blocked
    envelope), the root-stage skip (empty requires creates without gate evaluation), and the re-rooting
    criterion exercised through a synthetic stages directory where a stage with an empty requires list
    is created purely from descriptor data. Covers FR-006, NFR-001.
  files:
  - path: test/helpers/artifacts.ts
    operation: modify
  - path: test/unit/validate.test.ts
    operation: modify
  - path: test/e2e/authoring.test.ts
    operation: modify
  - path: test/unit/creation-gate.test.ts
    operation: create
- id: CMP-006
  name: One-time artifact migration
  responsibility: Strip the two based_on_ keys from the metadata of every existing docs/changes/*/design.yaml
    and plan.yaml using a line-level filter that removes exactly the lines matching the two keys and preserves
    every other byte; no version bump; status, created, and all review files untouched. Verify AC-012
    by running bin/lint-artifact.ts over every migrated design.yaml and plan.yaml against the updated
    schemas (zero blocking findings) and AC-013 by a git diff audit showing the only differences are the
    deleted key lines. Covers FR-005.
  files:
  - path: docs/changes/*/design.yaml
    operation: modify
  - path: docs/changes/*/plan.yaml
    operation: modify
data_models:
- id: DM-001
  name: Authoring artifact metadata after removal
  description: The design.yaml and plan.yaml metadata objects lose based_on_requirements and based_on_design.
    Both schemas declare additionalProperties false on metadata, so any existing artifact still carrying
    the keys produces a schema finding naming the forbidden additional property (AC-002) — the trigger
    for the FR-005 migration. No new metadata field is introduced.
- id: DM-002
  name: Creation-gate result and blocked envelope
  description: 'The gate reuses GateResult and UnsatisfiedRequirement from src/scripts/lib/requires-graph.ts
    unchanged: each unsatisfied entry carries stage, artifact, status, required. The creation-time blocked
    envelope copies the finalize-time shape — step blocked, state blocked, errors [STAGE_GATE_BLOCKED],
    data.unsatisfied_requirements — so callers cannot distinguish where the gate fired.'
apis:
- id: API-001
  path: sdlc <authoring-stage> --request | --change <slug> --request
  method: CLI
  description: Change and artifact creation path. For a non-root stage (non-empty requires) the acceptance
    gate is evaluated before anything is written; an unsatisfied gate returns a blocked STAGE_GATE_BLOCKED
    envelope with data.unsatisfied_requirements and creates no artifact file (AC-004, AC-006). A satisfied
    gate or an empty requires list creates the change directory and artifact normally (AC-005, AC-007).
- id: API-002
  path: sdlc <authoring-stage> --update-artifact|--append-delta|--finalize|... (lazy instantiation)
  method: CLI
  description: Commands that lazily instantiate a missing artifact evaluate the creation gate first and
    return the same blocked envelope as API-001 when unsatisfied. Existing artifacts are unaffected (the
    gate guards first creation only) and the finalize-time gate keeps its current semantics.
- id: API-003
  path: sdlc <authoring-stage> envelope data (stage hook extra data)
  method: CLI
  description: The based_on_requirements and based_on_design keys disappear from envelope data for the
    design and planning stages; no replacement key is added because the gate envelope already carries
    data.unsatisfied_requirements.
flows:
- id: FLOW-001
  name: Gated artifact creation
  steps:
  - An agent invokes an authoring stage with --request (new change) or with --change plus a command that
    would lazily instantiate a missing artifact.
  - runAuthoringStage resolves changeRoot; creation is needed only when the artifact file is absent.
  - The creation-gate guard inspects stage.requires; an empty list (root stage) skips the gate and creation
    proceeds (AC-007).
  - Otherwise evaluateGate(stage, changeRoot, cwd) is called unchanged from src/scripts/lib/requires-graph.ts,
    resolving each required stage's tracked artifact status.
  - Satisfied gate — instantiateArtifact (no based_on_ stamping) writes the artifact and the normal authoring
    flow continues (AC-005).
  - Unsatisfied gate — CreationBlockedError is caught and the blocked STAGE_GATE_BLOCKED envelope is returned;
    no artifact file is written (AC-004, AC-006).
  failure: Out-of-order stage start returns the blocked envelope naming each unsatisfied requirement with
    its current and required status and creates no artifact file, matching the requirements failure path.
decisions:
- id: DEC-001
  title: Remove based_on_* provenance fields entirely, superseding the DEC-010 rationale
  context: 'DEC-010 kept the fields as provenance-only because validation deliberately ignored their values.
    Discovery (DL-001) confirmed there is no machine consumer: traceability is enforced live by ref-exists
    against the current predecessor artifacts, exactly one active version of each artifact exists per
    change, and the recorded version strings have no enforced meaning.'
  decision: Remove based_on_requirements and based_on_design from every stage schema, template, hook envelope
    exposure, instantiation output, helper, and test (FR-001). The requires graph plus live ref-exists
    validation is the sole traceability mechanism. This decision supersedes the DEC-010 provenance-only
    rationale recorded in validate.ts.
  status: accepted
- id: DEC-002
  title: Gate artifact creation at first-creation time, reusing evaluateGate unchanged
  context: Artifact creation is currently ungated; the only early signal is an init step predicate over
    the very fields being removed. The finalize-time gate already implements the acceptance rule over
    the requires graph, and duplicating that rule would create a second dependency semantics.
  decision: Evaluate the acceptance gate on every path that first-creates a non-root authoring artifact
    — inside createChangeDir before any write, in the inline lazy-instantiation block of runAuthoringStage,
    and in ensureArtifact — by calling evaluateGate unchanged (FR-002). The blocked envelope reuses STAGE_GATE_BLOCKED
    with data.unsatisfied_requirements, identical to the finalize-time gate. Stages with an empty requires
    list skip the gate, and finalize-time gate semantics are untouched.
  status: accepted
- id: DEC-003
  title: No based_on descriptor field; the requires graph stays the single dependency declaration
  context: FR-003 and NFR-001 require that the creation decision derive solely from descriptor data so
    any pipeline reordering expressed through requires lists enforces identically at creation and finalize
    with zero engine change, and out_of_scope forbids introducing a based_on descriptor field.
  decision: The creation gate derives everything from the stage descriptor requires list and the tracked-artifact
    resolution of the requires graph; no engine code special-cases a stage id or artifact filename, and
    no based_on field is added to stage.yaml. The decisive re-rooting criterion — deleting requires from
    src/stages/design/stage.yaml makes design a valid starting stage with zero code change — is a stated
    design property and a planned unit test over a synthetic stages directory (AC-008, AC-016).
  status: accepted
- id: DEC-004
  title: Migration by one-time line-level strip of the two metadata keys
  context: Stage metadata schemas declare additionalProperties false, so existing artifacts carrying the
    removed keys would fail validation after the schema update (DL-003). A YAML round-trip would reformat
    the files and violate the only-difference criterion AC-013.
  decision: Migrate with a one-time line-level filter that removes exactly the metadata lines for based_on_requirements
    and based_on_design from every docs/changes/*/design.yaml and plan.yaml, preserving every other byte;
    no version bump; review files untouched (FR-005). AC-012 is verified by running bin/lint-artifact.ts
    over every migrated artifact against the updated schemas; AC-013 is verified by a git diff audit showing
    the only differences are the deleted key lines with version, status, created, and review files unchanged.
  status: accepted
