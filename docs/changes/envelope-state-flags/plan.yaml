      confirm the rendered bundle's embedded schemas carry no step property, the CLI smoke test
      passes, and .opencode/skills/agentic-sdlc/ still contains no package.json, no node_modules, no
      source .ts files, and exactly one SKILL.md. Done when: npm run check:all exits 0 and the
      rendered-bundle checks above hold.
    type: verification
    status: done
    complexity: low
    covers:
      - FR-004
      - FR-005
      - NFR-001
    acceptance_ids:
      - AC-009
      - AC-010
      - AC-011
    design_refs:
      - DEC-007
      - DEC-004
    depends_on:
