        operation: modify
    implementation_note: "Ran npm run check:all (exit 0: fast gate 219/219, unit 219/219, e2e 48/48,
      deploy bundle smoke passed) and npm run deploy:smoke (ok: true, all six agent smokes passed).
      Re-rendered the deployed runtime bundle with node bin/deploy-to-agent.ts --dest .opencode
      --clean (deploy:smoke itself targets .tmp/agent; the .opencode render is the separate --dest
      .opencode invocation per AGENTS.md). Verified rendered-bundle invariants: embedded stage
      schemas in .opencode/skills/agentic-sdlc/stages/{requirements,design,planning}/schema.yaml
      carry no step property; the skill folder contains 0 package.json, 0 node_modules, 0 source .ts
      files, exactly 1 SKILL.md; knowledge-init skill intact (SKILL.md + manifest.json); the
      deployed CLI runs against the new bundle."
    started_at: 2026-09-02
    files_changed: []
    completed_at: 2026-09-02
milestones:
  - id: M1
    title: Engine flags fixed with unit and e2e coverage
    tasks:
      - TASK-001
      - TASK-002
      - TASK-003
      - TASK-004
    done_when: >
      The data assembler derives semantic_complete from artifact status, no engine write site emits
      a metadata step key, the fabricated standard-output semantic summary is removed, the new unit
      file passes, and the extended e2e assertions pass, with the fast gate green at each task
      boundary.
  - id: M2
    title: Corpus clean and schemas tightened
    tasks:
      - TASK-005
      - TASK-006
    done_when: >
      A line search over docs/changes/ returns zero artifact files carrying a metadata step key, and
      none of the requirements, design, or planning stage schemas declares a step property, with the
      fast gate green after the sweep and again after the tightening.
  - id: M3
    title: Deltas confirmed and bundle re-rendered
    tasks:
      - TASK-007
      - TASK-008
    done_when: >
      The two Planning-phase delta entries are confirmed against the landed behavior and npm run
      check:all passes with the re-rendered bundle embedding the tightened schemas and the
      skill-folder invariants intact.
risks:
  - id: RISK-001
    description: >
      The one-time sweep edits every artifact file under docs/changes/ (36 or more files across 12
      change directories, including this change's own accepted requirements and design and its
      in-flight plan); an editing mistake could corrupt an accepted record and later break a review
      stage that validates it (DEC-005).
    mitigation: >
      Delete only the stale step line inside each metadata block using a scripted, reviewable edit;
      after the sweep verify every file still parses as YAML and lints clean for its stage via
      bin/lint-artifact.ts; restore any corrupted artifact from git history before any review stage
      runs against it.
  - id: RISK-002
    description: >
      Ordering hazard (DEC-007): tightening the stage schemas before the corpus sweep would make
      every legacy artifact carrying a metadata step key fail validation at finalization and review,
      including this change's own artifacts, deadlocking the pipeline mid-change.
    mitigation: >
      Enforce the task dependency TASK-005 (sweep) before TASK-006 (schema tightening); run npm run
      validate at each task boundary and never reorder the two tasks without re-running the gate on
      the intermediate state.
  - id: RISK-003
    description: >
      An unknown consumer outside this repository keying on data.metadata.step (key disappears) or
      data.semantic_complete (value changes at init) would break; the requirements verified zero
      in-repo consumers but could not verify external ones.
    mitigation: >
      Accepted as low impact and severity in the requirements; if such a consumer surfaces, apply
      the requirements failure path: restore a data-level step field fed from the envelope step
      value with no artifact persistence, then re-run the affected review.
delta:
  - phase: Planning
    target_doc: docs/current/api-contract.md
    target_anchor: Envelope
    entity_id: null
    change: Modify
    reason: >
      Authoring data payload contract: the metadata mirror in the data object carries no step key
      because artifacts no longer persist one (instantiation and finalization no longer write it,
      the requirements, design, and planning stage schemas no longer declare it, and the one-time
      corpus sweep removed the legacy lines), and semantic_complete reports true exactly when
      artifact status is ready-for-review or accepted, derived from status rather than fabricated as
      always-true.
    date: 2026-09-02
  - phase: Planning
    target_doc: docs/current/capabilities.md
    target_anchor: SDLC Goals
    entity_id: null
    change: Modify
    reason: >
      Correctness goal: authoring envelope payloads carry no field that misrepresents step-machine
      state — the metadata step flag is removed at both write sites and semantic_complete is derived
      from artifact status; the planned order (engine fix with tests, corpus sweep, schema
      tightening, delta confirmation, bundle re-render) keeps legacy artifacts valid at every task
      boundary.
    date: 2026-09-02
