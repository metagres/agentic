metadata:
  id: REQ-001
  title: "Fix authoring envelope state flags: data.metadata.step must reflect the step ..."
  stage: requirements
  status: accepted
  version: 0.1.0
  created: 2026-08-28
  updated: 2026-08-29
  request_summary: "Fix authoring envelope state flags: data.metadata.step must reflect the step
    machine's current step after every state-changing call (or be removed in favor of the envelope
    step field as single source of truth), and semantic_complete must not report true for an empty
    artifact at init."
  clarity: clear
  assumptions_reviewed: true
  delta_reviewed: true
  discovery_reviewed: true
  scenarios_reviewed: true
problem_statement: Two data flags in authoring envelopes misrepresent the step machine's real state.
  After an artifact update, the envelope's top-level step field advances while the metadata step
  flag inside data keeps the value written at init, so a consumer keying on that flag acts on wrong
  state. At init, the empty artifact reports the semantic-complete flag as true although no semantic
  confirmation has occurred; the flag is hardcoded true in every standard envelope. Consumers
  scripting against these flags receive values that contradict the envelope's authoritative fields.
discovery_log:
  - id: DL-001
    question: Does anything outside this repository (your own scripts, other agent runtimes, CI jobs)
      currently read data.metadata.step or data.semantic_complete from the sdlc CLI envelopes?
    answer: No external consumers known. Grep of the repo confirms zero in-repo consumers of either flag
      (no tests, no skill instructions, no templates reference them); the only references are the
      engine itself, the codemap, and the deployed bundle build artifact.
    lens: stakeholder
    resolved: true
  - id: DL-002
    question: "For data.metadata.step: sync it with the step machine on every call (option a), or remove
      it and make the envelope's top-level step field the single source of truth (option b)?"
    answer: "Option (b): remove the field entirely. Both the envelope exposure (data.metadata.step) and
      the artifact persistence (metadata.step written at init and finalize) are removed. The
      envelope's top-level step field, recomputed via detectStep on every call, becomes the single
      source of truth for step-machine state. Rationale: zero in-repo consumers (verified by grep),
      and keeping a synced second copy would preserve a drift-prone duplicate of state the envelope
      already carries."
    lens: interface
    resolved: true
  - id: DL-003
    question: What should data.semantic_complete mean after the fix, given it is hardcoded true in every
      standard envelope today?
    answer: "Revalue without renaming: semantic_complete reports true exactly when the artifact status
      is ready-for-review or accepted (statuses reachable only through a successful --finalize
      --confirm-semantic), and false for draft (init, authoring) and rejected (recovery). The value
      is derived from existing artifact state — no new persisted field, no schema change. Any
      post-finalize mutation resets status to draft via markMutated, which correctly voids the
      confirmation. All four authoring stages declare at least one semantic check, so no zero-check
      special case is needed."
    lens: data
    resolved: true
  - id: DL-004
    question: Existing artifact files already carry a stale metadata.step in their YAML. When the engine
      next writes such a file after the removal, what should happen to the legacy field?
    answer: "Leave legacy files as-is: no migration or stripping code. New artifacts never receive
      metadata.step; existing files keep their stale value until manually cleaned. The envelope
      stops exposing the field regardless, so envelope consumers are unaffected; only direct YAML
      readers of old files could still see the stale value, and that is accepted."
    lens: failure
    resolved: true
  - id: DL-005
    question: "Constraint check: envelope's seven frozen top-level fields stay untouched; stage schemas
      set metadata additionalProperties:false. Can the schema step property be removed given legacy
      files keep theirs?"
    answer: "Yes, with a coordinated cleanup: the four stage schemas drop the optional metadata.step
      property definition, AND this change's diff deletes the stale 'step:' line from the 36
      historical artifact files under docs/changes/ (12 change dirs x requirements/design/plan). No
      engine migration logic is added (refining the earlier failure-lens answer: 'leave as-is'
      applies to engine behavior on write, not to this one-time repo cleanup). The envelope's seven
      frozen top-level fields are untouched; the data payload is free-form per stage and may change.
      Rationale for tightening the schema: leaving the property would permit the exact stale-state
      field this change removes, and the cleanup guarantees no file can fail re-validation."
    lens: constraint
    resolved: true
assumptions:
  - type: verified
    text: "No in-repo consumer reads data.metadata.step or data.semantic_complete: a repository-wide
      search finds references only in the engine source, codemap.md, the deployed bundle (a build
      artifact), and this change's own documents."
    source: grep -rn over src/ bin/ test/ docs/ .opencode/skills performed 2026-08-29
  - type: verified
    text: The envelope's top-level step field is recomputed from artifact state via detectStep on every
      standard authoring call, so it is always current.
    source: src/scripts/lib/kinds/authoring.ts, runAuthoringStage envelope assembly (detectStep call)
  - type: verified
    text: Artifact status ready-for-review or accepted is reachable only through --finalize, and
      finalize requires --confirm-semantic when the stage declares semantic checks; all four
      authoring stages declare at least one semantic check.
    source: src/scripts/lib/kinds/authoring.ts finalizeArtifact; grep -c over
      src/stages/*/semantic-checks.yaml (6 to 14 checks each)
  - type: verified
    text: Any post-finalize mutation resets artifact status to draft through markMutated, voiding the
      semantic confirmation.
    source: src/scripts/lib/kinds/authoring.ts markMutated
  - type: verified
    text: The four authoring stage schemas set additionalProperties false on the metadata object and
      declare step as an optional property; 36 historical artifact files under docs/changes/ carry a
      stale metadata.step.
    source: src/stages/*/schema.yaml; grep -rln '^  step:' docs/changes returned 36 files across 12
      change directories
  - type: unverified
    text: No consumer outside this repository reads data.metadata.step or data.semantic_complete.
    source: Stakeholder statement during discovery (DL-001)
    risk: An unknown external script keying on data.metadata.step would see the key disappear; one
      keying on data.semantic_complete would see the value change at init.
    impact: low
    severity: low
functional_requirements:
  - id: FR-001
    description: When the authoring interpreter assembles a standard envelope for an existing artifact,
      the system shall omit the step key from the data.metadata object.
    ac_ids:
      - AC-001
      - AC-002
  - id: FR-002
    description: When an artifact is instantiated from a stage template or finalized, the system shall
      not write a step key into the artifact's metadata object.
    ac_ids:
      - AC-003
      - AC-004
  - id: FR-003
    description: When the authoring interpreter assembles a standard envelope, the system shall report
      data.semantic_complete as true exactly when the artifact metadata status is ready-for-review
      or accepted, and as false when the status is draft or rejected.
    ac_ids:
      - AC-005
      - AC-006
      - AC-007
      - AC-008
  - id: FR-004
    description: When the stage schemas for requirements, design, planning, and implementation are
      validated, the system shall declare no step property inside the metadata object schema.
    ac_ids:
      - AC-009
  - id: FR-005
    description: When this change is applied to the repository, the system shall contain no artifact
      file under docs/changes/ whose metadata object carries a step key.
    ac_ids:
      - AC-010
non_functional_requirements:
  - id: NFR-001
    description: When any authoring envelope is produced after this change, the system shall keep the
      seven frozen top-level envelope fields unchanged in name and shape.
    ac_ids:
      - AC-011
  - id: NFR-002
    description: When the engine writes an artifact file during any authoring mutation, the system shall
      preserve metadata keys it does not manage, performing no legacy-key migration.
    ac_ids:
      - AC-012
acceptance_criteria:
  - id: AC-001
    statement: Given an authoring stage with an existing artifact, When any standard authoring call
      returns its envelope, Then data.metadata contains no step key and the top-level step field
      names the step machine's current step.
    category: happy
    parent_id: FR-001
  - id: AC-002
    statement: Given a consumer inspecting the envelope payload, When it reads data.metadata.step, Then
      the value is undefined rather than a stale step name.
    category: negative
    parent_id: FR-001
  - id: AC-003
    statement: Given a new change created through --request, When the artifact file is written at init,
      Then its metadata object contains no step key.
    category: happy
    parent_id: FR-002
  - id: AC-004
    statement: Given an artifact that passes finalize with --confirm-semantic, When finalize writes the
      artifact, Then the file's metadata contains status ready-for-review and no step key.
    category: edge
    parent_id: FR-002
  - id: AC-005
    statement: Given an artifact whose finalize with --confirm-semantic succeeded, When the next
      standard envelope is returned, Then data.semantic_complete is true.
    category: happy
    parent_id: FR-003
  - id: AC-006
    statement: Given a freshly initialized empty artifact, When the init envelope is returned, Then
      data.semantic_complete is false.
    category: negative
    parent_id: FR-003
  - id: AC-007
    statement: Given an artifact at ready-for-review, When a mutation resets its status to draft, Then
      the next envelope reports data.semantic_complete as false.
    category: edge
    parent_id: FR-003
  - id: AC-008
    statement: Given an artifact whose review was accepted, When the standard envelope is returned, Then
      data.semantic_complete is true while the status remains accepted.
    category: boundary
    parent_id: FR-003
  - id: AC-009
    statement: Given the four authoring stage schemas, When schema validation runs over the stage
      folders, Then no metadata object schema declares a step property.
    category: happy
    parent_id: FR-004
  - id: AC-010
    statement: Given the repository after this change is applied, When a line search for metadata step
      keys runs over docs/changes/, Then zero artifact files contain a step key inside their
      metadata object.
    category: happy
    parent_id: FR-005
  - id: AC-011
    statement: Given the CLI envelope schema with additionalProperties false, When any envelope from
      this change is validated, Then the envelope carries exactly the seven frozen top-level fields.
    category: boundary
    parent_id: NFR-001
  - id: AC-012
    statement: Given a legacy artifact file whose metadata contains a step key, When the engine writes
      the file through a mutation, Then the written file preserves that step key.
    category: edge
    parent_id: NFR-002
out_of_scope:
  - Changing finalize or review semantics, including the --confirm-semantic gate flow.
  - Adding or altering top-level envelope fields; the seven frozen fields stay untouched.
  - Renaming data.semantic_complete.
  - Syncing data.metadata.step with the step machine (option a of the idea document), superseded by
    removal.
  - Engine migration logic that strips legacy metadata.step keys from artifact files on write.
failure_paths:
  - If an unknown external consumer breaks because data.metadata.step disappeared, restore a
    data-level step field fed from the envelope step value with no artifact persistence, then re-run
    the affected review.
  - If the historical-file cleanup corrupts an artifact under docs/changes/, restore that file from
    git history before any review stage runs against it.
risks_and_dependencies:
  - "The unverified assumption that no external consumer reads the two flags carries residual risk:
    an unknown consumer would see data.metadata.step disappear and data.semantic_complete change
    value at init."
  - The one-time cleanup edits 36 historical artifact files under docs/changes/; an editing mistake
    could alter accepted records.
