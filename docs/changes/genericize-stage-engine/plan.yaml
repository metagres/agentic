        operation: delete
      - path: src/scripts/lib/lint-checks.ts
        operation: delete
      - path: src/scripts/lib/pipeline.ts
        operation: delete
      - path: src/scripts/lib/policy-loader.ts
        operation: modify
      - path: src/scripts/lib/schema.ts
        operation: modify
      - path: bin/validate-policies.ts
        operation: modify
      - path: bin/validate-templates.ts
        operation: modify
      - path: test/unit/pipeline.test.ts
        operation: delete
      - path: test/unit/lint-checks.test.ts
        operation: delete
      - path: test/e2e/deploy.test.ts
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: Retired legacy engine files and rewrote validate-policies.ts and
      validate-templates.ts for the stage-folder layout.
    files_changed: []
  - id: TASK-012
    title: Extend Deploy Bundler for stage folders
    description: |-
      Extend bin/deploy-to-agent.ts (CMP-010, API-006): copy src/stages/ into the skill bundle
      alongside the engine-owned schemas and policies, and compile any stage hooks modules to
      JavaScript so the bundle contains no source TypeScript files. The bundle remains exactly
      one self-contained skill folder with one SKILL.md, no package.json, and no node_modules.
      Render the SKILL.md workflow list from the discovered stages at deploy time. The
      deployment smoke test verifies stage discovery inside the bundle by running
      --list-workflows there. Extend test/e2e/deploy.test.ts in the same task with stages/
      expectations (every stage folder bundled, no .ts files inside the bundle) so the suite
      stays green at this boundary.
    type: implementation
    status: done
    complexity: medium
    covers:
      - NFR-002
    acceptance_ids:
      - AC-017
    design_refs:
      - DEC-015
    depends_on:
      - TASK-011
    files:
      - path: bin/deploy-to-agent.ts
        operation: modify
      - path: test/e2e/deploy.test.ts
        operation: modify
    started_at: 2026-08-24
    completed_at: 2026-08-24
    implementation_note: Extended the deploy bundler to copy stage folders and compile hooks to
