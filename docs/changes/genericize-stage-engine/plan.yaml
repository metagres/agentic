  - id: TASK-014
    title: Rewrite AGENTS.md for the stage-folder layout
    description: |-
      Rewrite AGENTS.md (DEC-013) to describe the stage-folder layout: the per-stage file set,
      the four kinds, the requires DAG, the acceptance gate, the capped check catalog and its
      design-review extension path, and the updated Where to Find Details table (stage folders
      replace pipeline.yaml and ids.yaml references; errors.yaml remains the central error
      catalog). Document that the package.json validation script entry points are unchanged
      because the bins keep their paths.
    type: documentation
    status: done
