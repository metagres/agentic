risks:
  - risk: The generic flag loop in the authoring interpreter must reproduce current behavior exactly for
      all three authoring stages; subtle drift breaks existing e2e tests.
    severity: medium
    mitigation: Port the runner.ts flag loop as-is and keep the e2e tests as the behavioral contract.
      Because the stage folders exist before the switchover (TASK-005), the full suite runs green
      against the new engine immediately at the TASK-008 boundary, and npm run validate (which
      includes unit and e2e tests) must pass at every task boundary.
  - risk: The eleven-check catalog may not cover a current check exactly (for example the orphan-AC
      referenced-by semantics or the forbidden-words word lists).
    severity: medium
    mitigation: TASK-004 ports each check with the current unit-test contracts (ported from
      test/unit/lint-checks.test.ts into test/unit/stage-checks.test.ts) while the legacy
      implementation still runs, so any behavioral difference surfaces as a test failure before the
      runtime switchover.
  - risk: Deleting the legacy files (central registries, per-stage schemas and templates, validators,
      lint-checks, pipeline) may break bins or tests that still reference them.
    severity: medium
    mitigation: TASK-011 deletes only after every consumer is rewired (TASK-006 through TASK-010), greps
      for remaining references first, and rewrites bin/validate-policies.ts,
      bin/validate-templates.ts, and the deploy.test.ts bundle expectations in the same task, so npm
      run validate stays green across the deletion.
  - risk: The migration window between TASK-005 and TASK-011 keeps two copies of stage configuration
      (stage folders and central files); editing either side creates drift.
    severity: low
    mitigation: The folder copies are verbatim extractions, the window spans tasks within a single
      change, and TASK-011 deletes the central copies so no dual source of truth survives the
      change.
  - risk: The deploy bundler must compile stage hooks modules to JavaScript; a missed compile step
      leaves source TypeScript in the bundle, violating the build-artifact invariant.
    severity: medium
    mitigation: "TASK-012 adds a bundle assertion to the deploy smoke test: no .ts files, no
      package.json, no node_modules, exactly one SKILL.md."
