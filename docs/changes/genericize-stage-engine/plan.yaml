    files_changed: []
  - id: TASK-013
    title: Make the test suite registry-driven
    description: |-
      Update the test suite so adding a stage folder leaves the full validate suite passing
      with zero TypeScript edits (NFR-001, AC-016). Add an e2e test that creates a fixture
      stage folder of an existing kind in a temporary stages location and verifies discovery,
      validation, and --list-workflows without TypeScript changes. Replace remaining hardcoded
      stage/schema/policy enumerations in tests (for example the stage list asserted in
      test/e2e/registry.test.ts and the bundle-content lists in test/e2e/deploy.test.ts) with
      expectations derived from the stage registry or the stages directory.
    type: test
    status: done
    complexity: medium
    covers:
      - NFR-001
    acceptance_ids:
      - AC-016
    design_refs:
      - DEC-004
      - DEC-016
    depends_on:
      - TASK-012
    files:
      - path: test/e2e/new-stage-folder.test.ts
        operation: create
      - path: test/e2e/registry.test.ts
        operation: modify
      - path: test/e2e/deploy.test.ts
        operation: modify
