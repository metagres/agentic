  - id: TASK-005
    title: Rewrite the agentic-sdlc skill body
    description: >
      Rewrite src/skills/agentic-sdlc/SKILL.md as one coherent editing pass. Frontmatter describes
      identification only (creation is a separate explicit step; no hardcoded stage enumeration —
      the CLI owns stage detection). Identification section: orchestrator-exclusive slug derivation
      per the validateChangeSlug rules, collision presents the existing change and asks
      new-vs-resume (never auto-suffix), multiple matches present candidates and ask, short
      imperative input is a request seed, one change per run; new change runs sdlc init --change
      <slug> then the immediate heartbeat. Fixed delegation template: data.suggested_command
      verbatim, the CLI path rule (resolve scripts/sdlc.js relative to the skill base directory,
      invoke from project root, never cd into the skill folder), the change name, and the one-line
      task statement; payload exceptions only for the collected request text (first delegation) and
      semantic-check names verbatim (review rounds). Delegation rule: data.agent set means delegate
      the stage to that agent, else a generic subsession, else stop as an SDLC error — the inline
      carve-out is deleted; reviewer-authorship conflict grounding reworded skill-only (stop and
      surface; no author field anywhere). Loop: state values enumerated (in_progress | blocked |
      complete) with an unknown-value default (follow the top-level instructions field, else stop
      and report); CLI-failure rule (non-zero exit means blocked envelope, unparseable or empty
      output means report raw and stop, never guess); heartbeat-first retry after a dead subagent;
      authoring guard at a review-round rejection with data.round at 3 — stop and escalate (grounded
      on the existing review envelope field, no CLI change, DEC-002); completion report shape
      (change name, stages with review verdicts, artifacts, knowledge-extraction outputs, suggested
      next actions). The stage-detection rule moves into the loop preamble and the artifact-rule and
      payload stdin/.tmp/sdlc temp-file hygiene rules move into loop step 7; the trailing rule
      paragraphs disappear. The skill states only in-progress changes are selectable and completed
      ones are archived (pipeline_state). One concrete path example and one 6-8 line worked example
      per DEC-009. changes, init, and status are explained inline at their points of use; other
      lookups go to --list-commands; the trailing Commands token line is dropped. The three
      deploy-smoke marker phrases survive verbatim (DEC-006).
    type: implementation
    status: done
