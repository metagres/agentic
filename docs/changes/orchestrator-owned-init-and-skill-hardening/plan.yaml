  - id: TASK-006
    title: Rework the improvement-review kickoff to init plus engagement
    description: >
      In src/skills/improvement-review/SKILL.md replace the requirements --request kickoff with the
      two-command form — sdlc init --change <judged-slug> then sdlc requirements --change
      <judged-slug> — and state that init is change management, not a stage: the acting skill agent
      runs it after the slug is judged and confirmed, then engages the requirements stage. A
      colliding slug adjudicates as resume-or-supersede against the existing change instead of
      creating a suffixed variant. (The workflows word rewording in this file lands in TASK-001.)
