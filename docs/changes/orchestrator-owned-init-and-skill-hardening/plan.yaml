      after validate:templates; it extracts sdlc invocation contexts (command token bare sdlc or a
      path ending in /sdlc.js|/sdlc.ts, bounded by the enclosing line or code span, read as an
      invocation when the next token is a flag or a command-shaped id inside a code span/fenced
      block — prose runs skipped, no exemption list) and verifies command ids against
      listCommands()+aliases and flags against the help.ts table union plus
      --list-commands/--help/--cwd; green against the rewritten SKILL.md files and probe-verified to
