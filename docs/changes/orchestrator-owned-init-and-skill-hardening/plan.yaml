      command in commands/index.ts, added INIT_FLAGS (change required) to help.ts, and created
      test/unit/init-command.test.ts (8 tests: happy path, docs/changes bootstrap,
      INVALID_CHANGE_SLUG x3, CHANGE_DIR_EXISTS untouched/no-suffix, --request UNKNOWN_FLAG, no
