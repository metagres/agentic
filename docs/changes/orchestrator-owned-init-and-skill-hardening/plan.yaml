  - id: TASK-002
    title: Add the init command (mkdir-only change creation)
    description: >
      New src/scripts/commands/init.ts registered in src/scripts/commands/index.ts as a
      cross-cutting command (agent null) with an INIT_FLAGS table (change required) in
      src/scripts/lib/help.ts. sdlc init --change <slug> validates the slug with the existing
      validateChangeSlug (INVALID_CHANGE_SLUG, no directory created), refuses an existing
      docs/changes/<slug> through the ChangeSlugError machinery (CHANGE_DIR_EXISTS, directory
      untouched, no suffixed variant), then creates only the change directory (creating docs/changes
      itself when absent) and returns state ok with data.change_name and instructions pointing to
      the status heartbeat. No --request flag is declared (UNKNOWN_FLAG by the closed-vocabulary
      guard), no request.md, no artifact seeding, no creation gate, no stage engagement; init
      deliberately does not reuse createChangeDir, which instantiates artifacts (reuse evaluated and
      rejected per DEC-005; validateChangeSlug and the ChangeSlugError codes are reused verbatim).
      Unit tests cover the happy path, INVALID_CHANGE_SLUG, CHANGE_DIR_EXISTS, the --request
      UNKNOWN_FLAG probe, and that the created directory contains no request.md.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-001
      - FR-002
      - FR-004
    acceptance_ids:
      - AC-001
      - AC-002
