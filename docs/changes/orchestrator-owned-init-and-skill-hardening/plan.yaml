risks:
  - id: RISK-001
    description: Line numbers cited in the requirements ledger (authoring.ts creation branches and
      fallbacks, deploy-to-agent.ts token block) may drift before implementation.
    mitigation: TASK-004 and TASK-007 locate removal targets by structure and behavior, not by line
      number; the TypeScript build and suite catch dangling references (FP-012).
  - id: RISK-002
    description: slugify or uniqueSlug may retain callers outside createChangeDir after the branch removal.
    mitigation: TASK-004 greps callers before each deletion and removes only verified-orphaned exports;
      validateChangeSlug is kept for init (D-001).
  - id: RISK-003
    description: decisions.md rows are generated by the decisions provider from accepted design
      artifacts and historical rows contain the workflows naming, so the AC-055 docs/current grep
      could trip on immutable history.
    mitigation: TASK-009 updates the four live-naming docs directly and regenerates decisions.md via
      docs:generate; historical decision records are not rewritten — if the AC-055 grep trips on
      them, the deviation is surfaced at implementation-review as historical-record scope rather
      than silently edited.
  - id: RISK-004
    description: The skill rewording could drop a deploy-smoke marker phrase ('delegate the stage to
      that agent', 'only via the sdlc CLI', the identification-rule phrase).
    mitigation: TASK-005 preserves the three phrases verbatim per DEC-006; TASK-007 keeps the marker
      constants untouched and TASK-010 runs deploy:smoke to prove it (FP-013).
  - id: RISK-005
    description: The orchestration-economy draft (requirements stage, 2026-09-07) overlaps this change's
      loop-closure intent.
    mitigation: DEC-008 records the relationship only; no artifact of that change is edited in this run
      — supersede or adjust in a later session (FP-014).
  - id: RISK-006
    description: The validator's green-on-arrival depends on invocation-context scoping; over-broad
      extraction would red-flag the improvement-review helper scripts' own --verbose flags.
    mitigation: TASK-008 implements exactly the DEC-004 scope (sdlc/sdlc.js/sdlc.ts command tokens,
      line-or-code-span extent, command-shaped-or-flag lookahead, no exemption list) and
      test/unit/skill-envelope-refs.test.ts pins the envelope-field assertions.
