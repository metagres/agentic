  - id: TASK-008
    title: Add the skill-reference validator and envelope-field unit tests
    description: >
      New bin/validate-skill-refs.ts following the bin/validate-agents-md.ts pattern (standalone bin
      script, JSON findings, non-zero exit), wired into package.json as validate:skill-refs inside
      the npm run validate chain after validate:templates. It extracts command and flag references
      only from sdlc CLI invocation contexts in every src/skills/*/SKILL.md — token runs whose
      command token is bare sdlc or a path ending in /sdlc.js or /sdlc.ts, extending to the end of
      the enclosing line or code span, read as an invocation when the token after the command token
      is a command-shaped id or a flag; prose runs are skipped — and verifies command ids against
      listCommands() plus the aliases map and every --<flag> token against the union of the help.ts
      flag tables plus the top-level --list-commands, --help, --cwd; bare --<flag> tokens outside
      sdlc invocation contexts are out of scope by construction, with no exemption list (this scope
      is what keeps the gate green on arrival despite the improvement-review helper scripts' own
      --verbose flags). A miss fails the run naming the file and the offending reference.
      test/unit/skill-envelope-refs.test.ts asserts the skill's state vocabulary round-trips through
      normalizeEnvelope and data.stage and data.semantic_checks against the status and review
      emitting code. The stage-check catalog is not extended — this is a repo gate recorded as a
      design-review event.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-017
    acceptance_ids:
