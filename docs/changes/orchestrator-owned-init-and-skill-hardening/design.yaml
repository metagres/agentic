metadata:
  id: DES-001
  title: "Design: orchestrator-owned-init-and-skill-hardening"
  stage: design
  status: accepted
  version: 0.1.1
  created: 2026-09-10
  updated: 2026-09-10
  delta_reviewed: false
context_summary: "Change creation moves out of the stage commands into a dedicated
  orchestrator-owned init command: sdlc init --change <slug> creates only docs/changes/<slug>,
  validates the slug with the existing validateChangeSlug, refuses duplicates through the existing
  ChangeSlugError machinery, and returns state ok with data.change_name and heartbeat-pointing
  instructions — no request.md, no artifact seeding, no stage engagement. Every stage command loses
  --request entirely: the two creation branches and the args.request fallbacks in authoring.ts are
  deleted, the request flag leaves help.ts, the dead createChangeDir helper and the then-orphaned
  slugify/uniqueSlug exports are removed after a caller check, and stage invocations require
  --change resolving to an existing change. The changes inventory gains a per-entry pipeline_state
  field (in_progress | complete) so the skill can present only in-progress changes as selectable and
  completed ones as archived. src/scripts/workflows/ is renamed in full to src/scripts/commands/
  with WorkflowDef becoming CommandDef, and every reference (sdlc.ts import, tests, skill text, docs
  rows) follows. The agentic-sdlc SKILL.md is rewritten around orchestrator-exclusive identification
  and init, a fixed delegation template with strict context hygiene, no inline stage execution
  (bound agent, else generic subsession, else SDLC error stop), a three-run authoring guard grounded
  on the review envelope's existing data.round, enumerated state values with an unknown-value
  default, CLI-failure handling, and a completion report shape — preserving the two deploy-smoke
  marker phrases verbatim and dropping the trailing Commands token line. The deploy machinery loses
  the COMMANDS_TOKEN requirement while keeping the three marker checks. A new repo-level validator
  wired into npm run validate verifies every command and flag reference in src/skills/*/SKILL.md
  against listCommands() and the help.ts flag catalog, with envelope-field assertions as unit tests.
  The improvement-review kickoff switches to init plus requirements engagement, and docs/current
  rows are updated in the same change."
components:
  - id: CMP-001
    name: Init command
    responsibility: New src/scripts/commands/init.ts (after the rename) registered in
      src/scripts/commands/index.ts with an INIT_FLAGS table in src/scripts/lib/help.ts. sdlc init
      --change <slug> validates the slug via validateChangeSlug (INVALID_CHANGE_SLUG on violation),
      refuses an existing docs/changes/<slug> via the ChangeSlugError machinery (CHANGE_DIR_EXISTS,
      no suffixed variant), then mkdirs only the change directory (creating docs/changes itself when
      absent) and returns state ok with data.change_name set to the slug and instructions pointing
      to the status heartbeat. No --request flag is declared (UNKNOWN_FLAG per the closed-vocabulary
      guard), no request.md, no artifact seeding, no creation gate, no stage engagement — init
      deliberately does NOT reuse createChangeDir, which instantiates artifacts.
    satisfies:
      - FR-001
      - FR-002
  - id: CMP-002
    name: Request-flag removal and dead-code cleanup
    responsibility: Remove --request from every stage command with no fallback and no seeding variant —
      delete the --request-only creation branch (authoring.ts ~947) and the --change+--request
      explicit-slug creation branch (~874), strip the args.request fallbacks in the
      instantiateArtifact call sites (authoring.ts 239, 376, 964) so titles and summaries derive
      from the change directory name, drop the request entry from AUTHORING_FLAGS in help.ts, reword
      the engagement-backstop and ensureArtifact messages and the CHANGE_DIR_NOT_FOUND fix text in
      src/policies/errors.yaml to point at sdlc init instead of --request, and update the changes
      empty-inventory instruction likewise, and reword the AUTHORING_FLAGS.change description
      (help.ts 103) to 'Work on an existing change (fuzzy name resolution).' — the 'With --request
      and no match, creates the change under the exact slug.' sentence is deleted with the flag —
      and reword the stale --change+--request comment above validateChangeSlug (ids.ts 84-87) to the
      init contract (the exact slug must already be a valid, unique name). Dead-code disposition,
      grep-verified — with both branches deleted, createChangeDir (authoring.ts 163-219) has no
      remaining caller and is removed with them; its removal orphans slugify and uniqueSlug, whose
      sole caller was the uniqueSlug(slugify(request), existing) line inside createChangeDir
      (authoring.ts 203) — the caller grep finds no other reference in src/ — so both exports are
      removed from src/scripts/lib/ids.ts; validateChangeSlug stays (init reuses it). Rework tests —
      explicit-slug-creation cases (INVALID_CHANGE_SLUG, CHANGE_DIR_EXISTS, exact-slug creation)
      migrate to the init command tests; the creation-gate re-rooting cases rework from direct
      createChangeDir calls onto the surviving gated first-creation paths (ensureArtifact and the
      runAuthoringStage lazy-instantiation block), keeping the CreationBlockedError and re-rooting
      assertions; slug-and-batch loses its slugify block with the export and keeps its batch tests,
      ids.test.ts loses its slugify case, and the slug-and-batch and e2e/unit setup invocations
      switch from requirements --request to init plus requirements --change.
    satisfies:
      - FR-003
      - NFR-001
  - id: CMP-003
    name: Changes inventory pipeline_state
    responsibility: Extend each data.changes[] entry in src/scripts/commands/changes.ts with
      pipeline_state (in_progress | complete), derived from the existing unsettled-stage computation
      (unsettled found → in_progress, else complete); the entry shape becomes change_name, stage,
      agent, suggested_command, open_feedback, pipeline_state. The zero-changes envelope stays a
      non-error empty inventory; the stage field keeps naming the stage to run now (or complete) so
      pipeline_state names only the selection state.
    satisfies:
      - FR-005
  - id: CMP-004
    name: Commands folder rename
    responsibility: Rename src/scripts/workflows/ to src/scripts/commands/ in full — the folder,
      WorkflowDef → CommandDef in src/scripts/lib/types.ts, the sdlc.ts import,
      test/e2e/workflows.test.ts renamed to test/e2e/commands.test.ts, refs in
      test/unit/help-contract.test.ts and test/unit/list-commands.test.ts, the workflows word in
      src/skills/improvement-review/SKILL.md, and the docs/current rows in architecture.md,
      api-contract.md, capabilities.md, and glossary.md that cite src/scripts/workflows paths. No
      behavior change; the naming disappears wherever it meant commands (one term, one meaning).
    satisfies:
      - FR-018
  - id: CMP-005
    name: Deploy token removal
    responsibility: In bin/deploy-to-agent.ts remove the COMMANDS_TOKEN constant (~181), the
      source-must-contain-token check and the replaceAll interpolation in renderAgenticSdlcSkill
      (~183-208), and the stale comment describing the token as the only deploy-time interpolation;
      renderAgenticSdlcSkill reduces to read and return. The three marker checks
      (DELEGATION_RULE_MARKER, ARTIFACT_RULE_MARKER, IDENTIFICATION_RULE_MARKER) and the uniform
      frontmatter smoke stay untouched, so npm run deploy:smoke keeps gating the marker phrases.
    satisfies:
      - FR-019
      - NFR-002
  - id: CMP-006
    name: Agentic-sdlc skill rewrite
    responsibility: Rewrite src/skills/agentic-sdlc/SKILL.md. Frontmatter describes identification only
      (creation is a separate explicit step; no stage enumeration — the CLI owns stage detection).
      Identification section — orchestrator-exclusive slug derivation per validateChangeSlug rules,
      collision → present the existing change and ask new-vs-resume (never auto-suffix), multiple
      matches → present candidates and ask, short imperative input → request seed, one change per
      run; new change → sdlc init --change <slug> → immediate heartbeat. Fixed delegation template —
      data.suggested_command verbatim + CLI path rule (resolve scripts/sdlc.js relative to the skill
      base directory, invoke from project root, never cd into the skill folder) + change name +
      one-line task statement (run the command, follow your envelope instructions, report one line
      of outcome); payload exceptions only for the collected request text (first delegation) and
      semantic-check names verbatim (review rounds). Delegation rule — delegate the stage to that
      agent when data.agent is set, else a generic subsession, else stop as an SDLC error; the
      inline carve-out is deleted; reviewer-authorship conflict grounding reworded skill-only (stop
      and surface; no author field anywhere). Loop — state values enumerated (in_progress | blocked
      | complete) with unknown-value default (follow the top-level instructions field, else stop and
      report); CLI-failure rule (non-zero exit → blocked envelope, unparseable/empty → report raw
      and stop, never guess); heartbeat-first retry after a dead subagent; authoring guard — at a
      review-round rejection with data.round at 3, stop and escalate; completion report shape
      (change name, stages with review verdicts, artifacts, knowledge-extraction outputs, suggested
      next actions). Loop step 7 absorbs the artifacts-only-via-CLI rule (marker phrase preserved
      verbatim) and the payload stdin/.tmp/sdlc temp-file hygiene; the stage-detection rule moves
      into the loop preamble; the trailing rule paragraphs and the Commands token line disappear —
      changes, init, and status are explained inline at their points of use, other lookups go to
      --list-commands. One concrete path example and one 6-8 line worked example included. The
      deploy-smoke marker phrase 'delegate the stage to that agent' survives verbatim.
    satisfies:
      - FR-002
      - FR-004
      - FR-006
      - FR-007
      - FR-008
      - FR-009
      - FR-010
      - FR-011
      - FR-012
      - FR-013
      - FR-014
      - FR-015
      - FR-016
      - FR-020
      - FR-021
      - FR-022
      - FR-023
      - NFR-003
  - id: CMP-007
    name: Skill-reference validator
    responsibility: New bin/validate-skill-refs.ts (bin/validate-agents-md.ts pattern) wired into
      package.json as validate:skill-refs inside the npm run validate chain. It extracts command and
      flag references from sdlc CLI invocation contexts in every src/skills/*/SKILL.md — token runs
      whose command token is bare sdlc or a path ending in /sdlc.js or /sdlc.ts, extending to the
      end of the enclosing line or code span, read as an invocation when the token after the command
      token is a command-shaped id or a flag (prose runs like sdlc ... are skipped) — and verifies
      each against the live registries — command ids against listCommands() plus the aliases map,
      flags against the union of the help.ts flag tables plus the top-level flags (--list-commands,
      --help, --cwd); bare --<flag> tokens outside sdlc invocation contexts — the improvement-review
      helper scripts' own --verbose flags — are out of scope by construction; a miss fails the run
      naming the file and the offending reference. Envelope-field assertions live as unit tests in
      test/unit/skill-envelope-refs.test.ts — the state vocabulary enumerated by the skill
      round-trips through normalizeEnvelope, and data.stage (status.ts) and data.semantic_checks
      (review.ts) are asserted against the emitting code. The stage-check catalog is not extended;
      this is a repo gate, recorded as a design-review event.
    satisfies:
      - FR-017
  - id: CMP-008
    name: Improvement-review kickoff rework
    responsibility: In src/skills/improvement-review/SKILL.md replace the kickoff command (sdlc
      requirements --change <judged-slug> --request "...") with the two-command form — sdlc init
      --change <judged-slug> then sdlc requirements --change <judged-slug> — and state that init is
      change management, not a stage — the acting skill agent runs it after the slug is judged and
      confirmed, then engages the requirements stage; a colliding slug adjudicates as
      resume-or-supersede against the existing change instead of creating a suffixed variant. The
      workflows word in the removal-candidate paragraph is reworded to commands.
    satisfies:
      - FR-024
data_models:
  - id: DM-001
    name: Init envelope contract
    fields:
      state: ok on creation; blocked on INVALID_CHANGE_SLUG or CHANGE_DIR_EXISTS (usage exit).
      data.change_name: the exact slug the directory was created under.
      instructions: points to the heartbeat — run sdlc status --change <slug> and follow the envelope.
      errors: INVALID_CHANGE_SLUG (slug violates validateChangeSlug; no directory created),
        CHANGE_DIR_EXISTS (duplicate refusal; directory untouched, no suffix), UNKNOWN_FLAG (any
        undeclared flag, including --request).
  - id: DM-002
    name: Changes entry shape v2
    fields:
      change_name: directory name; the --change value.
      stage: first unsettled stage to run now, or complete when settled (unchanged semantics).
      agent: bound agent of that stage, null when unbound or complete (unchanged).
      suggested_command: sdlc <stage> --change <name>, null when complete (unchanged).
      open_feedback: open feedback entry id or null (unchanged).
      pipeline_state: in_progress | complete — the selection state; only in_progress changes are
        selectable, completed ones are archived.
  - id: DM-003
    name: Review round grounding for the loop guard
    fields:
      data.round: round number already exposed on every recorded review envelope (review.ts writes
        recordedRound); increments only when a verdict closes a round and a new one opens.
      data.status: open | accepted | rejected round status on the same envelope.
      guard_rule: at a rejected review round, the authoring run count equals data.round; round >= 3 means
        initial run plus two rework rounds — stop and escalate, delegate no fourth run.
  - id: DM-004
    name: INIT_FLAGS flag table
    fields:
      change: required, '<change-name>' — the exact slug to create (no fuzzy resolution; creation is
        explicit).
      inherited: --cwd added by helpEnvelope; --help handled by usage; nothing else — the closed
        vocabulary makes --request an UNKNOWN_FLAG by construction.
apis:
  - id: API-001
    path: sdlc init --change <slug>
    method: CLI command
    notes: New cross-cutting command in src/scripts/commands/init.ts (agent null — the invoking
      orchestrator runs it). mkdir-only creation under docs/changes/<slug>; validates via
      validateChangeSlug; refuses duplicates via ChangeSlugError (INVALID_CHANGE_SLUG /
      CHANGE_DIR_EXISTS); envelope state ok with data.change_name and heartbeat-pointing
      instructions; no request.md, no artifact seeding, no stage engagement, no creation gate.
  - id: API-002
    path: sdlc changes
    method: CLI command
    notes: Output modified only by the added per-entry pipeline_state (in_progress | complete) on
      data.changes[]; zero changes stays a non-error empty inventory; the empty-inventory
      instruction now points at sdlc init --change <slug>.
  - id: API-003
    path: sdlc <stage-id> --change <change-name> [kind flags]
    method: CLI command
    notes: Contract tightened — --change is required and must resolve to an existing change
      (MISSING_CHANGE_DIR / CHANGE_DIR_NOT_FOUND / AMBIGUOUS_CHANGE_DIR unchanged in code, fix texts
      reworded to init); --request is removed from AUTHORING_FLAGS and every usage/help string —
      passing it exits UNKNOWN_FLAG; the AUTHORING_FLAGS.change description (help.ts 103) is
      rewritten to 'Work on an existing change (fuzzy name resolution).' — the dangling 'With
      --request and no match, creates the change under the exact slug.' sentence is deleted with the
      flag; the stale --change+--request comment above validateChangeSlug (ids.ts 84-87) is reworded
      to the init contract; artifact instantiation derives title and request_summary from the change
      directory name; ensure-artifact-on-existing-change (creation gate) behavior preserved for
      pre-existing changes.
  - id: API-004
    path: bin/validate-skill-refs.ts (npm run validate:skill-refs)
    method: repo gate
    notes: Validator over src/skills/*/SKILL.md — command ids and flags are extracted only from sdlc CLI
      invocation contexts (command token bare sdlc or a path ending in /sdlc.js or /sdlc.ts, to the
      end of the enclosing line or code span; prose runs skipped) and checked against listCommands()
      plus aliases and the union of the help.ts flag tables plus --list-commands, --help, --cwd;
      bare --<flag> tokens outside sdlc contexts — the improvement-review helper scripts' --verbose
      — are out of scope by construction, so the gate is green on arrival; failure names file and
      reference; envelope-field assertions live in test/unit/skill-envelope-refs.test.ts.
flows:
  - id: F-1
    name: New change from user request (orchestrator-owned)
    steps:
      - Orchestrator collects the request text; short imperative input is treated as a request seed.
      - Orchestrator derives a kebab-case slug per validateChangeSlug rules and checks it against
        sdlc changes; a collision presents the existing change and asks new-vs-resume (never
        auto-suffix); multiple plausible matches present candidates and ask.
      - On confirmed-new, orchestrator runs sdlc init --change <slug>; the envelope returns state ok
        with data.change_name.
      - Orchestrator runs the heartbeat (sdlc status --change <slug>), reads data.stage,
        data.suggested_command, and data.agent, and delegates requirements with the fixed template
        plus the collected request text as the only payload exception.
      - No request.md exists at any point; a session lost before the first delegation re-collects
        the request text from the user.
    outcome: FR-001, FR-002, FR-004, FR-015, FR-020; failure paths FP-001, FP-002, FP-009 covered by the
      init refusals and the re-collection tradeoff.
    requirement_ids:
      - FR-001
      - FR-002
      - FR-004
      - FR-015
      - FR-020
  - id: F-2
    name: Stage engagement after --request removal
    steps:
      - Stage invoked with --change resolving to an existing change → normal flow, artifact ensured
        on the existing change (creation gate preserved).
      - Stage invoked without --change, or with a name resolving to nothing → usage-error blocked
        envelope (MISSING_CHANGE_DIR / CHANGE_DIR_NOT_FOUND), no directory and no artifact created,
        fix text points at sdlc init.
      - Stage invoked with --request → UNKNOWN_FLAG before any effect; --help lists no request flag.
    outcome: FR-003 and NFR-001; failure path FP-003 covered; pre-change behavior byte-identical for
      existing changes.
    requirement_ids:
      - FR-003
      - NFR-001
  - id: F-3
    name: Delegation and verification
    steps:
      - Orchestrator composes the delegation payload — suggested command verbatim, CLI path rule,
        change name, one-line task statement (run the command, follow your envelope instructions,
        report one line of outcome); exceptions only for request text (first delegation) and
        semantic-check names verbatim (review rounds).
      - data.agent set → delegate the stage to that agent; agent missing → generic subsession (still
        envelope- and permission-bound); no delegation mechanism at all → stop, report the SDLC
        error, never run inline.
      - Subagent finishes (or dies) → orchestrator runs the heartbeat and acts on the CLI state
        only; report claims, stage envelopes, and stage artifacts are never verification input.
    outcome: FR-006, FR-007, FR-010, FR-023; failure paths FP-007 and FP-010 covered.
    requirement_ids:
      - FR-006
      - FR-007
      - FR-010
      - FR-023
  - id: F-4
    name: Review round with the authoring guard
    steps:
      - Review round rejects → envelope state blocked with data.round and data.status visible.
      - data.round < 3 → orchestrator delegates one rework round to the authoring stage agent.
      - data.round >= 3 → orchestrator stops and escalates to the user; no fourth authoring run.
      - No review rejection → no cycle cap exists; the loop runs without pausing.
    outcome: FR-008 and NFR-003; failure path FP-008 covered by the existing data.round field — no CLI
      addition needed.
    requirement_ids:
      - FR-008
      - NFR-003
  - id: F-5
    name: CLI failure and state handling
    steps:
      - Non-zero exit with a parseable envelope → treat as blocked and follow its instructions.
      - Unparseable or empty output → report the raw output and stop; never guess a stage.
      - State value outside in_progress | blocked | complete → follow the top-level instructions
        field; absent → stop and report.
      - state complete → emit the completion report (change name, stages with review verdicts,
        artifacts, knowledge-extraction outputs, suggested next actions) and stop.
    outcome: FR-009 and FR-011; failure paths FP-004, FP-005, FP-006 covered.
    requirement_ids:
      - FR-009
      - FR-011
  - id: F-6
    name: Skill-reference drift gate
    steps:
      - npm run validate runs validate:skill-refs after the policy and template gates.
      - Every sdlc invocation's command id and flags in src/skills/*/SKILL.md resolve against
        listCommands() plus aliases and the flag-table union (bare --<flag> tokens outside sdlc
        invocation contexts are out of scope by construction); a miss fails the run naming the file
        and reference.
      - Unit tests assert the skill's state vocabulary against normalizeEnvelope and the data.stage
        / data.semantic_checks fields against the emitting code.
    outcome: FR-017; AC-052 and AC-053 negative and edge behavior covered; stage-check catalog untouched.
    requirement_ids:
      - FR-017
decisions:
  - id: DEC-001
    title: Per-entry pipeline_state over split lists for the changes inventory
    context: FR-005 leaves the shape open — a per-entry field or separated selectable/archived lists.
      The changes envelope already carries one homogeneous data.changes[] list consumed by the skill
      identification flow, the help-contract tests, and the glossary row; splitting would introduce
      a second collection, a second shape to keep in sync, and a bigger envelope diff.
    decision: Add pipeline_state (in_progress | complete) to each data.changes[] entry and keep the
      single list; the skill filters for selectability in its identification text (FR-021) and
      presents completed entries as archived.
    status: accepted
  - id: DEC-002
    title: Loop guard grounded on the existing data.round field
    context: FR-008 needs a CLI-visible authoring run count at review-round rejections; the requirements
      flagged as unverified whether the review envelope exposes one.
    decision: Verified — review.ts already writes data.round (the recorded round number) and data.status
      on every recorded review envelope, and round numbers increment exactly when a verdict closes a
      round, so data.round at a rejection equals the authoring run count. No CLI change; the skill
      reads the guard from the envelope it already receives.
    status: accepted
  - id: DEC-003
    title: Keep the '--request' prompt-purity marker
    context: With --request removed from the CLI, the '--request' entry in PROMPT_MARKERS
      (agent-prompt-marker.ts) could be seen as dead vocabulary; the alternative is deleting it.
    decision: Keep it. The marker list guards agent system prompts against CLI machinery vocabulary, not
      against the current flag set — a prompt mentioning a removed flag is still machinery leak and
      the marker catches stale prompts at zero cost. No validate-policies change.
    status: accepted
  - id: DEC-004
    title: Validator placement and reference-extraction mechanism
    context: FR-017 requires a repo-level gate but leaves placement and extraction open. SKILL.md bodies
      are prose, so extraction must be deterministic and cheap, and the reference universe must come
      from the same modules the CLI uses so the gate cannot itself drift.
    decision: Place the gate at bin/validate-skill-refs.ts (bin/validate-agents-md.ts pattern —
      standalone bin script, JSON findings, non-zero exit) wired as validate:skill-refs into the npm
      run validate chain after validate:templates. Extraction is scoped to the sdlc CLI surface and
      regex-based — an sdlc invocation context is a token run whose command token is bare sdlc or a
      path ending in /sdlc.js or /sdlc.ts, extending to the end of the enclosing line or code span,
      read as an invocation only when the token after the command token is a command-shaped id or a
      flag (prose runs like sdlc ... and <stage> templates are skipped). Within a context the
      command id is checked against listCommands() ids plus the aliases map and every --<flag> token
      against the union of the help.ts flag tables plus the top-level --list-commands, --help,
      --cwd; bare --<flag> tokens outside sdlc invocation contexts are out of scope by construction
      — no exemption list. This scoping is what keeps the gate green on arrival —
      src/skills/improvement-review/SKILL.md lines 112, 117, 120, and 137 carry --verbose for its
      own bundled helper scripts (measure_artifacts.ts, envelope_sizes.ts, validate_duration.ts,
      mine_transcript.ts), which are not sdlc invocations and whose flags no help.ts table contains;
      FR-017's every command and flag reference reads as every reference to the sdlc CLI surface,
      which the invocation-context scope covers exactly. Envelope-field assertions are unit tests in
      test/unit/skill-envelope-refs.test.ts (state vocabulary round-tripped through
      normalizeEnvelope; data.stage and data.semantic_checks asserted against status.ts / review.ts
      emitting code). Rejected — markdown AST parsing (overkill for token references), bare --<flag>
      extraction over the whole skill body (red on arrival per the helper-script flags above), a
      per-file exemption list for improvement-review (hides real drift behind a carve-out), and
      extending the stage-check catalog (a repo gate is not a stage check).
    status: accepted
  - id: DEC-005
    title: Init command shape and reuse of the slug machinery
    context: The init contract (DL-003) overlaps existing machinery — validateChangeSlug, the
      ChangeSlugError codes, and createChangeDir all exist; reuse or adaptation had to be evaluated.
    decision: New src/scripts/commands/init.ts reuses validateChangeSlug and the ChangeSlugError codes
      and messages verbatim (identical INVALID_CHANGE_SLUG and CHANGE_DIR_EXISTS behavior), but does
      NOT reuse createChangeDir — that function seeds an artifact and evaluates the creation gate,
      both forbidden for init; init is mkdir-only. Registered in commands/index.ts as a
      cross-cutting command (agent null) with a minimal INIT_FLAGS table (change required), so the
      closed-vocabulary guard yields UNKNOWN_FLAG for --request by construction (AC-004).
      createChangeDir itself is removed with the branches (CMP-002) — dead once its two call sites
      (authoring.ts 879, 948) are deleted, and init does not reuse it; the caller check then
      confirms slugify/uniqueSlug orphaned (their sole caller was inside createChangeDir) and both
      exports are removed, while validateChangeSlug stays for init.
    status: accepted
  - id: DEC-006
    title: Deploy-smoke marker phrases preserved verbatim in the rewrite
    context: The SKILL.md rewrite rewords the delegation and artifact rules, but deploy-smoke gates on
      three marker phrases; losing one fails every deploy (FP-013).
    decision: The rewrite preserves 'delegate the stage to that agent', 'only via the sdlc CLI', and the
      identification-rule phrase verbatim in the new text; DELEGATION_RULE_MARKER and the other
      marker constants stay unchanged. Updating a marker constant is explicitly rejected — the
      phrases are still the intended wording.
    status: accepted
  - id: DEC-007
    title: Improvement-review kickoff becomes init plus engagement
    context: The improvement-review skill's kickoff command uses requirements --request, which the
      removal deletes; the idea-to-change flow needs a replacement that respects the
      orchestrator/stage boundary (DL-005).
    decision: The kickoff section prescribes sdlc init --change <judged-slug> followed by sdlc
      requirements --change <judged-slug>, and states init is change management rather than a stage
      — the acting skill agent runs it after the slug is judged and confirmed, then engages
      requirements. A slug colliding with an existing change adjudicates as resume-or-supersede, not
      a suffixed creation.
    status: accepted
  - id: DEC-008
    title: Relationship to the orchestration-economy draft
    context: The orchestration-economy change (draft, requirements stage, 2026-09-07) carries
      loop-closure intent that this change's SKILL.md rewrite subsumes; acting on that change is out
      of scope here.
    decision: Record the relationship only — this change's delegation template and loop guard cover the
