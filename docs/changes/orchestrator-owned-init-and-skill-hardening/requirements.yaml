metadata:
  id: REQ-001
  title: "Orchestrator-owned change initialization and skill hardening: add an init CLI..."
  stage: requirements
  status: accepted
  version: 0.1.1
  created: 2026-09-10
  updated: 2026-09-10
  request_summary: "Orchestrator-owned change initialization and skill hardening: add an init CLI
    command (mkdir-only change creation under an orchestrator-derived slug, no artifact seeding, no
    stage engagement, duplicate refusal); remove --request from all stage commands (stages always
    require an existing change via --change; the collected request text travels in the first
    delegation context instead); split the changes inventory so only in-progress changes are
    selectable with completed ones shown as archived; rename src/scripts/workflows/ to
    src/scripts/commands/ (WorkflowDef becomes CommandDef); rewrite the agentic-sdlc skill body
    (orchestrator-exclusive slug derivation with collision verification against the change list,
    init-based creation, delegation template with strict orchestrator context hygiene, the
    orchestrator never runs a stage inline - bound agent, else generic subsession, else stop as an
    SDLC error; authoring stage runs at most three times detected at review-round rejections; state
    value enumeration with an unknown-value default; CLI-failure handling; completion report shape;
    drop the trailing Commands token line); remove the COMMANDS_TOKEN interpolation from the deploy
    machinery while keeping the three deploy-smoke marker checks; add a repo-level validation gate
    that verifies every command and flag reference in skill bodies against the CLI command registry
    and flag catalog; update docs/current in the same change."
  clarity: clear
  assumptions_reviewed: true
  delta_reviewed: true
  discovery_reviewed: true
problem_statement: "Change creation today happens as a side effect of stage commands: the
  orchestrating agent can create a change through --request, seed artifacts, and even run stages
  inline, so change management is scattered across the orchestrator and the stage agents. Slug
  collisions are silently suffixed instead of verified with the user, and the collected request text
  is persisted as request.md even though no stage consumes it. The changes inventory does not
  distinguish selectable in-progress changes from archived completed ones. The skill body carries
  stale structure — a trailing Commands token line, rule paragraphs sitting outside the loop, an
  inline-execution carve-out — and drifts from the CLI unchecked, because no mechanism verifies that
  commands written in skill bodies still exist. The deploy machinery still requires a Commands token
  that the skill rewrite removes."
discovery_log:
  - id: DL-001
    question: Who owns change identification and initialization, and what does the orchestrator do
      versus the stage runner?
    answer: The orchestrator exclusively owns identification AND initialization of a change (slug
      derivation, init, heartbeat via status). Stage engagement is done only by the stage runner
      (the delegated stage agent); the orchestrator never engages a stage itself and must NEVER run
      a stage inline — not even when the bound agent is missing. The orchestrator never reads stage
      envelopes or stage artifacts, never runs stage commands itself; subagents report one line of
      outcome; verification is via the heartbeat, never via the report's claims. The orchestrator's
      context stays as clean as possible.
    lens: stakeholder
    resolved: true
  - id: DL-002
    question: How does the orchestrator derive a slug for a new change and handle a collision with an
      existing change?
    answer: Slug creation is exclusively the orchestrator's task for a NEW change. Derive a kebab-case
      slug per the CLI's validateChangeSlug rules (lowercase letters/digits/hyphens, starts alnum,
      <=60 chars, no trailing hyphen); check it against the change list; if the derived slug already
      exists, that change may already exist — the user is asked to verify / give more context to
      decide new vs existing. Never silently auto-suffix.
    lens: stakeholder
    resolved: true
  - id: DL-003
    question: What is the exact contract of the new init command?
    answer: "New CLI init command: sdlc init --change <slug> — mkdir the change directory ONLY. NO
      --request flag at all, NO request.md, no artifact seeding, no stage engagement. Validates the
      slug (INVALID_CHANGE_SLUG), refuses duplicates (CHANGE_DIR_EXISTS semantics, no silent
      suffixing). Envelope: state ok, data.change_name, instructions pointing to the heartbeat
      (status)."
    lens: interface
    resolved: true
  - id: DL-004
    question: How should the changes inventory distinguish selectable from archived changes?
    answer: The changes command returns all changes, completed or in progress. It must be made clear
      that the user may choose only among in-progress changes; completed ones are archived. CLI-side
      split (per-entry pipeline_state in_progress|complete, or separated lists — design decides)
      plus skill-text clarity.
    lens: interface
    resolved: true
  - id: DL-005
    question: What happens to --request on stage commands, including the requirements stage?
    answer: --request is FULLY REMOVED from all stage commands — no fallback, no seeding variant (clean,
      easy-to-follow logic, no unnecessary complications). Delete the --request-only creation branch
      (authoring.ts ~line 947) and the --change+--request explicit-slug creation branch (~line 874,
      TASK-001); stage invocations require --change resolving to an existing change; strip
      args.request fallbacks in instantiateArtifact (authoring.ts lines 239, 376, 964); remove the
      request flag from help.ts; inspect the '--request' token in
      src/scripts/lib/agent-prompt-marker.ts (~line 21); rework tests
      (explicit-slug-creation.test.ts cases move to init tests; creation-gate.test.ts keeps
      ensureArtifact-on-existing-change cases; slug-and-batch.test.ts adjusted); slugify/uniqueSlug
      become dead code if orphaned — verify then remove; update the improvement-review skill's
      idea-to-change flow (~line 277) to init + engagement (init is change management, not a stage —
      the acting skill agent may run it after the slug is judged/confirmed); keep validateChangeSlug
      (init uses it). requirements --request is no longer needed at all.
    lens: interface
    resolved: true
  - id: DL-006
    question: Where does the request text collected during identification live, given there is no request.md?
    answer: "The request text collected from the user during identification is passed by the
      orchestrator to the FIRST stage delegation (requirements) as delegation context. The
      requirements stage knows what to do with it. No request.md, no persistence of the request text
      at init time. Accepted tradeoff: a session lost between init and first delegation re-collects
      context from the user on resume."
    lens: data
    resolved: true
  - id: DL-007
    question: What happens to the trailing Commands {{COMMANDS}} line in the skill body?
    answer: Do not keep it as-is. Commands used by the orchestrator (changes, init, status) are
      explained inline at their point of use; other commands are looked up via --list-commands when
      needed. The deploy-time token interpolation goes away.
    lens: data
    resolved: true
  - id: DL-008
    question: How are runaway authoring stages bounded?
    answer: Loop guard — an authoring artifact/stage may run at most 3 times (initial run + two rework
      rounds); detected during review rounds — when a review round rejects and the CLI-visible round
      count shows the cap reached, the orchestrator stops and escalates to the user. The generic
      heartbeat-cycle cap idea was explicitly dropped in favor of this.
    lens: failure
    resolved: true
  - id: DL-009
    question: What is the delegation fallback chain when the bound agent is missing or no delegation
      mechanism exists?
    answer: "Fallback when the bound agent is missing — spawn a generic subsession for that stage (it
      lacks the specialist persona/permissions; the envelope + CLI permissions still bind it). If no
      delegation mechanism exists at all, that is an SDLC error: stop, report to the user, fix
      before proceeding. The current skill's 'unless you are already that agent ... run the stage
      inline yourself' carve-out is removed. NOTE: the deploy-smoke marker phrase 'delegate the
      stage to that agent' must survive the rewording (bin/deploy-to-agent.ts
      DELEGATION_RULE_MARKER), or the constant must be updated deliberately (DEC-006)."
    lens: failure
    resolved: true
  - id: DL-010
    question: How should the orchestrator handle CLI failures, unknown state values, and dead subagents?
    answer: CLI-failure rule — non-zero exit means treat the envelope as blocked and follow it;
      unparseable/empty output means report raw output and stop; never guess a stage. State values
      are enumerated (in_progress, blocked, complete) with an unknown-value default — follow the
      top-level instructions field; if absent, stop and report. Retry semantics — after a subagent
      dies, run the heartbeat first; the CLI state decides.
    lens: failure
    resolved: true
  - id: DL-011
    question: What validation is added so skill-body command references cannot drift from the CLI?
    answer: "New validation mechanism — any command or option written in a skill body must be verified
      to actually exist. Repo-level validator wired into npm run validate (pattern:
      bin/validate-agents-md.ts): every command/flag reference in src/skills/*/SKILL.md checked
      against the CLI command registry (listCommands) and the help.ts flag catalog. Envelope-field
      references (data.stage, data.semantic_checks, state values, etc.) asserted by unit tests
      against the emitting code. Recorded as a design-review event; the stage-check catalog is NOT
      extended (this is a repo gate, not a stage check)."
    lens: constraint
    resolved: true
  - id: DL-012
    question: What constraints bound the SKILL.md rewrite (structure, markers, autonomy, review scope,
      delegation template)?
    answer: "SKILL.md structure — the three trailing paragraphs (CLI owns stage detection; artifacts
      only via the sdlc CLI; payload stdin/temp-file hygiene) are re-categorized into the loop —
      detection rule into the loop preamble, artifact/payload rules into loop step 7
      (blocked-envelope work). Frontmatter — reword 'identify or create' to identify (creation is a
      separate, explicit step) and drop the hardcoded stage enumeration (the CLI owns stage
      detection). Autonomy behavior stays as-is (the loop runs until complete/blocked; no added
      checkpoints). Review scope — all four review categories applied. Reviewer-authorship conflict
      grounding is skill-only rewording — 'if the bound reviewer is unavailable and you authored or
      delegated the artifact in this session, or cannot determine who authored it, stop and surface
      the conflict to the user.' No schema/CLI author field. Delegation design confirmed as Option 1
      (hand off with context) — fixed delegation template: the suggested command verbatim
      (data.suggested_command) + CLI path resolution rule (resolve scripts/sdlc.js relative to the
      skill base directory, invoke from project root, never cd into the skill folder) + change name
      + one-line task statement ('run the command, follow your envelope instructions, report one
      line of outcome'). Exceptions allowed in the payload — the collected request text (first
      delegation only) and semantic-check names verbatim (review rounds). Loop polish items for the
      rewrite — enumerate state values with unknown-value default; CLI-failure rule; retry semantics
      (heartbeat first after a subagent dies); completion report shape (change name, stages with
      review verdicts, artifacts produced, knowledge-extraction outputs, suggested next actions);
      semantic-checks sentence reworded (pass check names verbatim from data.semantic_checks; never
      substitute positional numbers for names); one concrete path example; a compact 6-8 line worked
      example; one change per orchestration run; multiple plausible matches when resolving text to a
      change means present candidates and ask; imperative phrasing in short input defaults to
      request seed rather than change reference."
    lens: constraint
    resolved: true
  - id: DL-013
    question: What mechanical constraints apply (workflows rename, deploy machinery, relationship to
      orchestration-economy)?
    answer: Rename src/scripts/workflows/ to src/scripts/commands/ (full rename) — folder, WorkflowDef
      becomes CommandDef in types.ts, sdlc.ts import, test/e2e/workflows.test.ts becomes
      commands.test.ts, refs in test/unit/help-contract.test.ts and test/unit/list-commands.test.ts,
      one ref in src/skills/improvement-review/SKILL.md, and the docs/current rows mentioning
      workflows. Rationale — the folder holds commands, not workflows (one term, one meaning).
      Deploy machinery — remove the COMMANDS_TOKEN requirement and interpolation from
      bin/deploy-to-agent.ts (~lines 181-207; the source-must-contain-token check and replaceAll);
      keep the three marker checks (DELEGATION_RULE_MARKER, ARTIFACT_RULE_MARKER 'only via the sdlc
      CLI', IDENTIFICATION_RULE_MARKER 'Change identification'). Relationship to existing change
      orchestration-economy (draft, requirements stage, created 2026-09-07) — DIFFERENT scope
      (loop-closure instructions in the delegation directive + review-round invocation counter);
      this change's SKILL.md rewrite SUBSUMES its loop-closure intent; record the relationship so
      that change can be superseded or adjusted later.
    lens: constraint
    resolved: true
assumptions:
  - type: verified
    text: validateChangeSlug enforces kebab-case slugs (lowercase letters, digits, and hyphens; starts
      alphanumeric; at most 60 characters; no trailing hyphen) and is reusable for the init command.
    source: src/scripts/lib/ids.ts
  - type: verified
    text: The orchestration-economy change exists as a draft in the requirements stage (created
      2026-09-07) and its loop-closure intent is distinct from this change's scope.
    source: docs/changes/orchestration-economy/requirements.yaml (listed by sdlc changes)
  - type: verified
    text: bin/deploy-to-agent.ts defines COMMANDS_TOKEN ('{{COMMANDS}}') with a
      source-must-contain-token check and a replaceAll interpolation near lines 181-207, alongside
      the three marker checks (delegation rule, artifact rule, identification rule).
    source: bin/deploy-to-agent.ts
  - type: unverified
    text: The line numbers cited in the stakeholder ledger for src/scripts/lib/kinds/authoring.ts (~947,
      ~874, 239, 376, 964) are approximate; the branches are located by structure during
      implementation.
    risk: Edits anchored to stale line numbers could remove the wrong branch.
    impact: "Low: the removal targets are identified by behavior, not by line number."
    severity: low
  - type: unverified
    text: slugify and uniqueSlug in src/scripts/lib/ids.ts become dead code once the --request creation
      branches are removed; they are deleted only if no caller remains.
    risk: Removing an export still referenced elsewhere breaks the build; keeping orphans violates the
      dead-code intent.
    severity: low
  - type: unverified
    text: The review envelope may not expose a round count to the orchestrator today; the loop guard
      needs a CLI-visible count, either from existing data or through a small data.round addition.
    risk: Without a CLI-visible count the orchestrator cannot detect that the three-run cap is reached.
    severity: medium
functional_requirements:
  - id: FR-001
    description: When the orchestrator runs sdlc init --change <slug> with a slug that passes
      validateChangeSlug and does not collide with an existing change, the CLI shall create only the
      change directory docs/changes/<slug> and return an envelope with state ok, data.change_name
      set to the slug, and instructions pointing to the heartbeat (status); no request.md, no
      artifact seeding, and no stage engagement shall occur.
    acceptance_criteria:
      - id: AC-001
        statement: Given docs/changes/<slug> does not exist and <slug> passes validateChangeSlug, When sdlc
          init --change <slug> runs, Then the CLI creates exactly the directory docs/changes/<slug>,
          returns state ok with data.change_name equal to <slug>, and its instructions reference the
          status heartbeat, with no other file or directory created.
        category: happy
      - id: AC-002
        statement: Given <slug> violates the validateChangeSlug rules (an uppercase letter, a trailing
          hyphen, or more than 60 characters), When sdlc init --change <slug> runs, Then the CLI
          returns an INVALID_CHANGE_SLUG error and creates no directory.
        category: negative
      - id: AC-003
        statement: Given docs/changes/<slug> already exists, When sdlc init --change <slug> runs, Then the
          CLI returns a CHANGE_DIR_EXISTS error, leaves the existing directory untouched, and
          creates no suffixed variant.
        category: negative
      - id: AC-004
        statement: Given the init command is invoked with a --request flag, When the CLI parses the
          arguments, Then it exits with UNKNOWN_FLAG because the init flag table declares no request
          flag.
        category: edge
  - id: FR-002
    description: When the orchestrator identifies a new change, it shall derive the kebab-case slug
      itself per the validateChangeSlug rules, check the slug against the change list, and on a
      collision ask the user to verify whether the existing change already covers the request; it
      shall never auto-suffix a colliding slug.
    acceptance_criteria:
      - id: AC-005
        statement: Given a user request describing a new change, When the orchestrator derives the slug,
          Then the slug contains only lowercase letters, digits, and hyphens, starts with a letter
          or digit, carries no trailing hyphen, and is at most 60 characters long.
        category: happy
      - id: AC-006
        statement: Given the derived slug matches an existing change in the changes list, When the
          orchestrator resolves the identification, Then it presents the existing change to the user
          and asks whether to resume it or create a new change, and runs init only after the user
          confirms a new change is intended.
        category: edge
      - id: AC-007
        statement: Given a slug collision with an existing change, When the orchestrator resolves the
          identification, Then it never appends a numeric or textual suffix to make the slug unique.
        category: negative
  - id: FR-003
    description: "When any stage command runs, the CLI shall require --change resolving to an existing
      change and shall accept no --request flag: the --request-only creation branch, the
      --change+--request explicit-slug creation branch, the args.request fallbacks in
      instantiateArtifact, and the request flag in help.ts are removed with no fallback and no
      seeding variant."
    acceptance_criteria:
      - id: AC-008
        statement: Given an existing change with a draft requirements artifact, When sdlc requirements
          --change <name> --update-artifact runs with a payload on stdin, Then the artifact is
          created or merged exactly as before the --request removal.
        category: happy
      - id: AC-009
        statement: Given a stage command invoked without --change, or with a name that resolves to no
          existing change, When the command runs, Then it exits with a usage error and creates no
          change directory and no artifact file.
        category: negative
      - id: AC-010
        statement: Given --request passed to any stage command, When the CLI parses the arguments, Then it
          exits with UNKNOWN_FLAG and the command's --help output lists no request flag.
        category: negative
      - id: AC-011
        statement: Given the requirements stage invoked for an existing change with no request text
          available, When sdlc requirements --change <name> runs, Then the stage engages normally
          without any request input.
        category: edge
  - id: FR-004
    description: When the orchestrator delegates the first stage (requirements) for a freshly
      initialized change, it shall pass the request text collected during identification as
      delegation context, and no step shall persist that text at init time (no request.md).
    acceptance_criteria:
      - id: AC-012
        statement: Given a change initialized by the orchestrator and request text collected from the user,
          When the orchestrator delegates the requirements stage, Then the delegation payload
          contains the request text in addition to the fixed delegation template.
        category: happy
      - id: AC-013
        statement: Given init has just run for a change, When the change directory is inspected, Then it
          contains no request.md and no file carrying the request text.
        category: negative
      - id: AC-014
        statement: Given a session lost between init and the first delegation, When orchestration resumes,
          Then the orchestrator re-collects the context from the user instead of reading a persisted
          request file.
        category: edge
  - id: FR-005
    description: When the changes command runs, the CLI shall return every change with its pipeline
      state visible as in_progress or complete (per-entry field or separated lists, decided in
      design).
    acceptance_criteria:
      - id: AC-015
        statement: Given a repository with at least one in-progress and one completed change, When the
          changes command runs, Then the output marks every change as in_progress or complete
          through a per-entry field or separated lists.
        category: happy
      - id: AC-016
        statement: Given a repository with zero changes, When the changes command runs, Then the output
          reports an empty inventory without an error.
        category: edge
      - id: AC-017
        statement: Given a change that completes after being listed as in-progress, When the changes command
          runs again, Then the change is marked complete.
        category: boundary
  - id: FR-006
    description: "When the orchestrator delegates a stage, it shall use the fixed delegation template —
      the suggested command verbatim (data.suggested_command), the CLI path resolution rule (resolve
      scripts/sdlc.js relative to the skill base directory, invoke from project root, never cd into
      the skill folder), the change name, and the one-line task statement — with only two payload
      exceptions: the collected request text on the first delegation and semantic-check names
      verbatim on review rounds."
    acceptance_criteria:
      - id: AC-018
        statement: Given a stage to delegate, When the orchestrator composes the delegation payload, Then it
          contains the suggested command verbatim, the CLI path resolution rule, the change name,
          and the one-line task statement, and nothing beyond the two allowed exceptions.
        category: happy
      - id: AC-019
        statement: Given a review round, When the orchestrator passes semantic checks to the reviewer, Then
          it passes the check names verbatim from data.semantic_checks and never substitutes
          positional numbers for names.
        category: negative
  - id: FR-007
    description: When a stage must run, the orchestrator shall delegate it to the bound agent, or to a
      generic subsession when the bound agent is missing, and shall never run the stage inline; when
      no delegation mechanism exists at all, it shall stop and report an SDLC error to the user.
    acceptance_criteria:
      - id: AC-021
        statement: Given the bound agent for a stage exists, When the orchestrator engages the stage, Then
          the stage runs in a subsession of the bound agent.
        category: happy
      - id: AC-022
        statement: Given the bound agent for a stage is missing, When the orchestrator engages the stage,
          Then it spawns a generic subsession that receives the envelope and remains bound by the
          CLI permissions.
        category: edge
      - id: AC-023
        statement: Given no delegation mechanism exists at all, When the orchestrator engages the stage,
          Then it stops and reports the SDLC error to the user instead of running the stage inline.
        category: negative
      - id: AC-024
        statement: Given the rewritten skill text, When it is searched for the inline-execution carve-out
          (the phrase 'unless you are already that agent'), Then no such carve-out remains.
        category: negative
  - id: FR-008
    description: When a review round rejects an authoring artifact and the CLI-visible round count shows
      the artifact or stage has run 3 times (initial run plus two rework rounds), the orchestrator
      shall stop and escalate to the user instead of delegating another authoring run.
    acceptance_criteria:
      - id: AC-025
        statement: Given a review round rejection with the CLI-visible round count below 3, When the
          orchestrator continues the loop, Then it delegates one rework round to the authoring stage
          agent.
        category: happy
      - id: AC-026
        statement: Given a review round rejection with the CLI-visible round count at 3, When the
          orchestrator evaluates the loop, Then it stops and escalates to the user and delegates no
          fourth authoring run.
        category: boundary
      - id: AC-027
        statement: Given the loop runs without any review rejection, When the orchestrator counts cycles,
          Then no heartbeat-cycle cap applies because the generic cycle-cap mechanism is not
          implemented.
        category: edge
  - id: FR-009
    description: When a CLI invocation fails, the orchestrator shall treat a non-zero exit as a blocked
      envelope and follow it, shall report unparseable or empty output raw and stop, and shall never
      guess a stage; when an envelope state value is not in_progress, blocked, or complete, it shall
      follow the top-level instructions field and, if that field is absent, stop and report.
    acceptance_criteria:
      - id: AC-028
        statement: Given a CLI invocation that exits non-zero with a parseable envelope in state blocked,
          When the orchestrator handles the failure, Then it follows the blocked envelope's
          instructions.
        category: happy
      - id: AC-029
        statement: Given a CLI invocation that returns unparseable or empty output, When the orchestrator
          handles the failure, Then it reports the raw output and stops without inferring a stage.
        category: negative
      - id: AC-030
        statement: Given an envelope whose state value is none of in_progress, blocked, or complete and
          whose top-level instructions field is present, When the orchestrator handles it, Then it
          follows the instructions field.
        category: edge
      - id: AC-031
        statement: Given an envelope with an unknown state value and no top-level instructions field, When
          the orchestrator handles it, Then it stops and reports to the user.
        category: boundary
  - id: FR-010
    description: When a delegated subagent dies, the orchestrator shall run the heartbeat (status) first
      and let the CLI state decide the next action.
    acceptance_criteria:
      - id: AC-032
        statement: Given a subagent that died mid-stage, When the orchestrator resumes the loop, Then it
          runs the heartbeat (sdlc status --change <name>) and acts on the returned state rather
          than on assumptions about the subagent's progress.
        category: happy
      - id: AC-033
        statement: Given the heartbeat shows the stage still in_progress after the subagent died, When the
          orchestrator acts on the CLI state, Then it re-delegates the stage instead of assuming
          completion.
        category: edge
  - id: FR-011
    description: When the loop reaches complete, the orchestrator shall produce a completion report
      containing the change name, every stage with its review verdict, the artifacts produced, the
      knowledge-extraction outputs, and suggested next actions.
    acceptance_criteria:
      - id: AC-034
        statement: Given a change whose pipeline reached complete, When the orchestrator reports completion,
          Then the report names the change, lists every stage with its review verdict, enumerates
          the artifacts produced, includes the knowledge-extraction outputs, and lists suggested
          next actions.
        category: happy
      - id: AC-035
        statement: Given a pipeline state that is not complete, When the orchestrator considers reporting,
          Then no completion report is emitted and the loop continues per the envelope.
        category: boundary
  - id: FR-012
    description: When the agentic-sdlc SKILL.md body is rewritten, the skill shall move the three
      trailing rule paragraphs into the loop — the stage-detection rule into the loop preamble and
      the artifact-rule and payload-hygiene rules into loop step 7 (blocked-envelope work).
    acceptance_criteria:
      - id: AC-036
        statement: Given the rewritten SKILL.md, When the loop preamble and loop step 7 are read, Then the
          stage-detection rule appears in the loop preamble and the artifact-rule and
          payload-hygiene rules appear in loop step 7, with no trailing rule paragraphs left outside
          the loop.
        category: happy
      - id: AC-038
        statement: Given the rewritten loop step 7, When the blocked-envelope work is read, Then it includes
          the payload stdin and temp-file hygiene rule (payload flags accept stdin or a temp file
          under .tmp/sdlc; the CLI never deletes input files).
        category: edge
  - id: FR-013
    description: When the SKILL.md frontmatter is reworded, it shall describe identification only
      (creation is a separate, explicit step) and shall contain no hardcoded stage enumeration (the
      CLI owns stage detection).
    acceptance_criteria:
      - id: AC-039
        statement: Given the reworded frontmatter, When it is read, Then it describes identification only,
          states that creation is a separate explicit step, and contains no hardcoded stage
          enumeration.
        category: happy
      - id: AC-040
        statement: Given the reworded frontmatter and body, When they are searched for a stage list owned by
          the skill, Then no such enumeration exists and stage detection is attributed to the CLI.
        category: negative
  - id: FR-014
    description: When the trailing Commands line is removed from the SKILL.md, the skill shall explain
      the orchestrator's commands (changes, init, status) inline at their points of use and shall
      direct other command lookups to --list-commands.
    acceptance_criteria:
      - id: AC-041
        statement: Given the rewritten SKILL.md, When the orchestrator's commands are documented, Then
          changes, init, and status are explained inline at their points of use and other commands
          are looked up via --list-commands.
        category: happy
      - id: AC-042
        statement: Given the rewritten SKILL.md and the deploy machinery, When the trailing Commands token
          line is sought, Then neither the skill body nor the deploy interpolation contains it.
        category: negative
      - id: AC-043
        statement: Given a command the orchestrator has not used before, When the orchestrator needs its
          flags, Then the skill directs it to --list-commands for the lookup.
        category: edge
  - id: FR-015
    description: When the orchestrator resolves user input to a change, it shall present the candidate
      changes and ask whenever the text matches multiple plausible changes, and shall treat short
      imperative input as a request seed rather than a change reference.
    acceptance_criteria:
      - id: AC-044
        statement: Given user text that matches multiple existing changes, When the orchestrator resolves
          it, Then it presents the matching candidates and asks the user to choose before
          proceeding.
        category: happy
      - id: AC-045
        statement: Given short imperative input such as a request to add a retry limit, When the
          orchestrator resolves it, Then it treats the text as a request seed for a new change
          rather than as a reference to an existing change.
        category: edge
  - id: FR-016
    description: When a review stage's bound reviewer is unavailable and the orchestrator authored or
      delegated the artifact in this session, or cannot determine who authored it, the orchestrator
      shall stop and surface the conflict to the user; no author field shall be added to any schema
      or CLI envelope.
    acceptance_criteria:
      - id: AC-048
        statement: Given a review stage whose bound reviewer is unavailable and whose artifact was authored
          or delegated in the same session, When the orchestrator engages the review, Then it stops
          and surfaces the conflict to the user.
        category: happy
      - id: AC-049
        statement: Given the orchestrator cannot determine who authored the artifact and the bound reviewer
          is unavailable, When the orchestrator engages the review, Then it stops and surfaces the
          conflict to the user.
        category: edge
      - id: AC-050
        statement: Given the conflict rewording, When the stage schemas and CLI envelopes are inspected,
          Then no author field was added to any of them.
        category: negative
  - id: FR-017
    description: When npm run validate runs, a repo-level validator shall verify every command and flag
      reference in src/skills/*/SKILL.md against the CLI command registry (listCommands) and the
      help.ts flag catalog, and unit tests shall assert the envelope-field references (data.stage,
      data.semantic_checks, state values) against the emitting code; the stage-check catalog shall
      not be extended.
    acceptance_criteria:
      - id: AC-051
        statement: Given every SKILL.md under src/skills/ references only commands and flags that exist in
          the CLI command registry and the help.ts flag catalog, When npm run validate runs, Then
          the repo-level validator passes.
        category: happy
      - id: AC-052
        statement: Given a SKILL.md that references a command or flag absent from the registry or flag
          catalog, When npm run validate runs, Then it fails and names the offending reference.
        category: negative
      - id: AC-053
        statement: Given the envelope fields referenced by skill text (data.stage, data.semantic_checks, and
          the state values), When npm run validate runs, Then the run output names each asserted
          envelope field and exits 0 when every reference matches the emitting code, and exits
          non-zero naming the mismatched field when any reference does not.
        category: edge
  - id: FR-018
    description: "When the workflows folder is renamed, src/scripts/workflows/ shall become
      src/scripts/commands/ with WorkflowDef renamed to CommandDef in types.ts, and every reference
      shall follow: the sdlc.ts import, test/e2e/workflows.test.ts renamed to commands.test.ts, the
      refs in test/unit/help-contract.test.ts and test/unit/list-commands.test.ts, the ref in
      src/skills/improvement-review/SKILL.md, and the docs/current rows mentioning workflows."
    acceptance_criteria:
      - id: AC-054
        statement: Given the rename applied, When the test suite runs, Then every test passes under the new
          folder name src/scripts/commands/, the type name CommandDef, and the renamed test file
          commands.test.ts.
        category: happy
      - id: AC-055
        statement: Given the repository after the change, When src/, test/, and the docs/current rows are
          searched for the workflows naming, Then no match remains.
        category: negative
  - id: FR-019
    description: When the deploy machinery runs, bin/deploy-to-agent.ts shall no longer require or
      interpolate the Commands token (the source-must-contain-token check and the replaceAll call
      are removed) while keeping the three marker checks for the delegation rule, the artifact rule,
      and the identification rule.
    acceptance_criteria:
      - id: AC-057
        statement: Given a skill source without the Commands token, When the deploy runs, Then it completes
          without the source-must-contain-token check or the replaceAll interpolation.
        category: happy
      - id: AC-058
        statement: Given the deploy-smoke checks, When the deploy runs, Then the three marker checks still
          enforce the delegation-rule, artifact-rule, and identification-rule phrases.
        category: negative
  - id: FR-020
    description: When an orchestration run begins, the orchestrator shall scope the run to exactly one
      change from identification through completion.
    acceptance_criteria:
      - id: AC-046
        statement: Given an orchestration run started for one change, When the loop runs, Then the run stays
          scoped to that single change from identification through completion.
        category: happy
      - id: AC-047
        statement: Given a user request that spans several changes, When the orchestrator plans the work,
          Then it splits the request into separate runs, one change per run, instead of mixing
          changes in one run.
        category: negative
  - id: FR-021
    description: When the agentic-sdlc skill text is written, it shall state that only in-progress
      changes are selectable and that completed changes are archived.
    acceptance_criteria:
      - id: AC-065
        statement: Given the rewritten skill text, When it is read, Then it states that only in-progress
          changes are selectable and that completed changes are archived.
        category: happy
      - id: AC-066
        statement: Given a change that completes after being listed as in-progress, When the skill text is
          read, Then it directs the orchestrator to treat the completed change as archived and not
          selectable.
        category: boundary
  - id: FR-022
    description: When the agentic-sdlc SKILL.md body is rewritten, it shall include one concrete path
      example and one worked example of 6-8 lines.
    acceptance_criteria:
      - id: AC-037
        statement: Given the rewritten SKILL.md, When its examples are read, Then it contains one concrete
          path example and one worked example of 6-8 lines.
        category: edge
  - id: FR-023
    description: When a delegated subagent reports a stage outcome, the orchestrator shall treat the
      heartbeat (sdlc status) as the only verification channel — the report's claims, stage
      envelopes, and stage artifacts shall never be used as verification input.
    acceptance_criteria:
      - id: AC-020
        statement: Given a subagent report claiming success, When the orchestrator verifies the outcome,
          Then it runs the heartbeat (status) and never treats the report's claims as verification,
          and it never reads stage envelopes or stage artifacts.
        category: edge
  - id: FR-024
    description: When an idea is judged worth pursuing in the improvement-review skill, the acting skill
      agent shall create the change by running init for the confirmed slug and then engage the
      requirements stage.
    acceptance_criteria:
      - id: AC-056
        statement: Given an idea judged worth pursuing in the improvement-review skill, When the acting
          skill agent turns it into a change, Then the flow runs init for the confirmed slug and
          then engages the requirements stage.
        category: edge
non_functional_requirements:
  - id: NFR-001
    description: When a change created before this change is operated on, every stage command shall
      behave as before the --request removal, and the creation-gate behavior of ensuring the
      artifact on an existing change shall be preserved.
    acceptance_criteria:
      - id: AC-059
        statement: Given an existing change with artifacts created before this change, When every stage
          command runs against it, Then the behavior matches the pre-change contract with no
          creation and no seeding.
        category: happy
      - id: AC-060
        statement: Given a stage command invoked for an existing change, When it runs, Then it ensures the
          artifact on the existing change without creating a new change directory.
        category: edge
  - id: NFR-002
    description: When the skill and deploy changes land, npm run deploy:smoke shall pass with the three
      marker checks intact.
    acceptance_criteria:
      - id: AC-061
        statement: Given the rewritten skill deployed to .opencode, When npm run deploy:smoke runs, Then it
          passes with the delegation-rule, artifact-rule, and identification-rule markers verified.
        category: happy
      - id: AC-062
        statement: Given a deployed skill source that lacks one of the three marker phrases, When npm run
          deploy:smoke runs, Then it fails and names the missing marker.
        category: negative
  - id: NFR-003
    description: When the loop runs, it shall continue until the pipeline state is complete or blocked,
      with no added checkpoints beyond the loop guard of FR-008.
    acceptance_criteria:
      - id: AC-063
        statement: Given no review rejection cap and no blocked envelope, When the loop runs, Then it
          continues through the stages without pausing for user confirmation.
        category: happy
      - id: AC-064
        statement: Given a pipeline state of complete or blocked, When the loop evaluates the state, Then it
          stops — complete triggers the completion report and blocked follows the envelope.
        category: boundary
out_of_scope:
  - The changes-output split shape (per-entry pipeline_state field versus separated lists) — decided
    in design.
  - Whether the review envelope exposes the round count to the orchestrator or needs a small
    data.round addition — decided in design.
  - The handling of the '--request' token in src/scripts/lib/agent-prompt-marker.ts — decided in
    design; FR-003 covers only the flag surfaces and creation branches.
  - The fate of the slugify/uniqueSlug exports beyond the verify-then-remove-if-orphaned rule —
    decided in design.
  - A generic heartbeat-cycle cap — explicitly dropped by the stakeholder in favor of the three-run
    authoring guard.
  - A schema or CLI author field for reviewer-authorship conflicts — the grounding is skill-only
    rewording.
  - New autonomy checkpoints in the loop — autonomy behavior stays as-is.
  - Superseding or adjusting the orchestration-economy change — the relationship is recorded only;
    action happens in a later session.
  - Extending the stage-check catalog — the new validator is a repo gate, not a stage check.
failure_paths:
  - id: FP-001
    trigger: init is called with a slug failing validateChangeSlug.
    response: The CLI returns INVALID_CHANGE_SLUG and creates no directory.
  - id: FP-002
    trigger: init is called with the slug of an existing change.
    response: The CLI returns CHANGE_DIR_EXISTS, leaves the directory untouched, and creates no suffixed
      variant.
  - id: FP-003
    trigger: A stage command runs without --change or with a name that resolves to no existing change.
    response: The CLI exits with a usage error and creates no change directory and no artifact file.
  - id: FP-004
    trigger: A CLI invocation exits non-zero.
    response: The orchestrator treats the envelope as blocked and follows its instructions.
  - id: FP-005
    trigger: A CLI invocation returns unparseable or empty output.
    response: The orchestrator reports the raw output and stops; it never guesses a stage.
  - id: FP-006
    trigger: An envelope state value is outside in_progress, blocked, and complete.
    response: The orchestrator follows the top-level instructions field; if that field is absent, it
      stops and reports.
  - id: FP-007
    trigger: No delegation mechanism exists at all.
    response: The orchestrator stops and reports the SDLC error to the user; it never runs the stage inline.
  - id: FP-008
    trigger: A review round rejects and the CLI-visible authoring round count is at 3.
    response: The orchestrator stops and escalates to the user.
  - id: FP-009
    trigger: A session is lost between init and the first delegation.
    response: On resume the orchestrator re-collects the context from the user (accepted tradeoff).
  - id: FP-010
    trigger: A delegated subagent dies mid-stage.
    response: The orchestrator runs the heartbeat first; the CLI state decides the next action.
  - id: FP-011
    trigger: User text matches multiple existing changes.
    response: The orchestrator presents the candidates and asks the user to choose.
  - id: FP-012
    trigger: An edit is anchored to a stale line number or a removal leaves a dangling reference.
    response: The TypeScript build or test suite fails; npm run validate gates completion.
  - id: FP-013
    trigger: A deploy-smoke marker phrase is missing after the skill rewording.
    response: The deploy fails; the rewording preserves the phrase or the marker constant is updated
      deliberately (DEC-006).
  - id: FP-014
    trigger: Orchestration guidance in this change contradicts the orchestration-economy draft.
    response: The relationship is recorded; orchestration-economy is superseded or adjusted in a later
      session.
risks_and_dependencies:
  - id: R-001
    kind: risk
    description: Line numbers cited in the stakeholder ledger (authoring.ts ~947, ~874, 239, 376, 964;
      deploy-to-agent.ts ~181-207) may drift before implementation.
    severity: low
    mitigation: Locate branches by structure, not by line number.
    related_failure_path: FP-012
  - id: R-002
    kind: risk
    description: slugify and uniqueSlug may still have callers after the --request removal.
    severity: low
    mitigation: Verify callers before deleting; remove only when orphaned.
    related_failure_path: FP-012
  - id: R-003
    kind: risk
    description: The review envelope may not expose the round count the loop guard needs.
    severity: medium
    mitigation: Design decides between existing data and a small data.round addition (open design item).
    related_failure_path: FP-008
  - id: R-004
    kind: risk
    description: The skill rewording could drop the deploy-smoke marker phrase 'delegate the stage to
      that agent'.
    severity: medium
    mitigation: Preserve the phrase or update DELEGATION_RULE_MARKER deliberately (DEC-006).
    related_failure_path: FP-013
  - id: R-005
    kind: risk
    description: The orchestration-economy draft overlaps this change's loop-closure intent.
    severity: low
    mitigation: Record the relationship; supersede or adjust that change in a later session.
    related_failure_path: FP-014
  - id: D-001
    kind: dependency
    description: validateChangeSlug stays in src/scripts/lib/ids.ts — the init command reuses it.
  - id: D-002
    kind: dependency
    description: The stage-check catalog (src/scripts/lib/checks/index.ts) is not extended; the new
      validator is a repo gate recorded as a design-review event.
  - id: D-003
    kind: dependency
    description: docs/current updates land in the same change (AGENTS.md section 3); the delta entries
      name the target docs.
delta:
  - stage: requirements
    target_doc: docs/current/api-contract.md
    change: Add
    reason: "Document the new init command contract: sdlc init --change <slug> creates only the change
      directory, validates the slug (INVALID_CHANGE_SLUG), refuses duplicates (CHANGE_DIR_EXISTS),
      and returns state ok with data.change_name and heartbeat-pointing instructions."
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/api-contract.md
    change: Remove
    reason: Remove the --request flag from every stage command's flag table and help output; stage
      commands require --change resolving to an existing change and no longer create changes or seed
      artifacts.
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/api-contract.md
    change: Modify
    reason: Document the changes command output distinguishing in-progress from complete changes
      (per-entry pipeline_state or separated lists, shape decided in design).
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/architecture.md
    change: Modify
    reason: Rename src/scripts/workflows/ to src/scripts/commands/ and WorkflowDef to CommandDef; update
      the folder layout rows.
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/capabilities.md
    change: Modify
    reason: "Update the orchestration workflow: orchestrator-owned identification and init, the fixed
      delegation template with context hygiene, no inline stage execution (generic subsession
      fallback, SDLC error otherwise), the three-run authoring loop guard, state and CLI-failure
      handling, and the completion report shape."
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/glossary.md
    change: Add
    reason: Add entries for the init command and the CommandDef type; define the in_progress, blocked,
      and complete state vocabulary used by the skill.
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/glossary.md
    change: Remove
    reason: Drop the workflows naming for src/scripts/workflows/; the folder is commands (one term, one
      meaning).
    date: 2026-09-10
  - stage: requirements
    target_doc: docs/current/operations.md
    change: Add
    reason: Document the repo-level skill-reference validator wired into npm run validate (skill command
      and flag references checked against the command registry and the flag catalog) and the removal
      of the Commands token requirement from the deploy machinery.
    date: 2026-09-10
