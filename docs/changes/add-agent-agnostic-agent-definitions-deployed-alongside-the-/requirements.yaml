out_of_scope:
  - "Assigning agents to skills rather than stages: the knowledge-init skill is a one-time bootstrap
    invoked directly and carries no stage.yaml, so it receives no agent binding (SC-012)."
  - "Runtime LLM-based permission inference: the permission compatibility check is deterministic by
    design; no LLM judges permissions at validation or deployment time (NFR-005)."
failure_paths:
  - "The opencode-go catalog adds or removes models: update the model enum in the agent schema as a
    schema-change event; definitions referencing removed models fail validation naming the model
    until updated."
  - "OpenCode changes its agent markdown format: update only the rendering section of the deployment
    script; the agnostic source and validation are unaffected."
  - "The primary agent ignores the agent field and runs the stage itself: the stage still executes
    in the current agent; the mapping data remains accurate and delegation can be retried."
  - "The marker check flags legitimate prompt prose: adjust the marker list in the validation
    configuration and rerun npm run validate."
  - "A future deployment target cannot express a neutral field such as ask-level permissions: the
    target's renderer reduces the vocabulary and records the reduction in its deployment output."
  - "Stage instructions change to require a permission beyond the kind contract: add a per-stage
    override in stage.yaml within the same change; validation then forces the bound agent's
    permissions to align before merge."
  - "A platform version changes its agent format: add a version variant to that platform's renderer;
    the agent definitions, schemas, and validation are unaffected."
risks_and_dependencies:
  - risk: The opencode-go model catalog is external and versioned by OpenCode; the schema enum can drift
      from the live catalog.
    impact: Agent definitions referencing removed models fail validation until the enum is updated.
    severity: medium
  - risk: The deployment depends on the current OpenCode agent markdown format (frontmatter plus body).
    impact: A breaking format change in OpenCode requires updating only the deployment renderer.
    severity: low
  - risk: Delegation depends on the primary agent's runtime behavior; the toolkit controls the mapping
      data, not the delegation decision.
    impact: Stages may run in the current agent even when a dedicated agent is bound.
    severity: low
  - risk: The mechanical marker check can produce false positives on prompt prose that legitimately
      mentions CLI concepts.
    impact: Prompt wording adjustments or marker-list tuning during authoring.
    severity: low
  - risk: No second coding-agent target exists yet, so agnosticism is structural rather than proven
      against a second runtime.
    impact: A future target's renderer may need vocabulary reductions.
    severity: low
  - risk: Kind permission contracts could drift from actual interpreter behavior if the engine changes
      without updating the contracts.
    impact: The compatibility check validates against a stale contract, allowing under-permissioned agents.
    severity: medium
  - risk: Platform version variants are speculative until a second real format exists.
    impact: The version selection mechanism may need adjustment when genuine divergence appears.
    severity: low
