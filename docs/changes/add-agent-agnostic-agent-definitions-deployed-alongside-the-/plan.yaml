  - id: TASK-005
    title: Author the six-agent roster under src/agents/
    description: >
      Create six YAML definitions, each satisfying agent.schema.yaml. Names reflect role and
      personality for discoverability; descriptions state what the agent does and when to invoke it
      (one or two sentences); system prompts carry only role, personality, and domain judgment with
      zero CLI/skill instruction markers (no sdlc, no --change/--finalize flags, no scripts/sdlc.js,
      no envelope field names, no step command placeholders). Models and temperatures per role:
      requirements-analyst (opencode-go/kimi-k3, 0.3 — probing elicitation), systems-architect
      (opencode-go/glm-5.3, 0.2 — decisive decomposition), task-planner (opencode-go/glm-5.2, 0.1 —
      precise ordering), implementation-engineer (opencode-go/kimi-k2.7-code, 0.2 — code execution),
      stage-reviewer (opencode-go/gpt-5.6-luna, 0.1 — adversarial verification), knowledge-curator
      (opencode-go/deepseek-v4-flash, 0.2 — synthesis). Permissions per the design matrix:
      analyst/architect/planner/curator file_read allow, search deny, file_write allow, shell allow,
      subagent allow, web deny; engineer file_read allow, search allow, file_write allow, shell
      allow, subagent allow, web deny; reviewer file_read allow, search allow, file_write deny,
      shell allow, subagent deny, web deny.
