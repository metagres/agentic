      extend resolveStagesDir-style resolution in src/scripts/lib/paths.ts with an agents directory
      candidate, or add a sibling resolver) for *.yaml files, parses each with readYaml, validates
      each against agent.schema.yaml via validateWithSchema, enforces id equals the filename stem,
      and returns a cached registry of AgentRecords { id, file, description, model, temperature,
      permissions, systemPrompt }. getAgentById(cwd, id) resolves an id or returns null. Startup
      errors name the offending file. Add unit tests covering: valid discovery, invalid schema (bad
      model enum value) fails naming the file, id/filename mismatch fails, empty or missing
      directory behavior (empty registry, not an error, so unbound projects still work).
