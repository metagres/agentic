risks:
  - risk: The runtime path resolution for src/agents/ must work both in the repository and inside the
      deployed bundle (the registry is also loaded by deploy and validation), unlike stages which
      resolve from the bundle.
    impact: Discovery could fail in one of the two contexts.
    mitigation: Extend the existing path resolver with an agents candidate mirroring the stages
      resolution and cover both contexts in unit tests.
    severity: medium
  - risk: The e2e deploy test spawns concurrent deploys guarded by a build lock; adding agent rendering
      extends the critical section.
    impact: Slower or flaky e2e tests.
    mitigation: Keep rendering synchronous and cheap; reuse the existing lock discipline.
    severity: low
  - risk: The marker check could false-positive on legitimate personality prose that mentions CLI
      concepts generically.
    impact: Roster prompts need rewording during implementation.
    mitigation: Marker list targets command flags and file paths, not ordinary words; false-positive
      cases are unit-tested.
    severity: low
  - risk: Version-1 OpenCode renderer is based on the documented deprecated tools format; no live v1
      runtime exists to verify against.
    impact: The v1 variant may need adjustment if a real v1 target appears.
    mitigation: The variant is small and isolated in the renderer; covered by unit tests against the
      documented shape.
    severity: low
