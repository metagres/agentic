        operation: create
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: "Created src/schemas/agent.schema.yaml (draft-07, 23-model opencode-go enum,
      six-key permission vocabulary). Verified: validate:schemas and validate:policies exit 0."
    files_changed:
