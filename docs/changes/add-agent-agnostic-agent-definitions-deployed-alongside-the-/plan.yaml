  - id: TASK-003
    title: Implement kind permission contracts and the compatibility checker
    description: >
      Create src/scripts/lib/agent-permissions.ts. (1) KIND_PERMISSION_CONTRACTS: one contract per
      stage kind — authoring: floors file_read/file_write/shell/subagent allow, ceiling web deny;
      review: floors file_read/search/shell allow, ceilings file_write/subagent/web deny; tasks:
      floors file_read/search/file_write/shell/subagent allow, ceiling web deny; aggregator: floors
      file_read/file_write/shell/subagent allow, ceiling web deny. (2)
      computeEffectivePermissions(stage): kind contract with each key in the stage descriptor's
      optional permissions map overriding. (3) checkAgentCompatibility(stages, agents): for every
      stage with a bound agent, the agent's permissions must satisfy the effective requirements —
      floor keys must be allow, ceiling keys must be deny, unconstrained keys may be allow/ask/deny;
      for an agent bound to multiple stages, the union of floors and the intersection of ceilings
      must hold, and conflicts are reported naming the agent and both conflicting stages. Returns
      findings { stage, agent, key, required, actual } shaped for the validation bins. Pure and
      deterministic; no I/O. Unit tests: floor violation, ceiling violation, override precedence,
      multi-binding union/intersection, conflict reporting, and the full six-agent roster against
      the nine stage bindings passing.
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-009
      - FR-010
      - NFR-005
    acceptance_ids:
      - AC-016
      - AC-017
      - AC-018
      - AC-023
    design_refs:
      - DEC-005
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/agent-permissions.ts
        operation: create
      - path: test/unit/agent-permissions.test.ts
        operation: create
    started_at: 2026-08-25
    completed_at: 2026-08-25
    implementation_note: "Created agent-permissions.ts: four kind contracts, computeEffectivePermissions
      with override precedence, checkAgentCompatibility with
      union-of-floors/intersection-of-ceilings for multi-bound agents. Pure and deterministic.
      Verified: 18 unit tests pass including the full roster-vs-bindings matrix."
    files_changed:
