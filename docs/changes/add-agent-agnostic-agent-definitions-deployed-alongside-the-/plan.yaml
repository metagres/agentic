tasks:
  - id: TASK-001
    title: Create the agent meta-schema with the opencode-go model enum
    description: >
      Create src/schemas/agent.schema.yaml, the engine-owned meta-schema for agent definitions
      (sibling of stage.schema.yaml). Shape: version (integer const 1), id (string pattern
      ^[a-z0-9-]+$), description (non-empty string, minLength 1), model (string enum of the 23 fully
      qualified opencode-go ids: opencode-go/grok-4.5, opencode-go/gpt-5.6-luna,
      opencode-go/glm-5.3, opencode-go/glm-5.2, opencode-go/glm-5.1, opencode-go/kimi-k3,
      opencode-go/kimi-k2.7-code, opencode-go/kimi-k2.6, opencode-go/longcat-2.0,
      opencode-go/deepseek-v4-pro, opencode-go/deepseek-v4-flash,
      opencode-go/deepseek-v4-flash-vision-exp, opencode-go/mimo-v2.5, opencode-go/mimo-v2.5-pro,
      opencode-go/minimax-m3, opencode-go/minimax-m2.7, opencode-go/muse-spark-1.2-contributor,
      opencode-go/qwen3.8-max, opencode-go/qwen3.7-max, opencode-go/qwen3.7-plus,
      opencode-go/qwen3.6-plus, opencode-go/hy3, opencode-go/ox-alpha-free), temperature (number
      minimum 0 maximum 1), permissions (object with additionalProperties enum allow/ask/deny over
      the six neutral keys file_read, search, file_write, shell, subagent, web — express as
      properties per key with enum values and additionalProperties false), system_prompt (non-empty
      string). Top level: required [version, id, description, model, temperature, permissions,
      system_prompt], additionalProperties false. Follow the JSON-in-YAML style of
      stage.schema.yaml.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
      - FR-002
    acceptance_ids:
      - AC-006
      - AC-009
    design_refs:
      - DEC-002
    depends_on: []
    files:
