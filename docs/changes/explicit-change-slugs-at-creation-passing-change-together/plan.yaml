tasks:
  - id: TASK-001
    title: Create changes under an explicit validated slug
    description: >
      In the change-creation path (createChangeDir / slugify call site in
      src/scripts/lib/kinds/authoring.ts and src/scripts/lib/ids.ts): when args.change AND
      args.request are present and resolveRootOrError finds no matching directory, use args.change
      as the directory name after validating: pattern ^[a-z0-9][a-z0-9-]*$, max length 60, no
      trailing hyphen, unique among existing change directories (reject naming the violation;
      collisions list candidates via the existing error machinery). Bare --request keeps mechanical
      slugify; existing-directory --change keeps resume semantics. Unit tests: explicit-slug happy
      path, invalid charset/length/edge-hyphen rejections, collision rejection listing candidates,
      fallback unchanged, resume unchanged.
    type: implementation
    status: done
    complexity: low
    covers:
      - FR-001
      - FR-002
      - NFR-001
    acceptance_ids:
