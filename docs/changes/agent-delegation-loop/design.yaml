delta:
  - phase: Design
    target_doc: docs/current/architecture.md
    entity_id: CMP-001
    change: Add
    reason: New delegation-directive composer module composing per-stage directives from
      StageRecord.agent at emit time, wired into the single envelope funnel (CMP-002) so all kinds
      emit binding-derived directives and cross-cutting commands stay silent.
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/api-contract.md
    target_anchor: Envelope
    entity_id: DM-003
    change: Modify
    reason: Document that the instructions field of a bound stage's envelope carries a prepended
      delegation directive (self clause, unavailability clause, reviewer-directed phrasing for
      review kinds), composed from the declarative binding; null-binding commands emit none;
      top-level shape stays the frozen seven fields.
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/conventions.md
    entity_id: DEC-004
    change: Add
    reason: Working conventions - run a stage bound to an agent via that agent, delegating unless you
      already are the agent or it is unavailable; review rounds are performed by the bound reviewer
      agent (stage-reviewer), never by the authoring agent; enforced at convention level only.
    date: 2026-08-27
  - phase: Design
    target_doc: docs/current/capabilities.md
    entity_id: CMP-005
    change: Modify
    reason: Generated SKILL.md workflow section states the firm delegation rule and the deploy smoke
      asserts its presence alongside the two-skill layout checks (CMP-004, CMP-005).
    date: 2026-08-27
