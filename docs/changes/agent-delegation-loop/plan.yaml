    implementation_note: codemap.md Directory Map gained the src/scripts/lib/delegation.ts row (pure
      composer consumed by normalizeEnvelope, binding-derived directives, no hardcoded agent ids,
      NFR-002/AC-010). Docs-only change; validate re-run anyway as regression check earlier in
      session.
    started_at: 2026-08-27
    files_changed:
      - path: codemap.md
        operation: modify
    completed_at: 2026-08-27
milestones:
  - id: MS-001
    title: Engine surface - directives flow through every envelope
    tasks:
      - TASK-001
      - TASK-002
      - TASK-003
    done_when: npm run validate passes with the delegation unit suite green; bound stages emit a
      prepended directive naming their agent, cross-cutting commands stay byte-identical, and
      fixture agent ids compose into directives.
  - id: MS-002
    title: Deployment surface - SKILL.md rule and smoke gate
    tasks:
      - TASK-004
    done_when: npm run deploy:smoke passes with the marker-phrase assertion active and the e2e deploy
      test asserts the delegation rule in the generated SKILL.md.
  - id: MS-003
    title: Plan closed - documentation and full gate
    tasks:
      - TASK-005
    done_when: codemap.md documents delegation.ts and npm run check:all is green across the whole change.
risks:
  - id: RISK-001
    description: A delegated subagent may fail mid-stage (CLI error, lost context, timeout) because
      platform task-tool behavior is outside the toolkit's control.
    mitigation: Existing recovery stands - retry the stage command or revert via sdlc feedback; no new
      mechanism (requirements failure path 3).
  - id: RISK-002
    description: Review separation stays convention-level; an authoring agent may still run a review
      inline contrary to the directive because the CLI has no caller-identity signal.
    mitigation: Accepted per DEC-004; detection is human audit of review rounds; the limitation is
      recorded in the requirements failure paths.
  - id: RISK-003
    description: The funnel change touches every envelope emission (22 writeJson callers), so a
      regression could alter unrelated command output.
    mitigation: The registry cache keeps the lookup cheap; dedicated tests pin cross-cutting
      byte-identity (status, feedback, doctor) and the exact seven-field top-level shape (TASK-002,
      TASK-003).
  - id: RISK-004
    description: Deployment now gates on the marker phrase "is run via that agent"; future
      SKILL_TEMPLATE rewording could silently break the smoke.
    mitigation: The marker phrase is stable and asserted in both the deploy smoke and the e2e deploy
      test; any rewording must update the assertion deliberately (DEC-006).
