  - id: TASK-003
    title: Rewrite SKILL.md as a pure advisor (CMP-003) with npm run validate gate
    description: |
      Apply the CMP-003 per-section specification to src/skills/improvement-review/SKILL.md
      (DEC-001, DEC-003). Frontmatter: inputs drop the playbook and add
      docs/current/capabilities.md ("## SDLC Goals") and docs/current/operations.md
      ("## Baselines"); outputs list docs/ideas proposals plus measurement records; description
      states the pure-advisor contract. Section 0: "Reviewable state" becomes "Canon is
      read-only"; loud-abort retargets to the two canon files. Section 1: preconditions verify
      the "## SDLC Goals" and "## Baselines" anchors, aborting naming file plus anchor and
      running nothing; the thin-signal warning and maintainer confirmation are recorded in every
      proposal the run produces. Section 2: read-only goals load; a missing or amendment-worthy
      goal becomes a docs/ideas proposal stating the proposed entry in canon format; the landing
      change carries the capabilities.md delta (AC-010); the runtime propose-and-store path is
      deleted. Section 4: read-only comparison against the newest same-kind quantitative row in
      operations.md; every proposal's Evidence cites baseline value, fresh value, and delta
      (AC-003); a metric with no recorded row is labeled an initial-baseline candidate (AC-004);
      helper invocations, flags, and the timing-anchor mapping prose stay unchanged. Section 9:
      grounding retargets to the p12 exemplar (docs/ideas/p12-fast-track-lane.md) plus the frozen
      DM-005 record in docs/changes/sdlc-improvement-review-skill/design.yaml (AC-020); the
      nine-section skeleton and governance test survive unchanged (AC-018). Section 11: REPLACED
      by proposal-Status adjudication (DM-004 vocabulary: Proposed / Landed in <change-slug>
      <YYYY-MM-DD> / Dropped <YYYY-MM-DD> - <reason> / Superseded by <slug> <YYYY-MM-DD>) plus
      fairness-in-proposals (at least one confirmed-working mechanism with dated evidence cited
      inside a proposal; vacuous for zero-finding runs) plus write-time referential integrity on
      proposal References. Section 12: the two playbook failure rows become canon-anchor rows;
      the recipe-shape-change row becomes the incomparable-delta + baseline-refresh-proposal row;
      all other rows unchanged. Section 13: first limit becomes write only inside docs/ideas/
      (AC-006); new limit forbids editing idea files hosted inside completed change folders
      (frozen, reference read-only); .opencode/, engine, no-hardcoding, and no-scheduling limits
      kept verbatim. No helper script is touched (NFR-002).
      COMPLETION GATE: run npm run validate and require exit 0 before marking done - SKILL.md is
      under src/ (AGENTS.md section 1 fast gate; validate:templates re-validates the rewritten
      frontmatter).
