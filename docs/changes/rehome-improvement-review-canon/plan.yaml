risks:
  - id: RISK-001
    description: A Fixed-row citation fails re-verification, which would lose regression-check history
      if the playbook were deleted anyway.
    mitigation: Deletion is structurally gated - TASK-002 depends on TASK-001 and stops on any failed
      citation (AC-008, failure path 1); the row is preserved into this change's records or an idea
      document first; F5's fallback cites the hosted p11 (preserve-without-duplicating, never a
      docs/ideas/p11 duplicate).
  - id: RISK-002
    description: The residual sweep surfaces a hidden live reference to the playbook path beyond the six
      known sites.
    mitigation: Failure path 3 - the reference is retargeted before finalization; TASK-007 gates
      TASK-008 and TASK-009, so finalization cannot precede a clean sweep.
  - id: RISK-003
    description: envelope_sizes trusts bare authoring/tasks/aggregator CLI invocations to be read-only;
      an engine regression could make measurement mutate change state.
    mitigation: Verified read-only in the current engine (review stages hardcode --dry-run; bare
      authoring invocations only detect the step); the TASK-006 byte-identity double-run would
      surface state mutation as output drift between runs.
  - id: RISK-004
    description: No transcript files are supplied during implementation, so M-12 cannot record a real value.
    mitigation: DM-003 pending marker - Value "pending", kind and unit declared, recipe in the
      comparability note, no delta claim; the first successful measurement replaces the row.
  - id: RISK-005
    description: The playbook's six prose baselines would be lost with the deleted file, leaving
      AC-023's verbatim migration impossible at extraction time.
    mitigation: TASK-001 captures the six bullets verbatim into its task note BEFORE TASK-002 deletes
      the file; knowledge extraction migrates from the captured text, never regenerates.
