    implementation_note: "SKILL.md rewritten per CMP-003 per-section spec. Frontmatter: inputs drop the
      playbook, add docs/current/capabilities.md (## SDLC Goals canon, read-only) and
      docs/current/operations.md (## Baselines, read-only); outputs list docs/ideas proposals
      (nine-section format, governance-test result, Status disposition) plus measurement records;
      description states the pure-advisor contract. Section 0: Reviewable state replaced by
      Canon-is-read-only; loud abort retargeted to the two canon files. Section 1: preconditions
      verify the ## SDLC Goals and ## Baselines anchors, aborting naming file plus anchor (example
      abort strings included) and running nothing; thin-signal trigger kept (fewer than two
      substantive changes since the last review date = newest Origin review date among docs/ideas
      proposals), warning + confirmation recorded in every proposal the run produces (Origin field
      note). Section 2: read-only goals load from capabilities.md; runtime propose-and-store path
      deleted; missing/amendment-worthy goal becomes a docs/ideas proposal whose Goal section states
      the entry in canon format (G-NN, testable statement, grounding, status, created, amendments);
      landing change carries the capabilities.md delta (AC-010). Section 4: read-only comparison
      against the newest same-kind quantitative row in operations.md; every proposal Evidence cites
      baseline value, fresh value, delta (AC-003); unrowed metrics labeled initial-baseline
      candidates (AC-004); helper invocations, flags, and the ~2s-to-2000ms timing-anchor mapping
      prose kept (locus reference retargeted from playbook to operations.md prose baseline). Section
      9: grounding retargeted to the p12 exemplar (docs/ideas/p12-fast-track-lane.md) plus the
      frozen DM-005 proposal-skeleton record in
      docs/changes/sdlc-improvement-review-skill/design.yaml (verified: DM-005 is the nine-section
      skeleton record, grounded on the Step 6 enumeration); nine-section skeleton + governance test
      UNCHANGED (AC-018). Section 11 REPLACED by proposal-Status adjudication (DM-004 vocabulary:
      Proposed / Landed in <change-slug> <YYYY-MM-DD> / Dropped <YYYY-MM-DD> — <reason> / Superseded
      by <slug> <YYYY-MM-DD>) + fairness-in-proposals (>=1 confirmed-working mechanism with dated
      evidence in a proposal Evidence What-worked note; vacuous at zero proposals) + write-time
      referential integrity on References + missing_evidence rule carried over. Section 12: two
      playbook rows replaced by canon-anchor rows; recipe-shape-change row becomes
      incomparable-delta + baseline-refresh-proposal row; helper/zero-extraction/empty-dataset rows
      unchanged. Section 13: first limit = write only inside docs/ideas (AC-006) + canon updates
      travel only inside proposals; new limit forbids editing idea files hosted in completed change
      folders (frozen, read-only); .opencode/engine/no-hardcoding/no-scheduling limits kept.
      COMPLETION GATE: npm run validate exit 0 (196 tests pass; validate:templates re-validated the
      rewritten frontmatter). No helper script touched (NFR-002). Flagged deviations, both
      design-consistent retargets required by the register dissolution and CMP-006 site-1
