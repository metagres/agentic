    implementation_note: >-
      TASK-001 COMPLETE — all 9 register rows re-verified with the strengthened check (citation
      resolves AND states the claimed content). ZERO failed citations. No STOP condition triggered;
      F5 evidence unambiguous, no fallback needed. TASK-002 may proceed.


      DM-005 DISPOSITION ROWS (id | original statement | resolution | citation | verification
      result):


      F1 | Eight-step authoring tour taxed capable agents; remaining gates were honor-system |
      Fixed-provenance-verified | docs/current/decisions.md 2026-08-26
      streamline-the-sdlc-process-economy-collapse-the-authoring-s (DEC-004) | VERIFIED:
      decisions.md line 36 states "Authoring stages collapse to a six-step tour (needs_input, init,
      authoring, ready, complete, recovery) with one-call finalize (--finalize --confirm-semantic
      evaluates mechanical validation and the semantic gate together)" — exactly the claimed
      six-step tour + one-call finalize.


      F2 | Duplication by design: scenarios-to-ACs 99% similar; three-phase deltas overlap |
      Fixed-provenance-verified | decisions.md streamline DEC-001 + dedupeDeltas in
      src/scripts/lib/kinds/aggregator.ts + streamline design.yaml aggregator-dedupe record
      (CMP-005, plan implementation_note, test/unit/aggregator-dedupe.test.ts) | VERIFIED:
      decisions.md line 33 states "One merged acceptance_criteria list ... replaces the scenarios
      list and the old acceptance-criteria duality" with rationale "Measured 99 percent average text
      similarity between promoted scenario/AC pairs"; aggregator.ts line 40 exports dedupeDeltas
      (applied line 189); streamline plan.yaml line 205 records "dedupeDeltas groups per
      target_doc+change, latest phase wins within collapsible"; streamline design CMP-005 states the
      per-doc+change merge.


      F3 | Failures fired late (11 review-time note findings; unnormalized delta errors) |
      Fixed-provenance-verified | decisions.md streamline DEC-002 | VERIFIED: decisions.md line 34
      states "Transitions and updates enforce their own completeness at write time — a done
      transition without a non-empty note is rejected before any state is written ... review gates
      stop re-discovering construction errors" with rationale "Eleven review-time findings traced to
      one missing-note root cause and fourteen schema errors from unnormalized delta entries" —
      exactly the claimed write-time enforcement.


      F4 | Dead weight: complexity/milestones/risks unconsumed; unused flags; inert version |
      Fixed-dated-disposition (residue absorbed by method) | streamline design CMP-002/CMP-007 (per
      streamline FR-008 traceability: "treat complexity, milestones, and risks as optional and
      manage started_at, completed_at, and files_changed as CLI-owned state") + residue absorbed by
      src/skills/improvement-review/SKILL.md section 7 | VERIFIED: streamline CMP-007 states "The
      planning schema makes complexity optional and milestones and risks optional lists; the
      template stops emitting task bookkeeping fields; validation passes artifacts that omit them";
      CMP-002 states the tasks interpreter "owns started_at, completed_at, and files_changed ... so
      plans carry authored content only" (the inert-state half); streamline plan task "Make planning
      bookkeeping optional and CLI-owned" implementation_note confirms delivery ("milestones/risks
      optional in schema; template example trimmed of bookkeeping; minimal artifact without optional
      fields validates"). Residue "flag inventory still open" ABSORBED: SKILL.md section 7 "Step 4 —
      Unused-surface inventory (grep beside every claim)" is a standing per-run procedure with
      mandatory grep evidence, not a pending one-time item. No idea document needed.


      F5 | Agent layer had no runtime consumer; reviews accepted by the authoring agent |
      Fixed-dated-disposition (both complaints delivered; evidence unambiguous — no fallback
      triggered) | docs/changes/agent-delegation-loop/ (composer src/scripts/lib/delegation.ts,
      hosted p11-agent-delegation-loop.md, SKILL.md delegation rule asserted by deploy smoke)
      corroborated by docs/changes/add-agent-agnostic-agent-definitions-deployed-alongside-the-/
      (FR-003/FR-004 binding, FR-005 envelope surfacing, FR-006 rendered agents, FR-009/FR-010
      permission contracts, DEC-007 stage-reviewer roster) and
      docs/changes/agent-invocation-modes-and-interactive-questioning-agent-def/ (DEC-001 mode
      resolution, DEC-002 question gating) plus docs/current/conventions.md review
      separation-of-duties | VERIFIED: delegation.ts exists and is the pure composer
      (delegationDirective(stage) naming the bound agent; review-kind variant "delegate this review
      round to <agent> ... not by the agent that authored the artifact"); agent-delegation-loop
      design CMP-001 "Delegation directive composer", plan TASK-001 created the module, TASK-004
      added the firm SKILL.md delegation rule + deploy smoke assertion, implementation-review
      confirms live envelopes carried the composed review-kind directive naming stage-reviewer;
      hosted p11 present at docs/changes/agent-delegation-loop/p11-agent-delegation-loop.md (frozen,
      NOT duplicated into docs/ideas); add-agent-agnostic FR-003 (resolve binding, fail on
      unresolved), FR-004 (omitted = unbound/current agent), FR-005 (binding surfaced in data field,
      no new top-level fields), FR-006 (render agents at deploy), FR-009/FR-010 (mechanical
      permission verification from kind contract) all state the claimed content; DEC-007
      (design.yaml line 275, decisions.md line 27) states "A single stage-reviewer agent is bound by
      all four review stage descriptors; its contract ceiling (file_write deny)" — confirmed live in
      src/agents/stage-reviewer.yaml (file_write: deny); agent-invocation-modes DEC-001 "An omitted
      mode field resolves to all; a definition may declare subagent or primary explicitly" and
      DEC-002 "requirements-analyst carries question allow; the five other roster agents carry
      explicit deny" (decisions.md lines 30-31); conventions.md line 14 "Review separation of
      duties: review rounds are performed by the bound reviewer agent (stage-reviewer), never by the
      authoring agent". Residual delegation-outcome instrumentation remains method (SKILL.md section
      3 category 5, mine_transcript delegation events).


      F6 | Output/validation economics: fat envelopes; validate ran e2e builds |
      Fixed-provenance-verified | decisions.md streamline DEC-003 and DEC-005 | VERIFIED:
      decisions.md line 35 states "data.step_help is omitted from authoring envelopes by default;
      --help-step restores it for the current step; the seven frozen top-level envelope fields are
      untouched" (fat-envelope fix); line 37 states "npm run validate runs the seconds-long suite
      (schemas, policies, templates, typecheck, unit tests only); e2e stays in test:e2e and
      check:all keeps full coverage" (validate split).


      F7 | Cycle granularity ignored change size | Resolved-to-existing-proposal |
      docs/ideas/p12-fast-track-lane.md | VERIFIED: file present on disk; Status row reads "| Status
      | Proposed — partially de-risked by a manual micro-cycle |" — open proposal carrying the
      disposition; row dissolves, no new document created.


      Unlabeled row 1 | Docs-index parser silently returned 0 docs on real data (check never
      executed) | Fixed-provenance-verified | streamline plan.yaml task "Fix the docs-index parser
      for bare filenames" + noise-filter comment in src/scripts/lib/docs-index.ts | VERIFIED:
      streamline plan.yaml line 90 carries the titled task (done; implementation_note records
      "docs-index junk-row filter also landed (.md-only)"); docs-index.ts lines 33-34 carry the
      noise-filter comment "Quality filter: a real document row's first cell always ends with '.md'.
      Header and noise rows of auxiliary tables ...".


      Unlabeled row 2 | Change slugs truncated mid-word | Fixed-provenance-verified |
      docs/changes/explicit-change-slugs-at-creation-passing-change-together/ | VERIFIED: design
      states "Creates the change under the explicit slug when the directory does not exist ... falls
      back to mechanical slugify for bare --request"; requirements state "bare --request keeps the
      mechanical word-boundary slugify"; plan records "validateChangeSlug beside slugify guards
      createChangeDir; --change + --request" — word-boundary slugify + explicit slug creation
      confirmed.


      METHOD RECORD (AC-020, NFR-003): docs/changes/sdlc-improvement-review-skill/design.yaml and
      docs/changes/sdlc-improvement-review-skill/plan.yaml — present, accessible, frozen; cited as
      the record of the playbook's method content.


      SIX PROSE BASELINES CAPTURED VERBATIM from docs/ideas/sdlc-improvement-review-playbook.md
      section "## Current baselines (compare against, don't regress)" (AC-023, RISK-005 — file will
      be deleted in TASK-002; extraction migrates from this capture, never regenerates):


      1. `npm run validate`: ~2 s, unit-only; e2e lives in `check:all`.

      2. Authoring stages: six steps (`needs_input/init/authoring/ready/complete/recovery`);
      `--finalize --confirm-semantic` completes in one call.

      3. Requirements: one merged `acceptance_criteria` list (id / GWT / category / parent_id).

      4. Implementation review: zero blocking findings expected when notes are given at done-time.

      5. Deltas presented to knowledge-extraction: deduplicated per doc+change.

      6. Envelope: seven frozen top-level fields; `step_help` only behind `--help-step`.


      Read-only task: no file created, modified, or deleted.
