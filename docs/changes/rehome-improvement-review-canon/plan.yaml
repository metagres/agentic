  - id: TASK-001
    title: Re-verify register citations, record DM-005 dispositions, capture prose baselines verbatim
    description: |
      CMP-004 / DM-005 pre-deletion gate (DEC-004). Re-verify every findings-register citation
      resolves AND states the claimed content - a resolves-only check would pass a misattributed
      id. Rows and citations: F1 to decisions.md 2026-08-26 streamline DEC-004 (six-step tour,
      one-call finalize); F2 to streamline DEC-001 plus dedupeDeltas in
      src/scripts/lib/kinds/aggregator.ts plus the streamline design.yaml aggregator-dedupe
      record; F3 to streamline DEC-002 (write-time enforcement); F4 to streamline CMP-002/CMP-007
      (optionalization) with the flag-inventory residue absorbed by
      src/skills/improvement-review/SKILL.md section 7 (standing unused-surface inventory duty);
      F5 to the completed docs/changes/agent-delegation-loop/ change (src/scripts/lib/delegation.ts
      composer, hosted p11) corroborated by
      docs/changes/add-agent-agnostic-agent-definitions-deployed-alongside-the-/ (stage binding,
      envelope surfacing, rendered agents, stage-reviewer roster with file_write deny) and
      docs/changes/agent-invocation-modes-and-interactive-questioning-agent-def/ (mode resolution,
      question gating) plus the review separation-of-duties convention in
      docs/current/conventions.md; F6 to streamline DEC-003 and DEC-005; unlabeled docs-index row
      to the streamline plan task plus the noise filter in src/scripts/lib/docs-index.ts;
      unlabeled slug row to
      docs/changes/explicit-change-slugs-at-creation-passing-change-together/; F7 to
      docs/ideas/p12-fast-track-lane.md present on disk with Status Proposed.
      Record one DM-005 row per register entry (id, original statement, resolution, citation,
      verification result) in the task note via sdlc implementation --note.
      ALSO capture the playbook's six prose baselines VERBATIM from
      docs/ideas/sdlc-improvement-review-playbook.md section "Current baselines" into the task
      note - knowledge extraction needs the verbatim text for AC-023 after TASK-002 deletes the
      file (the design migrates them verbatim and never regenerates them).
      Cite docs/changes/sdlc-improvement-review-skill/design.yaml and plan.yaml as the method
      record in the disposition record (AC-020, NFR-003).
      GATE: any failed citation BLOCKS TASK-002 (AC-008, failure path 1) - preserve the row into
      this change's records or an idea document first; F5 ambiguity triggers the
      preserve-without-duplicating fallback citing the hosted
      docs/changes/agent-delegation-loop/p11-agent-delegation-loop.md - NEVER create a
      docs/ideas/p11 duplicate. Read-only task: no file is created, modified, or deleted.
