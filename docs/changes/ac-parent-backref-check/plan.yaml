  - id: TASK-005
    title: Widen next-id allocation to list-valued specs
    description: "Widen next-id allocation for the nested shape (CMP-006, DEC-004, DM-004). In
      src/scripts/lib/ids.ts, nextIdsFromArrays accepts a spec value of string or string list: a
      string keeps today's top-level field behavior byte-identically; a list resolves each entry as
      a path through the resolver module and unions the collected ids before nextId. Widen the
      stage-registry nextIds typing (src/scripts/lib/stage-registry.ts:27 and the descriptor read at
      :183) to Record<string, string | string[]>, and widen the stage meta-schema next_ids
      additionalProperties (src/schemas/stage.schema.yaml:65-70) to string or string-array. This
      task must land before TASK-006 because the requirements stage.yaml two-path AC spec fails
      startup validation against the string-only meta-schema. No CLI flag, envelope field, or
      command changes (NFR-002). Done when: unit tests cover string-spec byte-identity and list-spec
      union allocation, and npm run validate passes."
