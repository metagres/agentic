  - id: TASK-002
    title: Create the artifact path resolver module
    description: "Add src/scripts/lib/artifact-paths.ts with the two pure functions specified by
      CMP-001, DEC-001, and DM-002: resolveCollections(doc, spec) returning every array instance the
      spec addresses together with its location chain, and resolveLeafValues(doc, spec) returning
      scalar string values with fully indexed targets (for example
      functional_requirements[0].acceptance_criteria[1].statement). Grammar: segment([].segment)*
      over dot-separated names — a segment followed by [] iterates the array-valued property it
      names across every current item; a spec without [] addresses a top-level node. A spec
      traversing an absent property or an empty array yields an empty collection and never an error
      (AC-008). Single-segment specs resolve exactly as the existing getTopArray and resolvePath
      helpers, preserving byte-identical targets. The module performs no I/O and holds no ambient
      state, so identical inputs produce identical outputs (NFR-001, AC-022). Done when: unit tests
      cover the grammar (multi-segment traversal, union across array items, empty-collection
      semantics, indexed target strings) and single-segment byte-identity against the current
      getTopArray/resolvePath outputs, and npm run validate passes."
    type: implementation
    status: done
    complexity: medium
    covers:
      - FR-003
      - FR-005
      - NFR-001
    acceptance_ids:
      - AC-008
      - AC-022
    design_refs:
      - DEC-001
    depends_on:
      - TASK-001
    files:
      - path: src/scripts/lib/artifact-paths.ts
        operation: create
    implementation_note: "Created src/scripts/lib/artifact-paths.ts with resolveCollections and
      resolveLeafValues implementing the segment([].segment)* grammar (CMP-001, DEC-001, DM-002):
      []-marked segments iterate the array-valued property they name across every current item; a
      spec without [] is one literal top-level segment (byte-identical with getTopArray/resolvePath
      key lookups, including dotted keys); absent properties, empty arrays, and non-matching shapes
      resolve to no collection and never error (AC-008) — empty arrays are skipped so single-segment
      specs collapse exactly to getTopArray's [] for absent and empty alike. resolveLeafValues emits
      fully indexed targets (functional_requirements[0].acceptance_criteria[1].statement);
      two-segment specs reproduce resolvePath targets byte-identically; three-segment specs are new
      behavior (resolvePath cannot express them). No I/O, no ambient state. Unit tests
      (test/unit/artifact-paths.test.ts, 13 tests) cover multi-segment traversal, union across array
      items, empty-collection semantics, indexed targets, single-segment byte-identity against
      getTopArray and resolvePath, and an explicit run-twice determinism assertion (AC-022 CARRY
      ADVISORY satisfied directly, not by subsumption). npm run validate passes (exit 0, 260 unit
      tests green). Note: test file added beyond the plan's files list because the done-when
      requires unit tests; no other files touched."
    started_at: 2026-09-03
    files_changed:
      - path: src/scripts/lib/artifact-paths.ts
        operation: create
      - path: test/unit/artifact-paths.test.ts
        operation: create
    completed_at: 2026-09-03
  - id: TASK-003
