        operation: modify
      - path: test/unit/validate.test.ts
        operation: modify
    implementation_note: "Declaration path validation implemented (CMP-003, DEC-003). checks/index.ts:
      CHECK_CATALOG entries gained optional pathParams metadata ({spec, kind}) — unique-ids: arrays
      + unions[].arrays (collection), ref-exists: to.arrays (collection), given-when-then: arrays
      (collection, declared ahead of the TASK-006 rename and inert until a [].-bearing string
      appears there), forbidden-words: fields (leaf, covering string entries and the path key of
      object entries). validate.ts: new exported validateCheckDeclarations(stage, checksDoc, cwd)
      runs before runStageChecks inside validateArtifact and inside bin/validate-policies.ts at
      startup (registry loaded once and shared with the requires-graph check); it (a) aborts any
      [].-bearing parameter string outside the declared slots as an unsupported path, (b) enforces
      the segment([].segment)* grammar (intermediate segments must bear [], final must not), and (c)
      validates [].-bearing selectors against the governing schema — the stage's own schema.yaml, or
      for ref-exists to.file the schema of the stage owning that artifact resolved through the
      registry, with grammar-only fallback when no stage owns the file. Schema walk resolves local
      draft-07  (ready for the TASK-006 definitions/criterion reference), requires each segment
      declared at its nesting depth, []-marked segments array-typed, collection selectors ending
      array-typed, leaf selectors ending string-typed. Violations throw an Error naming the stage
      folder and the declaration, mirroring the unknown-check abort; no new errors.yaml codes.
      artifact-paths.ts parsePathSpec exported so validator and resolver share one grammar
      definition. Unit tests (9 new in validate.test.ts): current requirements declarations
      accepted; unsupported-path abort naming stage folder + declaration (AC-009); malformed
      intermediate-segment abort; undeclared-property abort; collection-not-array abort;
      leaf-not-string abort; grammar-only fallback for a file no stage owns; owned-file schema
      validation aborting on the same selector; valid owned-file path passing. npm run validate
      passes (exit 0); bin/validate-policies.ts passes standalone (44 ok, 0 failed)."
