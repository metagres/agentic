  - id: TASK-006
    title: Reconfigure the requirements and planning stages for the nested format
    description: "Land the atomic format flip (CMP-002 part 2, CMP-004, CMP-005). The unit suite is red
      on flat fixtures between this task and TASK-007; the two tasks form one green unit, and no
      pipeline flow re-validates archived artifacts in between (DEC-006). This task's own completion
      criterion is stage-folder and catalog consistency, not the full suite. Parts: (a)
      Check-library breaking changes — rename the given-when-then parameter array to arrays
      accepting a string or string list (a list evaluates the union) with findings targeted at the
      full nested statement path, route it through the resolver, and update the catalog
      requiredParams; delete src/scripts/lib/checks/referenced-by.ts and its catalog entry, leaving
      ten named checks (AC-014); a stage still declaring referenced-by then fails startup with the
      unknown-check error naming the stage folder (AC-015). (b) Requirements schema.yaml — remove
      the top-level acceptance_criteria property and requirement, remove ac_ids from FR and NFR
      entries, nest a required acceptance_criteria array (minItems 1) inside each FR and NFR entry,
      declare the criterion item once under definitions (id matching ^AC-[0-9]{3}$, statement,
      category enum happy/edge/negative/boundary) referenced from both entry types, and reject the
      retired fields by name through boolean-false property schemas — acceptance_criteria: false at
      the root, ac_ids: false on FR and NFR entries, parent_id: false on criterion items — declared
      in addition to additionalProperties: false, so the rendered findings carry the retired field
      in the instance path (DEC-005, AC-003, AC-004, AC-005, AC-006). (c) Requirements template.yaml
      — drop the top-level acceptance_criteria key and seed functional_requirements with one
      scaffold entry (id FR-001, a replace-me description, and a nested acceptance_criteria array
      holding one example criterion: id AC-001, a Given-When-Then statement, category happy)
      conforming to the new schema and passing the given-when-then and forbidden-word checks
      (DEC-009, AC-019). (d) Requirements structural-checks.yaml rewrite — unique-ids with
      plain-name scopes for functional_requirements, non_functional_requirements, and discovery_log
      plus one unions group over functional_requirements[].acceptance_criteria and
      non_functional_requirements[].acceptance_criteria (AC-010); given-when-then with the two-path
      arrays list (AC-011); forbidden-words fields over problem_statement, both description paths,
      and both nested statement paths (AC-012); delete the six dead declarations (ref-exists x3,
      referenced-by, duplicate-refs x2 on ac_ids) so no declaration references ac_ids or parent_id
      (AC-013); keep sentence-count untouched. (e) Requirements semantic-checks.yaml — rewrite the
      line-15 question to name the nested per-requirement arrays; steps.yaml — replace the authoring
      guidance paragraph with nested-criteria instruction and drop the parent_id authoring language
      at line 46 (AC-021); stage.yaml — change the next_ids AC spec to the two-path list (AC-020).
      (f) Planning structural-checks.yaml — point the tasks[].acceptance_ids ref-exists at to.file
      requirements.yaml with to.arrays as the two path entries
      functional_requirements[].acceptance_criteria and
      non_functional_requirements[].acceptance_criteria and field id (AC-016, AC-017, AC-018); the
      planning schema, the ^AC-[0-9]{3}$ pattern, and every other planning declaration stay
      untouched. (g) bin/validate-templates.ts — drop acceptance_criteria from the requirements
      required-key list and assert the template seeds at least one requirement entry carrying a
      non-empty nested acceptance_criteria array, pinning AC-019 at the npm run validate gate; this
      file is listed under CMP-007 in the design but lands here because the template reshape breaks
      the required-key check. Done when: bin/validate-templates.ts passes; bin/lint-artifact.ts on a
      hand-written nested sample requirements artifact reports no findings; the requirements stage
      loads with ten checks and no retired declaration; known-red: unit tests building flat
      fixtures, restored by TASK-007."
