  - id: TASK-004
    title: Validate check-declaration paths against stage schemas
    description: "Implement declaration path validation (CMP-003, DEC-003). Add pathParams metadata to
      the check catalog in src/scripts/lib/checks/index.ts declaring which parameters bear paths —
      unique-ids: arrays and unions; given-when-then: arrays; forbidden-words: fields including the
      path key of object entries; ref-exists: to.arrays — a [].-bearing string in any other
      parameter aborts as an unsupported path. In src/scripts/lib/validate.ts, before
      runStageChecks, validate every parameter string containing []. within those path-bearing
      subtrees against the stage schema: each segment must be a property declared in the schema at
      its nesting depth, a segment followed by [] must be array-typed there, a collection selector
      must end at an array-typed property, and a leaf selector must end at a string-typed property.
      For ref-exists to.file targets, resolve the owning stage's schema through the stage registry;
      a file no stage owns falls back to grammar checks only. Violations abort with a thrown Error
      naming the stage folder and the declaration, mirroring the unknown-check abort at
      checks/index.ts:62-66; no new errors.yaml codes (DEC-003). Run the same validation inside
      bin/validate-policies.ts at startup. The metadata for given-when-then: arrays is declared here
      ahead of the TASK-006 rename and is inert until a [].-bearing string appears in that
      parameter. Done when: unit tests cover the malformed-path abort naming the stage folder and
      declaration (AC-009), the grammar-only fallback for files no stage owns, and acceptance of the
      current requirements forbidden-words declaration (whose fields already bear one-segment paths)
      against the current requirements schema; and npm run validate passes."
    type: implementation
    status: done
    complexity: high
    covers:
