    implementation_note: "Format flip landed atomically (CMP-002 part 2, CMP-004, CMP-005, CMP-007
      validate-templates part). (a) Check library: given-when-then renamed to arrays (string or
      string list, list evaluates the union via resolveCollections, findings targeted at the full
      nested statement path functional_requirements[0].acceptance_criteria[1].statement;
