      DEC-002, DEC-008). Write the pinning tests first: record the exact findings of the unchanged
      design and planning structural-check declarations (planning's unique-ids over milestones and
      risks, ref-exists milestones.tasks to tasks.id, ref-exists tasks.covers to the requirements
      FR/NFR arrays, ref-exists tasks.design_refs to design decisions, dependency-acyclic,
      dependency-order, and the design stage's declarations) against their existing fixtures,
      asserting them verbatim; these tests must pass before and after the routing change. Then:
      delegate getTopArray and resolvePath in src/scripts/lib/checks/shared.ts to the resolver
      module keeping the exported signatures; route array selection in unique-ids.ts,
      forbidden-words.ts, and ref-exists.ts through the resolver; add the unions parameter to
      unique-ids — each unions group enforces one uniqueness scope across the union of the listed
      path-resolved collections, with the duplicate finding naming the id and every containing entry
      location, while plain-name arrays entries keep today's per-array scope and finding text
      (DM-003, AC-007); teach ref-exists to resolve path entries in to.arrays against the target
      document (its valid-id set already unions); resolve forbidden-words multi-segment leaf paths
      through the resolver. Update the stale ac_ids example in the duplicate-refs.ts header comment
      (line 6). The given-when-then parameter rename to arrays and the referenced-by deletion are
      NOT in this task — they break the requirements stage declaration and land with the stage
      reconfiguration (TASK-006). Done when: the pinning tests pass byte-identically, new unit tests
      cover the unions group evaluation (two FR-nested criteria collections evaluated as one union,
      AC-007) and cross-path duplicate detection, and npm run validate passes."
