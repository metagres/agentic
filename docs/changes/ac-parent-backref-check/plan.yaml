risks:
  - id: RISK-001
    description: A script, template, test, or skill-manifest entry outside the design's inventory reads
      the top-level acceptance_criteria array, ac_ids, or parent_id and breaks silently after the
      format flip — the requirements' unverified hidden-consumer assumption.
    mitigation: TASK-001 re-verifies the design's consumer inventory across src/, bin/, test/, and the
      skill manifest before any file is touched, and npm run check:all in TASK-009 exercises the
      authoring, review, and planning e2e flows against the nested format.
  - id: RISK-002
    description: Multi-segment path resolution alters targets or findings for existing single-segment
      declarations in the design, planning, or the unchanged requirements declarations.
    mitigation: The resolver collapses single-segment specs to the current getTopArray/resolvePath
      behavior (TASK-002), and the byte-identical pinning tests captured in TASK-001 and recorded in
      TASK-003 must stay green through the flip (TASK-007).
  - id: RISK-003
    description: The format flip is atomic across the requirements schema, template, check renames, and
      fixtures; between TASK-006 and TASK-007 the unit suite is red on flat fixtures.
    mitigation: TASK-006 and TASK-007 are sequenced back-to-back and form one green unit; TASK-006's own
      criterion is stage-folder consistency, validate-templates, and lint on a nested sample; no
      pipeline flow re-validates archived artifacts inside the window (DEC-006).
  - id: RISK-004
    description: Once the planning ref-exists declaration targets the two nested criteria paths,
      re-running planning validation against this change's own old-format requirements.yaml would
      report every acceptance_id as a missing reference, because the union of nested arrays in that
      artifact is empty.
    mitigation: Planning is finalized and reviewed before implementation begins; the implementation
      stage reads plan.yaml without re-running the planning structural checks (verified against
      src/scripts/lib/kinds/tasks.ts during planning); this change's requirements.yaml is archived
      old-format and is never migrated (DEC-006).
  - id: RISK-005
    description: The three pinned boolean-false finding strings depend on the repository's Ajv 8.20.0
      rendering rule (instancePath plus message); a dependency upgrade could change the rendered
      text and break the pinned tests.
    mitigation: The strings are pinned verbatim in unit tests (TASK-007), so any rendering change
      surfaces as a visible test failure in npm run validate rather than a silent behavior change.
  - id: RISK-006
    description: The template's example criterion AC-001 participates in next-id allocation, so a
      freshly initialized artifact allocates AC-002; an authoring agent reusing AC-001 for a real
      criterion collides with the scaffold entry until it is replaced.
    mitigation: steps.yaml instructs the authoring agent to replace the scaffold entry with real
      requirements and criteria, and the nested allocation test pins AC-002 on a fresh scaffold
      (TASK-007).
