version: 1

stages:
  requirements:
    artifact: requirements.yaml
    schema: requirements.schema.yaml
    template: requirements.yaml
    review_file: requirements-review.yaml
    status_field: status
    delta_phase: Requirements
    produces_delta: true

  design:
    artifact: design.yaml
    schema: design.schema.yaml
    template: design.yaml
    review_file: design-review.yaml
    status_field: status
    delta_phase: Design
    requires:
      - requirements
    produces_delta: true

  planning:
    artifact: plan.yaml
    schema: plan.schema.yaml
    template: plan.yaml
    review_file: plan-review.yaml
    status_field: status
    review_target: plan
    delta_phase: Planning
    requires:
      - design
      - requirements
    produces_delta: true

  implementation:
    artifact: plan.yaml
    schema: plan.schema.yaml
    review_file: implementation-review.yaml
    status_field: implementation_status
    requires:
      - planning

  knowledge-extraction:
    output: docs-delta.yaml
    requires:
      - implementation
    source_artifacts:
      - requirements.yaml
      - design.yaml
      - plan.yaml