{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "Docs Delta",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "metadata",
    "deltas_applied"
  ],
  "properties": {
    "metadata": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "stage",
        "status",
        "updated",
        "change_root"
      ],
      "properties": {
        "stage": { "type": "string" },
        "status": { "type": "string", "enum": ["complete"] },
        "updated": { "type": "string", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" },
        "change_root": { "type": "string" }
      }
    },
    "deltas_applied": { "type": "integer", "minimum": 0 }
  }
}