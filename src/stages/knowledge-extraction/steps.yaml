version: 1
steps:
  needs_input:
    title: Needs input
    markdown: |
      Ask the user which change to synchronize.
    commands:
      - "{{SDLC}} knowledge-extraction --change <change-name>"

  docs_delta:
    title: Collect deltas
    markdown: |
      First regenerate the mechanical parts of docs/current: run npm run docs:generate. Whole-file generated documents (dependencies.md, known-issues.md, decisions.md, index.md) and marker-delimited regions in the mixed documents are machine-owned — never edit them by hand; docs:check in the fast gate enforces freshness.

      Then apply each remaining listed delta to its target_doc under docs/current, editing in place at the delta's anchor. Only judgment content is delta-managed now: capabilities, conventions, glossary business rules, architecture prose, api-contract behavioral bullets, operations baselines, and canon sections. A delta whose target is a generated file or region is refused by the CLI with DELTA_TARGETS_GENERATED_REGION — regenerate instead.

      If the envelope carries DOCS_INDEX_MISSING, stop and tell the user to run the knowledge-init skill — the CLI never creates docs/current.

      One applied delta looks like:
      target_doc `docs/current/capabilities.md`, anchor `## SDLC Goals`: insert the delta's statement under that heading; when a statement already covers it, update or merge instead of appending.

      After updating the docs, run: {{SDLC}} knowledge-extraction --change {{change_name}} --complete
      Report the finished step in one line: how many deltas were applied across how many docs.
    commands:
      - "{{SDLC}} knowledge-extraction --change {{change_name}}"
      - "npm run docs:generate"

  complete:
    title: Complete
    markdown: |
      Mark the synchronization complete after the deltas are applied.
    commands:
      - "{{SDLC}} knowledge-extraction --change {{change_name}} --complete"
