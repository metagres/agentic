version: 1
steps:
  needs_input:
    title: Needs input
    markdown: |
      Ask the user which change to synchronize.
    commands:
      - "{{SDLC}} knowledge-extraction --change <change-name>"

  docs_delta:
    title: Collect deltas
    markdown: |
      Collect delta arrays from every delta-producing stage and apply them to docs/current.

      Use `data.deltas_to_apply` to update the living docs. After updating the docs, run: {{SDLC}} knowledge-extraction --change {{change_name}} --complete
    commands:
      - "{{SDLC}} knowledge-extraction --change {{change_name}}"

  complete:
    title: Complete
    markdown: |
      Mark the synchronization complete after the deltas are applied.
    commands:
      - "{{SDLC}} knowledge-extraction --change {{change_name}} --complete"
