version: 1
steps:
  needs_input:
    title: Needs input
    next_action: provide_change_dir
    markdown: |
      Ask the user which change directory to review and which decision to apply.

      The review gate requires the plan implementation status to be ready-for-review or accepted.
    commands:
      - "{{SDLC}} implementation-review --dir <change-dir> [--accept|--reject]"

  review:
    title: Review
    next_action: evaluate_findings
    markdown: |
      Run the implementation review against the tracked plan artifact.

      Report schema and structural findings plus the implementation semantic checklist.
      Accept only when implementation is ready-for-review and has no blocking findings.
    commands:
      - "{{SDLC}} implementation-review --dir {{change_dir}}"

  accept:
    title: Accept
    next_action: set_accepted
    markdown: |
      Accept the implementation after all blocking findings are resolved.
    commands:
      - "{{SDLC}} implementation-review --dir {{change_dir}} --accept"

  reject:
    title: Reject
    next_action: set_rejected
    markdown: |
      Reject the implementation to send it back for corrections.
    commands:
      - "{{SDLC}} implementation-review --dir {{change_dir}} --reject"
