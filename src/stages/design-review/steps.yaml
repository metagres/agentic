version: 1
steps:
  needs_input:
    title: Needs input
    markdown: |
      Ask the user which change to review and which decision to apply.

      The review gate requires the design artifact to be ready-for-review or accepted.
    commands:
      - "{{SDLC}} design-review --change <change-name> [--accept|--reject]"

  review:
    title: Review
    markdown: |
      Run the design review against the tracked artifact.

      Report schema and structural findings plus the design semantic checklist.
      Report only blocking and advisory findings, each naming its exact location (artifact, section, clause, or missing link) and quoting the evidence rather than paraphrasing it; never list passed checks; with zero findings report one line stating no blocking findings plus the verdict.
      Accept only when the artifact is ready-for-review and has no blocking findings.
      Always finish the session by issuing the verdict through the CLI — --accept with a --findings file, or --reject with a note; a review without a recorded verdict is incomplete, and a bare invocation only opens or refreshes the round.
    commands:
      - "{{SDLC}} design-review --change {{change_name}}"

  accept:
    title: Accept
    markdown: |
      Accept the design artifact after all blocking findings are resolved.
      Supply the complete semantic walk via --findings <file> (one {check_id, status, evidence} item per semantic check, all status 'pass').
    commands:
      - "{{SDLC}} design-review --change {{change_name}} --accept"

  reject:
    title: Reject
    markdown: |
      Reject the design artifact to send it back for corrections.
    commands:
      - "{{SDLC}} design-review --change {{change_name}} --reject"
