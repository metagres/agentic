version: 1
checks:
  - check: unique-ids
    params:
      arrays:
        - functional_requirements
        - non_functional_requirements
        - acceptance_criteria
        - discovery_log
        - scenarios
  - check: ref-exists
    params:
      from:
        array: functional_requirements
        field: ac_ids
      to:
        arrays:
          - acceptance_criteria
        field: id
  - check: ref-exists
    params:
      from:
        array: non_functional_requirements
        field: ac_ids
      to:
        arrays:
          - acceptance_criteria
        field: id
  - check: ref-exists
    params:
      from:
        array: acceptance_criteria
        field: parent_id
      to:
        arrays:
          - functional_requirements
          - non_functional_requirements
        field: id
  - check: ref-exists
    params:
      from:
        array: scenarios
        field: ac_id
      to:
        arrays:
          - acceptance_criteria
        field: id
  - check: ref-exists
    params:
      from:
        array: scenarios
        field: question_id
      to:
        arrays:
          - discovery_log
        field: id
  - check: referenced-by
    params:
      array: acceptance_criteria
      by:
        - array: functional_requirements
          ref_field: ac_ids
        - array: non_functional_requirements
          ref_field: ac_ids
  - check: duplicate-refs
    params:
      array: functional_requirements
      list_field: ac_ids
  - check: duplicate-refs
    params:
      array: non_functional_requirements
      list_field: ac_ids
  - check: given-when-then
    params:
      array: acceptance_criteria
      statement_field: statement
  - check: given-when-then
    params:
      array: scenarios
      statement_field: statement
  - check: forbidden-words
    params:
      fields:
        - problem_statement
        - functional_requirements[].description
        - non_functional_requirements[].description
        - acceptance_criteria[].statement
  - check: sentence-count
    params:
      field: problem_statement
      min: 1
      max: 6
