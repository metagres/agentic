version: 1
steps:
  needs_input:
    title: Needs input
    next_action: provide_change_or_request
    markdown: |
      Ask the user whether this is an existing change or a new request.

      For an existing change, present `data.existing_changes` and ask the user to choose one.

      For a new request, ask the user for the request text.
    commands:
      - "{{SDLC}} requirements --change <change-name>"
      - "{{SDLC}} requirements --request \"<request text>\""

  init:
    title: Initialization
    next_action: initialize_context
    markdown: |
      The script created the initial requirements artifact.

      Read `docs/current/index.md` and use it to decide which living docs are relevant.
      Read only what is needed for this request.
    commands:
      - "{{SDLC}} requirements --change {{change_name}}"
    complete_when:
      all:
        - field: metadata.title
          non_empty: true
        - field: metadata.request_summary
          non_empty: true

  authoring:
    title: Authoring
    next_action: update_artifact
    markdown: |
      Draft the full requirements artifact, recording as you go:

      - Discovery answers: record each resolved question through the script
        (--record-answer allocates the next DL-NNN id) and set clarity with
        --set-clarity. Watch `data.discovery_gate` to confirm lens coverage.
      - Assumptions: list every assumption implied by the request and the
        discovery answers, classifying each as verified or unverified.
      - Acceptance criteria: author every criterion directly in Given-When-Then
        form, each with a category (happy, edge, negative, boundary), nested in
        the acceptance_criteria array of the FR or NFR entry it verifies. Cover
        every category for the core behaviors. There is no separate promotion
        or back-fill pass: an example is authored as an acceptance criterion
        inside its owning requirement or it does not enter the artifact.
      - Delta: determine which living docs are affected and append entries via
        --append-delta (allowed targets: `data.delta_allowed_target_docs`) or
        include them in --update-artifact. Knowledge extraction dedupes.

      Use `data.next_ids` to choose the next FR/NFR/AC ids.

      Phrase each requirement in EARS form (When <trigger>, the system shall <response>) or an
      equally unambiguous pattern.

      If an example exposes an unresolved question instead, record it with --record-answer.
      If it is out of scope, add it straight to the out_of_scope section.

      Write the artifact through the script.
    commands:
      - "{{SDLC}} requirements --change {{change_name}} --next-ids"
      - "{{SDLC}} requirements --change {{change_name}} --record-answer --lens <lens> --question \"<question>\" --answer \"<answer>\""
      - "{{SDLC}} requirements --change {{change_name}} --set-clarity <clear|partial|vague>"
      - "{{SDLC}} requirements --change {{change_name}} --update-artifact < requirements.yaml"
      - "{{SDLC}} requirements --change {{change_name}} --append-delta < delta.yaml"
    complete_when:
      field: problem_statement
      non_empty: true

  recovery:
    title: Recovery
    next_action: fix_review_findings
    markdown: |
      The artifact was rejected by review.

      Read `data.review_report` and fix each blocking finding.

      Update the artifact through the script, then finalize again.

      If the artifact was rejected, finalizing automatically applies a patch version bump unless you pass --bump-version.
    commands:
      - "{{SDLC}} requirements --change {{change_name}} --update-artifact < requirements.yaml"
      - "{{SDLC}} requirements --change {{change_name}} --finalize"

  ready:
    title: Ready
    next_action: finalize
    markdown: |
      All gates passed.

      Finalize with --finalize --confirm-semantic.
    commands:
      - "{{SDLC}} requirements --change {{change_name}} --finalize --confirm-semantic"

  complete:
    title: Complete
    next_action: invoke_review
    markdown: |
      The requirements artifact is ready for the review gate.
    commands:
      - "{{SDLC}} requirements-review --change {{change_name}}"
