version: 1
steps:
  needs_input:
    title: Needs input
    next_action: provide_change_or_request
    markdown: |
      Ask the user whether this is an existing change or a new request.

      For an existing change, present `data.existing_changes` and ask the user to choose one.

      For a new request, ask the user for the request text.
    commands:
      - "{{SDLC}} requirements --dir <change-dir>"
      - "{{SDLC}} requirements --request \"<request text>\""

  init:
    title: Initialization
    next_action: initialize_context
    markdown: |
      The script created the initial requirements artifact.

      Read `docs/current/index.md` and use it to decide which living docs are relevant.
      Read only what is needed for this request.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}}"
    complete_when:
      all:
        - field: metadata.title
          non_empty: true
        - field: metadata.request_summary
          non_empty: true

  discovery:
    title: Discovery
    next_action: ask_user_question
    markdown: |
      Ask the user one question at a time.

      Record each resolved answer through the script. The script allocates the next DL-NNN id.

      Do not stop until `data.discovery_gate.passed` is true. Passing on counts alone is not
      enough: after the gate passes, confirm convergence with --complete-step --step discovery.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --record-answer --lens <lens> --question \"<question>\" --answer \"<answer>\""
      - "{{SDLC}} requirements --dir {{change_dir}} --set-clarity <clear|partial|vague>"
      - "{{SDLC}} requirements --dir {{change_dir}} --complete-step --step discovery"
    exit_criteria:
      all:
        - field: data.discovery_gate.passed
          equals: true
        - field: data.discovery_gate.confirmed
          equals: true

  scenarios:
    title: Scenarios
    next_action: map_examples_or_complete_step
    markdown: |
      Draft concrete examples as scenario entries (SC-NNN ids via `data.next_ids`) in
      Given-When-Then form, covering the happy, edge, negative, and boundary categories for the
      core behaviors.

      Decide an outcome for each example:
      - ac: the example becomes an acceptance criterion during drafting.
      - question: the example exposes an unresolved question. Record the question with
        --record-answer, link the scenario through question_id, then mark the scenario resolved.
      - out_of_scope: add the example to the out_of_scope section and mark the scenario resolved.

      Mark each scenario resolved once its outcome is decided. If you genuinely have no examples,
      confirm the empty set with --complete-step --step scenarios.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --next-ids"
      - "{{SDLC}} requirements --dir {{change_dir}} --update-artifact < requirements.yaml"
      - "{{SDLC}} requirements --dir {{change_dir}} --record-answer --lens <lens> --question \"<question>\" --answer \"<answer>\""
      - "{{SDLC}} requirements --dir {{change_dir}} --complete-step --step scenarios"
    exit_criteria: null

  assumptions:
    title: Assumptions
    next_action: record_assumptions_or_complete_step
    markdown: |
      List every assumption implied by the request and discovery answers.

      Classify each assumption as verified or unverified.

      If there are genuinely no assumptions, mark the step complete.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --update-artifact < requirements.yaml"
      - "{{SDLC}} requirements --dir {{change_dir}} --complete-step --step assumptions"
    complete_when:
      any:
        - array: assumptions
          min_items: 1
        - field: metadata.assumptions_reviewed
          equals: true

  drafting:
    title: Drafting
    next_action: update_artifact
    markdown: |
      Draft the full requirements artifact.

      Use `data.next_ids` to choose the next FR/NFR/AC ids.

      Phrase each requirement in EARS form (When <trigger>, the system shall <response>) or an
      equally unambiguous pattern.

      Promote every resolved scenario with outcome `ac` to an acceptance criterion in
      Given-When-Then form, link its parent_id to the FR or NFR it verifies, and back-fill the
      scenario's ac_id.

      Write the artifact through the script.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --next-ids"
      - "{{SDLC}} requirements --dir {{change_dir}} --update-artifact < requirements.yaml"
    complete_when:
      all:
        - field: problem_statement
          non_empty: true
        - any:
            - array: functional_requirements
              min_items: 1
            - array: non_functional_requirements
              min_items: 1
        - array: acceptance_criteria
          min_items: 1

  validation:
    title: Validation
    next_action: fix_mechanical_errors
    markdown: |
      Fix mechanical validation errors first.

      Then run `--finalize` to review the semantic checks.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --finalize"

  delta:
    title: Delta
    next_action: append_delta_or_complete_step
    markdown: |
      Determine which living docs are affected.

      Use `data.delta_allowed_target_docs` as the allowed target docs.

      Append delta entries through the script.

      If no docs are affected, mark the step complete.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --append-delta < delta.yaml"
      - "{{SDLC}} requirements --dir {{change_dir}} --complete-step --step delta"
    complete_when:
      any:
        - array: delta
          min_items: 1
        - field: metadata.delta_reviewed
          equals: true

  recovery:
    title: Recovery
    next_action: fix_review_findings
    markdown: |
      The artifact was rejected by review.

      Read `data.review_report` and fix each blocking finding.

      Update the artifact through the script, then finalize again.

      If the artifact was rejected, finalizing automatically applies a patch version bump unless you pass --bump-version.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --update-artifact < requirements.yaml"
      - "{{SDLC}} requirements --dir {{change_dir}} --finalize"

  ready:
    title: Ready
    next_action: finalize
    markdown: |
      All gates passed.

      Finalize the artifact.
    commands:
      - "{{SDLC}} requirements --dir {{change_dir}} --finalize"

  complete:
    title: Complete
    next_action: invoke_review
    markdown: |
      The requirements artifact is ready for the review gate.
    commands:
      - "{{SDLC}} requirements-review --dir {{change_dir}}"
