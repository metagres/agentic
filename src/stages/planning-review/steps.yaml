version: 1
steps:
  needs_input:
    title: Needs input
    markdown: |
      Ask the user which change to review and which decision to apply.

      The review gate requires the plan artifact to be ready-for-review.
    commands:
      - "{{SDLC}} planning-review --change <change-name> [--accept|--reject] [--failures <file>]"

  review:
    title: Review
    markdown: |
      Run the planning review against the tracked artifact.

      Report only failures, never passed checks: each failure as {check, evidence} with the check named, the evidence quoted rather than paraphrased, and the exact location (artifact, section, clause, or missing link). Mechanical failures are CLI-computed and listed in `data.failures`; walk the semantic checklist yourself and report its failures the same way. With zero failures report one line stating no failures plus the verdict.
      One failure line looks like:
      `dependency-acyclic`: "T-12 depends on T-7 and T-7 depends on T-12 (plan.yaml, tasks)"

      Name semantic checks exactly as the checklist declares them — a check name the checklist does not carry is refused and nothing is recorded.
      Issue the verdict through the CLI in this session: bare `--accept` accepts when mechanical checks pass; `--reject --failures <file>` records the failed semantic checks as a top-level YAML list of {check, evidence}. A bare invocation without a verdict flag only opens or refreshes the round — a review without a recorded verdict is incomplete.
      Report the finished review in one line: round, verdict, failures count.
    commands:
      - "{{SDLC}} planning-review --change {{change_name}}"

  accept:
    title: Accept
    markdown: |
      Accept the plan artifact when mechanical checks pass and the semantic checklist raised no failures.

      Run bare `--accept` — no findings file: the round is recorded accepted with `failures: []` and both valid flags true.
      If mechanical checks fail, acceptance is impossible: the round is forced rejected and the artifact is flipped to rejected — fix the recorded failures first.
    commands:
      - "{{SDLC}} planning-review --change {{change_name}} --accept"

  reject:
    title: Reject
    markdown: |
      Reject the plan artifact to send it back for corrections.

      When mechanical checks fail, bare `--reject` records the CLI-computed mechanical failures — no input needed.
      When mechanical checks pass, rejections are evidence-backed: `--reject --failures <file>` with a top-level YAML list of the failed semantic checks as {check, evidence}. The check must quote the checklist question verbatim — an undeclared name is refused and nothing is written:
      - check: "Are each task's acceptance criteria actually verifiable with clear pass/fail conditions?"
        evidence: "T-8 'improve error handling' names no observable pass condition (plan.yaml, tasks[7])."
    commands:
      - "{{SDLC}} planning-review --change {{change_name}} --reject --failures <file>"
