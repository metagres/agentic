version: 1
steps:
  needs_input:
    title: Needs input
    markdown: |
      Ask the user which change to plan.
    commands:
      - "{{SDLC}} planning --change <change-name>"

  init:
    title: Initialization
    markdown: |
      The script created the initial plan artifact.

      The required predecessor stages must be accepted before authoring begins.
    commands:
      - "{{SDLC}} planning --change {{change_name}}"

  authoring:
    title: Authoring
    markdown: |
      Draft the plan artifact.

      Use `data.next_ids` to choose the next TASK ids.

      While drafting, determine which living docs are affected by the plan and
      append delta entries via --append-delta (allowed targets:
      `data.delta_allowed_target_docs`) or include them in --update-artifact.
      Knowledge extraction dedupes.

      Write the artifact through the script.
    commands:
      - "{{SDLC}} planning --change {{change_name}} --next-ids"
      - "{{SDLC}} planning --change {{change_name}} --update-artifact < plan.yaml"
      - "{{SDLC}} planning --change {{change_name}} --append-delta < delta.yaml"
    complete_when:
      array: tasks
      min_items: 1

  recovery:
    title: Recovery
    markdown: |
      The plan artifact was rejected by review.

      Read `data.review_report`, fix blocking findings, update the artifact, and finalize again.
    commands:
      - "{{SDLC}} planning --change {{change_name}} --update-artifact < plan.yaml"
      - "{{SDLC}} planning --change {{change_name}} --finalize"

  ready:
    title: Ready
    markdown: |
      All gates passed.

      Finalize with --finalize --confirm-semantic.
    commands:
      - "{{SDLC}} planning --change {{change_name}} --finalize --confirm-semantic"

  complete:
    title: Complete
    markdown: |
      The plan artifact is ready for the review gate.
    commands:
      - "{{SDLC}} planning-review --change {{change_name}}"
