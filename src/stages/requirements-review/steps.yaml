version: 1
steps:
  needs_input:
    title: Needs input
    next_action: provide_change_dir
    markdown: |
      Ask the user which change to review and which decision to apply.

      The review gate requires the requirements artifact to be ready-for-review or accepted.
    commands:
      - "{{SDLC}} requirements-review --change <change-name> [--accept|--reject]"

  review:
    title: Review
    next_action: evaluate_findings
    markdown: |
      Run the requirements review against the tracked artifact.

      Report schema and structural findings plus the requirements semantic checklist.
      Accept only when the artifact is ready-for-review and has no blocking findings.
    commands:
      - "{{SDLC}} requirements-review --change {{change_name}}"

  accept:
    title: Accept
    next_action: set_accepted
    markdown: |
      Accept the requirements artifact after all blocking findings are resolved.
    commands:
      - "{{SDLC}} requirements-review --change {{change_name}} --accept"

  reject:
    title: Reject
    next_action: set_rejected
    markdown: |
      Reject the requirements artifact to send it back for corrections.
    commands:
      - "{{SDLC}} requirements-review --change {{change_name}} --reject"
