version: 1
checks:
  - check: sentence-count
    params:
      field: context_summary
      min: 1
      max: 12
  - check: unique-ids
    params:
      arrays:
        - components
        - data_models
        - apis
        - decisions
  - check: ref-exists
    params:
      from:
        array: components
        field: satisfies
      to:
        file: requirements.yaml
        arrays:
          - functional_requirements
          - non_functional_requirements
        field: id
  - check: ref-covers
    params:
      from:
        array: components
        field: satisfies
      to:
        file: requirements.yaml
        arrays:
          - functional_requirements
          - non_functional_requirements
        field: id
  - check: duplicate-refs
    params:
      array: components
      list_field: satisfies
