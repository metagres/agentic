version: 1
steps:
  needs_input:
    title: Needs input
    next_action: provide_change_or_request
    markdown: |
      Ask the user which change to design.
    commands:
      - "{{SDLC}} design --change <change-name>"

  init:
    title: Initialization
    next_action: initialize_context
    markdown: |
      The script created the initial design artifact.

      Ensure requirements.yaml exists and has a version.
    commands:
      - "{{SDLC}} design --change {{change_name}}"
    complete_when:
      field: metadata.based_on_requirements
      non_empty: true

  authoring:
    title: Authoring
    next_action: update_artifact
    markdown: |
      Draft the full design artifact.

      Use `data.next_ids` to choose the next CMP/DM/API/DEC ids.

      While drafting, determine which living docs are affected by the design and
      append delta entries via --append-delta (allowed targets:
      `data.delta_allowed_target_docs`) or include them in --update-artifact.
      Knowledge extraction dedupes.

      Write the artifact through the script.
    commands:
      - "{{SDLC}} design --change {{change_name}} --next-ids"
      - "{{SDLC}} design --change {{change_name}} --update-artifact < design.yaml"
      - "{{SDLC}} design --change {{change_name}} --append-delta < delta.yaml"
    complete_when:
      field: context_summary
      non_empty: true

  recovery:
    title: Recovery
    next_action: fix_review_findings
    markdown: |
      The design artifact was rejected by review.

      Read `data.review_report`, fix blocking findings, update the artifact, and finalize again.
    commands:
      - "{{SDLC}} design --change {{change_name}} --update-artifact < design.yaml"
      - "{{SDLC}} design --change {{change_name}} --finalize"

  ready:
    title: Ready
    next_action: finalize
    markdown: |
      All gates passed.

      Finalize with --finalize --confirm-semantic.
    commands:
      - "{{SDLC}} design --change {{change_name}} --finalize --confirm-semantic"

  complete:
    title: Complete
    next_action: invoke_review
    markdown: |
      The design artifact is ready for the review gate.
    commands:
      - "{{SDLC}} design-review --change {{change_name}}"
